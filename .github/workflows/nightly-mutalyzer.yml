name: Nightly reference-aware tests

# Runs every reference-aware test suite in the repository against a real
# ferro-prepared manifest — see `REFERENCE_AWARE_SELECTION` below for the list
# and for why it is enumerated rather than matched by pattern. PR CI silently
# skips these tests (see the `::notice::` annotation in `ci.yml`) because
# provisioning a multi-GB reference manifest would multiply PR CI time. This
# workflow runs nightly so manifest-dependent regressions surface within 24h.
#
# `FERRO_REQUIRE_MANIFEST` is set on the test step, so a guard that finds no
# prepared reference FAILS here instead of skipping green. Without it, the
# widened selection would be worth very little: a `ferro prepare` that produced
# nothing would still report a green — and faster — run.
#
# Caching: the prepared reference directory is keyed on the Cargo.lock
# hash (changes when the `prepare` crate's deps shift) + a fixed
# version tag. First run takes ~30 min; subsequent runs reuse the
# cache and finish in a few minutes.
#
# #397 item 6.

on:
  schedule:
    # Daily at 04:00 UTC. Avoids contention with the weekly Sunday
    # external-validation.yml run at 00:00 UTC.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-mutalyzer-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # NOTE: `MANIFEST_CACHE_VERSION` is gone along with the manifest cache it
  # keyed — see the block above the `ferro prepare` step for the measurement
  # that removed it (#1218). Its history is worth keeping for whoever restores
  # the cache: v2 added `--derive-ng-placements` so the prepared reference
  # carries derived NG_ placements + `ng_hosted_transcripts`, matching the
  # blessed reference (#875); v3 added `--ensembl` so the reference provisions
  # Ensembl cdot + cDNA, matching the Ensembl-inclusive blessed reference the
  # corpus identity is recorded against (#933). This workflow provisions
  # Ensembl and nightly-perf.yml deliberately does not — if both caches ever
  # come back, they must stay separate (#933).

jobs:
  reference-aware-tests:
    name: Reference-aware mutalyzer / biocommons tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Every reference-aware guard in the repository, defined ONCE because two
      # steps need them: the run itself, and the reproduction recipe the summary
      # step prints when that run fails. A second copy would drift — and it
      # would drift in the direction that matters least visibly, since a stale
      # recipe still looks like a working command to whoever pastes it.
      #
      # This is the same rule `scripts/run_oracle_suite.sh` applies to
      # `test-oracle`'s selection: read it from one place, never copy it.
      #
      # This list used to name three modules. The other 45 guards below were
      # manifest-gated, checked in, and executed by NO automated job — PR CI
      # provisions no manifest, so they skipped green there, and they were in no
      # nightly selection, so they skipped green here too. A skip is
      # indistinguishable from a pass in every signal CI reports; the runtime is
      # the only tell (0.02-0.08 s skipped against 9-58 s armed).
      #
      # That is not a hypothetical. `multi_member_cis_axis::axis_normalized` was
      # provably red on `main` from at least 2026-08-08 to 2026-08-10 — 13
      # merged commits, every PR green — because the guard took 0.04 s and
      # returned. It surfaced four days later as a test-only re-bless of its
      # census pin, and was then chased as an "inconsistency between worktrees".
      #
      # ENUMERATE, DO NOT GLOB. Widening this to a pattern was considered and
      # rejected: it imports the seven modules `ci.yml`'s `ORACLE_EXCLUDE`
      # withholds from an armed job, which fail on `main` for reasons no nightly
      # caused, and it makes the xfail artifact — the only channel a non-gating
      # job has — unreadable. The reproduce-text below says the same thing.
      #
      # ADDING A MANIFEST-GATED GUARD? Add its module here. `FERRO_REQUIRE_MANIFEST`
      # below cannot catch an omission from this list — it fires when a SELECTED
      # guard finds no manifest, not when an unselected one is never asked.
      REFERENCE_AWARE_SELECTION: >-
        test(/mutalyzer_normalize_tests::/) |
        test(/biocommons_normalize_tests::/) |
        test(/hgvs_rs_projection_tests::/) |
        test(/delins_equal_vs_unequal_length_discriminator::/) |
        test(/inversion_sweep::/) |
        test(/issue_1086_c_axis_genomic_context::/) |
        test(/issue_1086_cross_axis_projection::/) |
        test(/issue_1217_mito_terminus_insertion_clamp::/) |
        test(/issue_1539_split_member_separation::/) |
        test(/issue_1713_bare_transcript_genomic_decline::/) |
        test(/issue_498_whole_exon_deletion::/) |
        test(/issue_806_effect_real_residues::/) |
        test(/issue_843_allele_rna_build_scoping::/) |
        test(/issue_944_cds_to_tx_transcript_native::/) |
        test(/issue_972_cds_start_nf_decline::/) |
        test(/multi_member_cis_axis::/) |
        test(/protein_cis_delins_decomposition::/) |
        test(/real_data_normalization_tests::/) |
        test(/accession_inventory::tests::corpus_missing_ng_against_real_reference_when_available/) |
        test(/ng_placement_builder::tests::derive_for_real_reference_when_available/) |
        test(/coverage_gap_tests::issue_11::test_flt3_itd_insertion_position_order/) |
        test(/normalize_tests::real_repeat_tests::test_real_repeat_pattern/)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No `lfs: true`: nothing in this repository is LFS-tracked any more,
          # and none of the modules `REFERENCE_AWARE_SELECTION` above names reads
          # a bulk corpus (re-checked when the selection was widened; the four
          # release-asset corpora are read only by `clinvar_hgvs_tests`,
          # `cmrg_exhaustive_tests`, `paraphase_exhaustive_tests` and
          # `normalize_axis_preserving`, none of which is manifest-gated).
          submodules: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@8e83571c9a797c9e42a58141f098806bfec453a0  # nextest

      # Cargo caching is delegated to `Swatinem/rust-cache` rather than
      # hand-rolled `actions/cache` keys. The full measurement is recorded once,
      # above the equivalent step in `ci.yml`; in short, a hand-rolled entry
      # cached a whole `target/` and grew to ~3 GiB, and `actions/cache` skips
      # the save on a primary-key hit so a lockfile-only key froze that tree
      # permanently (#1218).
      #
      # The bare `${{ runner.os }}-cargo-` last-resort restore-key that used to
      # sit here was its own hazard: it is a prefix of every cargo cache in the
      # repository, so this job could restore a tree built by any other job
      # under a different profile. `rust-cache` keys per job, so there is no
      # cross-job fallback to get wrong.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Save a new cache generation ONLY from `main` (#1218 redux). `rust-cache`
          # keys per job and appends a lockfile/env hash, so every PR run that
          # differed in either minted a fresh ~0.2-0.7 GiB entry. Measured on
          # 2026-08-08: 42 entries totalling 13.79 GiB against a 10 GiB cap — 3 to 5
          # generations of every logical key, `coverage` alone holding 4 x ~0.69 GiB.
          # Over cap means GitHub evicts by LRU continuously, which is the #1218
          # failure (two generations reached 13.61 GiB and took the nightly's 3.25 GiB
          # `ferro-manifest-v3` with them). Restoring on every run and saving only on
          # `main` collapses it to one generation per key, ~4.2 GiB.
          #
          # The trade is nil for this workflow: it triggers on `schedule` and
          # `workflow_dispatch` only, so every run that could ever have saved an
          # entry is a scheduled one, which GitHub fires against the default
          # branch and which therefore satisfies the condition. The one run that
          # now declines to save is a `workflow_dispatch` from a non-`main`
          # branch, which restores
          # `main`'s generation through the `restore-keys` prefix instead. `ci.yml`
          # and `coverage.yml` are where the PR-side trade actually lands; it is
          # stated on their first `rust-cache` block.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: nightly-mutalyzer

      # The prepared reference is NOT cached. It used to be
      # (`Linux-ferro-manifest-v3-<hash>`, `path: benchmark-output/`), and that
      # cache was measured at **3.25 GiB with a 0 % hit rate** — see #1218.
      #
      # The repository's Actions cache budget is 10 GiB and PR CI alone mints
      # ~3 GiB per cargo entry across eight entries, so a 3.25 GiB nightly entry
      # was evicted by LRU long before the next night could use it. Measured on
      # five consecutive nights (runs 30606298814, 30685312545, 30733613038,
      # 30786830075, 30879794391): every one logged `Cache not found for input
      # keys: Linux-ferro-manifest-v3-…`, and four of the five asked for the
      # *identical* key, so this was eviction rather than key churn. The
      # 2026-08-04 run saved its entry at 05:43 and the entry was already gone
      # from `actions/caches` by 05:57.
      #
      # So the cache cost a third of the whole repository budget, evicted PR CI's
      # cargo caches as collateral (the failure mode #1218 records from the
      # reverted `bf70635`), and never once saved this job a `ferro prepare`. The
      # step below therefore always runs, which is what was already happening —
      # dropping the cache does not slow this workflow down, it only stops it
      # taking budget from workflows that can use it.
      #
      # If the cache budget is ever raised or PR CI's footprint shrinks enough to
      # leave 3.25 GiB spare, restore the cache from git history and re-add the
      # `if: steps.cache-manifest.outputs.cache-hit != 'true'` guard below. A
      # better answer may be to keep the reference out of the cache budget
      # entirely — Actions *artifacts* are billed and quota'd separately — but
      # that has storage-cost implications and belongs in its own change.
      - name: Build ferro (for prepare)
        run: cargo build --release --bin ferro

      - name: Run `ferro prepare`
        run: |
          ./target/release/ferro prepare \
            --output-dir benchmark-output \
            --genome grch38 \
            --ensembl \
            --derive-ng-placements tests/fixtures/mutalyzer-normalize/ng_accessions.txt

      - name: Confirm manifest present
        run: |
          test -f benchmark-output/manifest.json || \
            (echo "::error::manifest.json missing after prepare step"; exit 1)
          echo "manifest size: $(stat -c%s benchmark-output/manifest.json) bytes"

      - name: Run reference-aware tests
        id: reference-aware-tests
        # Failures are NOT propagated to the workflow conclusion — the
        # purpose of the nightly is to surface drift in the xfail report,
        # not to gate PRs. (PR CI's strict-mode test job already covers
        # manifest-free correctness.) Use step-level continue-on-error
        # rather than `|| true` so the step's failure outcome remains
        # visible in the GitHub Actions UI (steps.<id>.outcome stays
        # `failure`), while the workflow conclusion stays `success`.
        continue-on-error: true
        env:
          FERRO_MANIFEST: ${{ github.workspace }}/benchmark-output/manifest.json
          # A manifest-absence skip is a FAILURE here, never a green pass. Every
          # guard in the selection above `return`s early when it finds no
          # prepared reference, so without this a `ferro prepare` that produced
          # nothing — or a manifest written where the test step cannot see it —
          # would delete the entire reference-aware surface and report a
          # *faster* green run. That is the same outcome `FERRO_REQUIRE_BULK_FIXTURES`
          # exists to prevent in `ci.yml`, and this is deliberately the same
          # mechanism rather than a second convention:
          # `src/conformance/manifest_gate.rs`.
          #
          # This job is the only one that runs `ferro prepare`, so it is the
          # only one that may set this. PR CI must not — see the annotation step
          # in `ci.yml`, which says so at the point someone would be tempted.
          FERRO_REQUIRE_MANIFEST: "1"
          # This is the only job that provisions a manifest, so it is the only
          # place the idempotency oracle sees the reference-backed corpora at
          # all (PR CI's copy of this gate runs manifest-free — see the
          # "reference-aware tests are skipped without a manifest" annotation
          # in ci.yml). The corpus runner wraps normalization in
          # `catch_panics`, so an oracle panic surfaces as that case FAILing
          # its axis tally and landing in the xfail report, not as a lost run.
          FERRO_ASSERT_IDEMPOTENT: "1"
          # And that a normalized description re-parses when normalization is
          # what broke it — the `0`/`?` outputs and inputs that do not
          # themselves re-parse are exempt; see the note beside the same pair
          # in ci.yml.
          FERRO_ASSERT_REPARSE: "1"
          # And that no coordinate it names is past the end of its own sequence
          # (#1353). This job is the only one with a real prepared reference, so
          # it is the only place the check runs against true transcript and contig
          # lengths rather than a fixture's; an authored overrun is exempt, since
          # W4004 `PositionPastEnd` is what reports those.
          #
          # Non-gating here, like the two above it: `continue-on-error` on this
          # step means a fire lands in the xfail report rather than failing the
          # workflow (see the comment on the step). The gate for this oracle is
          # ci.yml's `test-oracle` and `sweeps` jobs, which set the same flag and
          # carry no `continue-on-error`.
          FERRO_ASSERT_IN_BOUNDS: "1"
          # And that the normalized description denotes the same bases the input
          # does (#1615). Worth setting here for the same reason as the one above
          # it: the conformance corpora are real transcripts and contigs, so this
          # is the only place the comparison runs over reference geometry a
          # fixture cannot build — real exon structure, real 5'UTRs, real
          # soft-masked bases. Non-gating here like the other three.
          FERRO_ASSERT_SEQUENCE: "1"
        run: |
          # `--profile nightly-xfail` writes JUnit to
          # target/nextest/nightly-xfail/junit.xml (see .config/nextest.toml).
          # The set of FAILING tests in that report is what the "Diff FAIL set
          # against xfail baseline" step below gates on — NOT this step's
          # `continue-on-error` conclusion, which is `success` whenever the only
          # thing that failed is the run (#1998).
          cargo nextest run --features dev --profile nightly-xfail -E "$REFERENCE_AWARE_SELECTION"

      # The reproduction recipe for the failure this job actually produces.
      #
      # It lives HERE, and not in `report-failure`'s `hint:` below, because
      # `report-failure` is `if: failure()` and the step above is
      # `continue-on-error: true` — so the test run's own failure never fails the
      # job by itself, and this armed reproduction recipe is what a reader needs
      # when a test fails. The failures that DO reach `report-failure` are the
      # xfail-diff step's drift verdict and infrastructure breakage (checkout,
      # `ferro prepare`, a missing manifest) — for both of which an armed re-run
      # is the wrong first move (read the drift report / the failing step's log
      # first), which is why that hint points there instead.
      #
      # Keyed on `outcome`, not `conclusion`: `continue-on-error` rewrites the
      # latter to `success` while the former stays `failure`, which is exactly
      # the distinction the step above documents.
      #
      # Non-gating like the run itself — it only writes to the job summary, so
      # it cannot turn the nightly red.
      - name: Explain how to reproduce a failed run
        if: always() && steps.reference-aware-tests.outcome == 'failure'
        env:
          # Through `env:` rather than interpolated into `run:` — a `${{ }}`
          # expansion is spliced in as text before the shell parses the script,
          # which is the template-injection shape `zizmor` flags. Harmless for a
          # run id, but the habit is what the rule is protecting.
          XFAIL_ARTIFACT: ferro-xfail-${{ github.run_id }}
        run: |
          {
            echo "## Reference-aware tests failed"
            echo
            echo "These axes only run with a prepared reference (\`FERRO_MANIFEST\`), so they"
            echo "cannot run on a pull request. Reproduce on a box with the reference, with the"
            echo "same four oracles armed and over the same modules:"
            echo
            echo '```'
            echo "FERRO_MANIFEST=<ref>/manifest.json \\"
            echo "  FERRO_ASSERT_IDEMPOTENT=1 FERRO_ASSERT_REPARSE=1 \\"
            echo "  FERRO_ASSERT_IN_BOUNDS=1 FERRO_ASSERT_SEQUENCE=1 \\"
            echo "  cargo nextest run --features dev -E '${REFERENCE_AWARE_SELECTION}'"
            echo '```'
            echo
            echo "Keep the \`-E\` selection, and keep it ENUMERATED. Dropping it while keeping the"
            echo "flags — or replacing it with a pattern — widens the run onto the modules"
            echo "\`ci.yml\`'s \`ORACLE_EXCLUDE\` withholds from an armed job, which fail on"
            echo "\`main\` for reasons no nightly caused — see that variable's comment, and"
            echo "\`scripts/run_oracle_suite.sh\` for the local runner that applies the same"
            echo "exclusion."
            echo
            echo "\`FERRO_REQUIRE_MANIFEST=1\` is set in this job so a guard that finds no"
            echo "prepared reference FAILS rather than skipping green. If you reproduce"
            echo "without a manifest, leave it unset — otherwise every selected guard fails"
            echo "for that reason and tells you nothing about the run you are chasing."
            echo
            echo "A moved conformance baseline is re-blessable; a new live divergence is not."
            echo "Read which it is out of the \`${XFAIL_ARTIFACT}\` artifact"
            echo "attached to this run — an oracle fire lands there as a FAILing case rather"
            echo "than as a failed workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      # THE GATE. #1998: the step above is `continue-on-error`, so its
      # conclusion is `success` whether 38 tests fail or 39 do — a new failure
      # is indistinguishable from the known set, and "surface drift" only works
      # if a human remembers yesterday's artifact. This step closes that: it
      # diffs the run's actual FAIL set (from the JUnit report) against the
      # committed baseline and FAILS THE JOB on any drift.
      #
      #   - a NEW failure (failing now, not baselined)      -> red
      #   - an UNEXPECTED PASS (baselined, now passing/gone) -> red
      #   - a missing or unparseable JUnit report            -> red
      #   - an exact match                                   -> green
      #
      # What it compares is the set of FAILING TESTS. It is blind to drift
      # *inside* a baselined test — a comparator axis that moves from 30 pass /
      # 57 FAIL to 0 pass / 87 FAIL over its own inputs leaves the id set
      # byte-identical, and this step reports an exact match. That per-input
      # movement is still IN the run, on the axis summary line and in the
      # `ferro-xfail-*` artifact; nothing diffs it. See
      # `tests/fixtures/nightly-reference-aware/README.md`.
      #
      # It carries NO `continue-on-error`, so its non-zero exit turns the
      # nightly red and `report-failure` opens a tracking issue. Regenerating
      # the baseline after a deliberate change is `--update-baseline` (see the
      # script and `tests/fixtures/nightly-reference-aware/README.md`).
      #
      # `python3` is preinstalled on `ubuntu-latest`; the script is stdlib-only.
      - name: Diff FAIL set against xfail baseline
        id: xfail-diff
        # Run whenever the test step actually executed (passed or failed via
        # continue-on-error), but not when an earlier infra step (checkout,
        # prepare, missing manifest) skipped it — that failure is `report-failure`'s.
        if: always() && (steps.reference-aware-tests.outcome == 'success' || steps.reference-aware-tests.outcome == 'failure')
        env:
          JUNIT: target/nextest/nightly-xfail/junit.xml
          BASELINE: tests/fixtures/nightly-reference-aware/xfail-baseline.txt
        run: |
          set -euo pipefail
          # `pipefail` is set HERE because the shell does not supply it. A step
          # naming no `shell:` runs under `bash -e {0}`, where a pipeline's exit
          # status is its LAST command's — so the `tee` below reported 0 while
          # the diff exited 1, and this gate could not go red (#2082). Only an
          # explicit `shell: bash` expands with `-eo pipefail`.
          # `tests/it/workflow_pipefail_gate.rs` checks that repo-wide.

          # A missing JUnit report FAILS. This step's `if:` says the test step
          # ran, so an absent report means nextest died before writing one —
          # diffing nothing against the baseline would otherwise report every
          # baselined id as an "unexpected pass", and the exit-2 that raises
          # was swallowed by the same `tee`.
          if [ ! -f "$JUNIT" ]; then
            echo "::error::the reference-aware test step ran but wrote no JUnit report at ${JUNIT}"
            exit 1
          fi
          # Keep the JUnit report in the uploaded artifact for offline triage.
          mkdir -p /tmp/ferro-xfail
          cp "$JUNIT" /tmp/ferro-xfail/junit.xml
          python3 scripts/diff_nightly_xfail_baseline.py \
            --junit "$JUNIT" --baseline "$BASELINE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload xfail reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ferro-xfail-${{ github.run_id }}
          path: /tmp/ferro-xfail/
          if-no-files-found: warn

  report-failure:
    needs: reference-aware-tests
    if: failure()
    uses: ./.github/workflows/report-failure.yml
    permissions:
      contents: read
      issues: write
    with:
      title: "nightly reference-aware tests failed"
      summary: >-
        The nightly manifest-backed conformance run failed.
      hint: |
          **First read `Diff FAIL set against xfail baseline` in the run — it is the one gating step (#1998).** The test step itself carries `continue-on-error: true`, so a fired oracle or an individual test failure does not reach this issue; it lands in the `ferro-xfail-*` artifact and the job summary. This job goes red, and this issue opens, for exactly two reasons:
          1. **Xfail drift** — the diff step found the reference-aware FAIL set no longer matches `tests/fixtures/nightly-reference-aware/xfail-baseline.txt`: a **new failure** (a regression, or an upstream reference change) or an **unexpected pass** (a baselined test now passes, so the baseline must be updated). Its report is in the job summary. A moved baseline is re-blessable with `--update-baseline`; a new live divergence is not — read which it is out of the summary and the `ferro-xfail-*` artifact before deciding.
          2. **Infrastructure** — something before or around the tests broke: the checkout, the `ferro` build, `ferro prepare`, a manifest that never appeared, or the artifact upload. If the diff step never ran (it is skipped when the test step is), it is this. Start from the failing step's own log rather than from a re-run of the axes — these axes only run with a prepared reference (`FERRO_MANIFEST`) and cannot run on a pull request.
          `ferro prepare` runs on every night's run — the prepared reference is deliberately not cached (see the comment above that step) — so it fetches from NCBI and Ensembl each time, and an upstream fetch is the most likely thing to have broken.
