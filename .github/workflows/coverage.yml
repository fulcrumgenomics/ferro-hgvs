name: Coverage

# Runs on pull requests as well as on `main`. Until #1225 this workflow was
# push-only, which made it structurally incapable of failing before a merge:
# a break landed on `main` and stayed there for 15 commits while every PR in
# that window reported a full green board, because `Coverage` is also not one
# of the required status contexts. Running it on PRs costs nothing on a public
# repo and is what makes the signal actionable at the point a human can still
# act on it.
#
# Deliberately NOT added to the required-status-check ruleset. The gate worth
# having is "the suite compiles and passes under llvm-cov instrumentation",
# which this provides as a visible check; gating on a coverage *percentage*
# rewards touching lines rather than catching bugs. Promotion to a required
# context is a separate decision to take once it has proven stable — and note
# that required contexts match on exact job name, so a rename silently yields
# "Expected — Waiting for status to be reported" (see #1216).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Sharded, because this is the longest job in the repository and the only long
  # one that was not: 609s against 353s for the next slowest, all of it one step,
  # on one runner.
  #
  # `cargo llvm-cov` with no subcommand shells out to `cargo test`, which offers
  # no way to partition. `cargo llvm-cov nextest` does, and that is the ONLY
  # reason nextest is back here: unsharded it was measured **worse** — 566s ->
  # 649s for the run step — because nextest gives each of ~10,400 tests its own
  # process and llvm-cov must merge a `.profraw` per process, so its cost scales
  # with the test count that is meant to be its advantage. Sharding is what pays
  # for that merge: the per-shard test set is a quarter the size, and four
  # runners absorb it in parallel.
  #
  # Codecov merges the four uploads for a commit server-side, which is the
  # ordinary matrix-build path and needs no merge job here.
  #
  # Doctests are NOT here — see the `doctests` job below for why they exist at
  # all and why they are not a coverage shard.
  coverage:
    name: Code Coverage (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No `lfs: true`: nothing in this repository is LFS-tracked any more.
          # The bulk corpora this run reads are fetched from the
          # `test-fixtures-v1` release by the step below.
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@3f7f2bd74f95d407a45d96b106f26d4f6c238fab  # cargo-llvm-cov
      # Partitioning is a nextest feature; see the note on the job above for why
      # that is the whole reason it is here. Same pinned revision `ci.yml` uses.
      - uses: taiki-e/install-action@8e83571c9a797c9e42a58141f098806bfec453a0  # nextest
      # Cargo caching is delegated to `Swatinem/rust-cache` (#1218) — see the
      # full rationale on the first such step in `ci.yml`. In short: the
      # hand-rolled entries had grown to ~3 GiB each because they cached a whole
      # `target/`, and `actions/cache` never re-saves on a primary-key hit, so
      # they also froze.
      #
      # This one was among the three biggest measured (2.87 GB on 2026-08-04), and
      # it must stay a separate entry: coverage instrumentation re-fingerprints
      # every dependency, so a tree shared with any other job is useless to both.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Save a new cache generation ONLY from `main` (#1218 redux). `rust-cache`
          # keys per job and appends a lockfile/env hash, so every PR run that
          # differed in either minted a fresh ~0.2-0.7 GiB entry. Measured on
          # 2026-08-08: 42 entries totalling 13.79 GiB against a 10 GiB cap — 3 to 5
          # generations of every logical key, `coverage` alone holding 4 x ~0.69 GiB.
          # Over cap means GitHub evicts by LRU continuously, which is the #1218
          # failure (two generations reached 13.61 GiB and took the nightly's 3.25 GiB
          # `ferro-manifest-v3` with them). Restoring on every run and saving only on
          # `main` collapses it to one generation per key, ~4.2 GiB.
          #
          # The trade, stated: a PR that changes `Cargo.lock` no longer warms its own
          # cache, so it restores `main`'s generation through the `restore-keys`
          # prefix and recompiles what the lockfile moved. That is one slower job on
          # dependency-bumping PRs, against every cache in the repo currently racing
          # eviction.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # ONE key across all four shards, deliberately. `--partition hash:K/N`
          # is a nextest RUNTIME filter: every shard compiles the identical
          # `target/`, so a per-shard key would store four copies of one tree.
          # That is not a hypothetical cost — this entry measured 737 MB, and the
          # repository's cache sits at 10.73 GB against a 10 GiB cap (146 entries,
          # 2026-08-13), so four generations would add ~2.2 GB to a budget already
          # at 100% and evict by LRU. #1218 records that exact failure taking the
          # nightly's 3.25 GB `ferro-manifest-v3` with it.
          #
          # Four shards racing one key on `main` is benign: the first save wins
          # and the rest no-op on "cache already exists".
          key: coverage
          # This job needs it too, and needs it more than `ci.yml`'s two do
          # (#1396). `install-action` puts `cargo-llvm-cov` into
          # `${CARGO_HOME}/bin` at the step ABOVE this one, so with `cache-bin`
          # left at its default the restore runs *after* the install and can
          # extract a previously-saved `cargo-llvm-cov` over it — pinning this
          # job to whichever version first populated the key. In `test-build` the
          # cache step at least runs first; here the hazardous order is the one
          # already written.
          cache-bin: "false"
      # A separate workflow, so it cannot consume `ci.yml`'s `bulk-fixtures`
      # artifact — it fetches the same four release assets itself. Unmetered, so
      # the second fetch costs nothing that LFS used to charge for.
      #
      # `set -euo pipefail` is implied by the script's own `set -e`; a failed
      # download, a digest mismatch or a missing asset exits non-zero and fails
      # the job, which is required: the bulk suites skip green without their
      # fixtures, so a quiet failure would drop that coverage from the coverage
      # report while looking like a pass.
      - name: Fetch and verify the bulk fixtures
        run: scripts/fetch-test-fixtures.sh
      - name: Run coverage
        env:
          # Absence of a bulk fixture fails the run rather than skipping it.
          FERRO_REQUIRE_BULK_FIXTURES: "1"
        run: |
          # EXPERIMENT (isolated carve-out, no profile change): skip the heavy
          # census/confluence tests, which measure ~90% of the coverage wall and
          # exercise normalization paths hundreds of cheaper tests also cover.
          # The report still instruments those source files, so the codecov delta
          # vs `main` is exactly the coverage those tests contributed uniquely.
          cargo llvm-cov --no-report nextest --features dev \
            --partition hash:${{ matrix.shard }}/4 \
            -E 'not (test(conformance_census_runs) or test(spec_conformance_axis) or test(cis_confluence))'
          cargo llvm-cov report --codecov --output-path codecov.json
          cargo llvm-cov report --html --output-dir coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: codecov.json
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report-${{ matrix.shard }}
          path: coverage/
          retention-days: 30

  # Doctests, in a job of their own.
  #
  # They have to run SOMEWHERE: `nextest` does not run them, this repository has
  # 230, and `cargo llvm-cov` with no subcommand — the form this workflow used
  # before it was sharded — ran them via `cargo test`. Dropping them when the
  # coverage job moved to nextest would have been a speedup made of deleted
  # checks, which is the failure mode this whole branch keeps running into.
  #
  # They are not a coverage shard, and that is deliberate rather than a
  # simplification: `cargo llvm-cov` excludes doctest coverage unless
  # `--doctests` is passed, which needs nightly. So their coverage was never
  # counted here, before or after, and instrumenting them would buy nothing while
  # adding a fifth `.profraw` set for Codecov to merge.
  #
  # Why a job rather than a step on shard 1, which is where they started: at 82s
  # they were a serial tail on one shard, so `Code Coverage (1/4)` finished at
  # 458s against its siblings' ~370s and set the whole workflow's wall clock. A
  # job runs them concurrently with the four shards instead of after one of them.
  #
  # It needs no `cargo-llvm-cov`, no bulk fixtures (no doctest reads one) and no
  # instrumentation, so it is a plain cached `cargo test --doc`. It shares the
  # coverage cache key: the compiled dependency tree is the same one, and a key of
  # its own would mint another ~737 MB entry against a budget already at its cap.
  doctests:
    name: Doctests
    runs-on: ubuntu-latest
    # 60, not 15: `cargo test --doc` compiles Rust, which is ci.yml's stated
    # criterion for that tier. The cache above is restore-only on a PR and is
    # shared with `main`'s entry, so a cold full build is on the table here even
    # though the 60 warm runs measured for the sizing table peak at 151s.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The spec generators resolve citations against the vendored checkout;
          # a doctest that reaches one needs it present rather than empty.
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Restore-only on a PR and shared with the shards above, for the reasons
          # given on that job's cache step.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: coverage
          cache-bin: "false"
      - name: Doctests
        run: cargo test --doc --features dev

  report-failure:
    needs: [coverage, doctests]
    if: failure()
    uses: ./.github/workflows/report-failure.yml
    permissions:
      contents: read
      issues: write
    with:
      title: "coverage: the test suite fails under llvm-cov"
      summary: >-
        The `Coverage` workflow failed. This usually means the suite does not build or pass under llvm-cov instrumentation, not that coverage dropped.
      hint: |
          Reproduce locally:
          ```
          cargo llvm-cov --features dev --workspace
          ```
          A frequent cause is a test that shells out to `cargo` without forwarding `--target-dir`: llvm-cov builds into `target/llvm-cov-target/`, which a nested cargo does not inherit (#1225).
