name: Coverage

# Runs on pull requests as well as on `main`. Until #1225 this workflow was
# push-only, which made it structurally incapable of failing before a merge:
# a break landed on `main` and stayed there for 15 commits while every PR in
# that window reported a full green board, because `Coverage` is also not one
# of the required status contexts. Running it on PRs costs nothing on a public
# repo and is what makes the signal actionable at the point a human can still
# act on it.
#
# Deliberately NOT added to the required-status-check ruleset. The gate worth
# having is "the suite compiles and passes under llvm-cov instrumentation",
# which this provides as a visible check; gating on a coverage *percentage*
# rewards touching lines rather than catching bugs. Promotion to a required
# context is a separate decision to take once it has proven stable — and note
# that required contexts match on exact job name, so a rename silently yields
# "Expected — Waiting for status to be reported" (see #1216).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No `lfs: true`: nothing in this repository is LFS-tracked any more.
          # The bulk corpora this run reads are fetched from the
          # `test-fixtures-v1` release by the step below.
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@3f7f2bd74f95d407a45d96b106f26d4f6c238fab  # cargo-llvm-cov
      # Cargo caching is delegated to `Swatinem/rust-cache` (#1218) — see the
      # full rationale on the first such step in `ci.yml`. In short: the
      # hand-rolled entries had grown to ~3 GiB each because they cached a whole
      # `target/`, and `actions/cache` never re-saves on a primary-key hit, so
      # they also froze.
      #
      # This one was among the three biggest measured (2.87 GB on 2026-08-04), and
      # it must stay a separate entry: coverage instrumentation re-fingerprints
      # every dependency, so a tree shared with any other job is useless to both.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          # Save a new cache generation ONLY from `main` (#1218 redux). `rust-cache`
          # keys per job and appends a lockfile/env hash, so every PR run that
          # differed in either minted a fresh ~0.2-0.7 GiB entry. Measured on
          # 2026-08-08: 42 entries totalling 13.79 GiB against a 10 GiB cap — 3 to 5
          # generations of every logical key, `coverage` alone holding 4 x ~0.69 GiB.
          # Over cap means GitHub evicts by LRU continuously, which is the #1218
          # failure (two generations reached 13.61 GiB and took the nightly's 3.25 GiB
          # `ferro-manifest-v3` with them). Restoring on every run and saving only on
          # `main` collapses it to one generation per key, ~4.2 GiB.
          #
          # The trade, stated: a PR that changes `Cargo.lock` no longer warms its own
          # cache, so it restores `main`'s generation through the `restore-keys`
          # prefix and recompiles what the lockfile moved. That is one slower job on
          # dependency-bumping PRs, against every cache in the repo currently racing
          # eviction.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: coverage
          # This job needs it too, and needs it more than `ci.yml`'s two do
          # (#1396). `install-action` puts `cargo-llvm-cov` into
          # `${CARGO_HOME}/bin` at the step ABOVE this one, so with `cache-bin`
          # left at its default the restore runs *after* the install and can
          # extract a previously-saved `cargo-llvm-cov` over it — pinning this
          # job to whichever version first populated the key. In `test-build` the
          # cache step at least runs first; here the hazardous order is the one
          # already written.
          cache-bin: "false"
      # A separate workflow, so it cannot consume `ci.yml`'s `bulk-fixtures`
      # artifact — it fetches the same four release assets itself. Unmetered, so
      # the second fetch costs nothing that LFS used to charge for.
      #
      # `set -euo pipefail` is implied by the script's own `set -e`; a failed
      # download, a digest mismatch or a missing asset exits non-zero and fails
      # the job, which is required: the bulk suites skip green without their
      # fixtures, so a quiet failure would drop that coverage from the coverage
      # report while looking like a pass.
      - name: Fetch and verify the bulk fixtures
        run: scripts/fetch-test-fixtures.sh
      - name: Run coverage
        env:
          # Absence of a bulk fixture fails the run rather than skipping it.
          FERRO_REQUIRE_BULK_FIXTURES: "1"
        run: |
          cargo llvm-cov --features dev --codecov --output-path codecov.json
          cargo llvm-cov report --html --output-dir coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: codecov.json
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  report-failure:
    needs: coverage
    if: failure()
    uses: ./.github/workflows/report-failure.yml
    permissions:
      contents: read
      issues: write
    with:
      title: "coverage: the test suite fails under llvm-cov"
      summary: >-
        The `Coverage` workflow failed. This usually means the suite does not build or pass under llvm-cov instrumentation, not that coverage dropped.
      hint: |
          Reproduce locally:
          ```
          cargo llvm-cov --features dev --workspace
          ```
          A frequent cause is a test that shells out to `cargo` without forwarding `--target-dir`: llvm-cov builds into `target/llvm-cov-target/`, which a nested cargo does not inherit (#1225).
