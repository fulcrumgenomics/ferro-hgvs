# Reusable failure reporter for workflows whose red X would otherwise be
# decoration.
#
# A workflow that only ever runs after a merge — on a schedule, or on push to
# `main` — has no way to stop the break it detects. Its red X is decoration
# unless something turns it into work somebody sees. Before this existed, six
# of the seven such workflows here had no alerting at all, and `Coverage`
# demonstrated the consequence: it stayed red for 15 commits (`92da6d0` ..
# `e90dff2`) while every pull request in that window reported a full green
# board (#1225, #1226).
#
# NOT every caller is post-merge-only, and assuming so is what this file got
# wrong. `coverage.yml` runs on `pull_request` as well as on `main` — added by
# #1225, the same change that motivated this reporter — so one of the six
# callers CAN fail before a merge. The issue body therefore derives its
# provenance sentence from `github.event_name` rather than stating a fixed
# claim; see the comment on that branch below. Adding a `pull_request` trigger
# to another caller needs no change here, which is the point.
#
# `nightly-soak` already had the right pattern and this is a straight
# generalisation of it: ONE rolling issue per workflow, updated rather than
# re-filed, so a defect that reproduces nightly does not bury the tracker.
#
# Usage — add a job to the caller, gated on `failure()`:
#
#     report:
#       needs: [<the job(s) that can fail>]
#       if: failure()
#       uses: ./.github/workflows/report-failure.yml
#       with:
#         title: "nightly perf: startup budget exceeded"
#         summary: "The startup perf budget was exceeded."
#         hint: |
#           Reproduce locally with:
#           ```
#           cargo run --release --bin ferro -- ...
#           ```
#       permissions:
#         contents: read
#         issues: write
#
# `needs:` matters. `if: failure()` alone is true when *any* earlier job in the
# run failed, but without `needs` the reporter can start before the job it is
# reporting on has finished.
name: Report failure

on:
  workflow_call:
    inputs:
      title:
        description: >-
          Issue title. Must be STABLE for a given failure mode — it is the
          lookup key for the rolling issue, so anything varying per run (a
          date, a run id, a shard number) would file a fresh issue every time
          and defeat the whole point.
        required: true
        type: string
      summary:
        description: One-line statement of what failed.
        required: true
        type: string
      hint:
        description: >-
          Optional reproduction guidance appended to the body. Markdown.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  report:
    name: Open or update the tracking issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh issue list|comment|create` are repo-scoped commands: with no
          # `--repo`, `gh` resolves the target by shelling out to `git` in the
          # working directory. This job has no `actions/checkout` — it only
          # touches the API — so that lookup died on every invocation with
          #
          #     failed to run git: fatal: not a git repository
          #
          # and the reporter exited 1 without filing anything. `GH_REPO` supplies
          # the target directly and skips the git lookup, which is cheaper than
          # adding a checkout for a job that never reads the tree.
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ inputs.title }}
          SUMMARY: ${{ inputs.summary }}
          HINT: ${{ inputs.hint }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          # The provenance sentence below is derived from THIS RUN rather than
          # asserted about the workflow, because the assertion went stale the
          # moment one caller gained a `pull_request` trigger. In a
          # `workflow_call`, both of these describe the caller's own triggering
          # event, which is exactly the fact a reader needs.
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # `--search "<title> in:title"` is a fuzzy full-text match, so an
          # unrelated issue whose title merely contains these words could come
          # back first. Filter for an exact title match before treating a hit
          # as "the" rolling issue — otherwise a comment lands on a stranger's
          # issue and the real one is never created.
          #
          # The comparison reads the title through jq's `env`, not by
          # interpolating it into the jq program: a title containing a quote
          # would otherwise produce a malformed filter, and the value is
          # workflow-supplied input.
          #
          # The lookup must not be able to abort the step. It runs under
          # `set -e` and is the FIRST thing this job does, so any transient
          # failure — a rate limit, a search-API blip — kills the reporter
          # before the `gh issue create` fallback below is ever reached, and
          # the alerting path fails silently underneath the failure it exists
          # to announce. That is the exact shape of the defect that left this
          # job broken. Filing a duplicate is strictly better than filing
          # nothing, so a failed lookup degrades to "no rolling issue found"
          # and says so in the log.
          #
          # Only the LOOKUP is forgiving. If `gh issue comment` or `gh issue
          # create` fails, nothing was recorded anywhere and the step must go
          # red — that is the last remaining signal.
          if ! EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title \
            --jq '[.[] | select(.title == env.TITLE)] | .[0].number // empty'); then
            echo "::warning::rolling-issue lookup failed; filing a new issue instead of commenting"
            EXISTING=""
          fi
          # Provenance, derived rather than asserted. The previous text was the
          # fixed sentence "This workflow does not run on pull requests, so this
          # failure could not have been caught before merge" — true of five of
          # the six callers and FALSE of `coverage.yml`, which gained a
          # `pull_request` trigger in the very change that created this reporter
          # (#1225). It failed in the misleading direction: it excused a failure
          # that WAS visible on the pull request, and told the reader not to look
          # where the answer was.
          #
          # Keying on `github.event_name` states a fact about this run, which
          # cannot go stale when a caller's triggers change.
          # Both reads are `${VAR:-}`, not `$VAR`, and that is load-bearing rather
          # than defensive habit. The step runs under `set -u`, so a bare `$EVENT`
          # aborts it when the variable is absent — and aborting here means the
          # reporter files NOTHING, which is the exact failure
          # `report_failure_degrades` exists to prevent. That test caught this by
          # executing the block standalone; it is not reachable from real CI,
          # where `env:` always supplies both, so nothing but the test would have
          # said so.
          if [ "${EVENT:-}" = "pull_request" ]; then
            WHERE="pull request"
            if [ -n "${PR_NUMBER:-}" ]; then
              WHERE="pull request #${PR_NUMBER}"
            fi
            PROVENANCE="_This run was triggered by a ${WHERE}, so the failure is visible there and can be fixed before merge — check that pull request before treating this as a post-merge break._"
          else
            PROVENANCE="_This run was triggered by \`${EVENT:-unknown}\`, not by a pull request, so this failure was not visible on a pull request before the commit landed._"
          fi
          BODY=$(printf '%s\n' \
            "$SUMMARY" \
            "" \
            "- Workflow: \`$WORKFLOW\`" \
            "- Commit: \`$SHA\`" \
            "- Run: $RUN_URL" \
            "" \
            "$HINT" \
            "" \
            "$PROVENANCE One rolling issue is used per failure mode; repeat occurrences are added as comments.")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
