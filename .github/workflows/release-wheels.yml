name: Build and publish Python wheels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to upload wheels to (leave blank to build without uploading — dry-run)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-wheels-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

# Only a VERSION tag builds and publishes wheels. `release: published` carries no
# tag filter of its own — GitHub offers none for that event — so without this
# guard *any* release fires the whole matrix, uploads wheels onto it and attempts
# a PyPI publish. That is not hypothetical: the `test-fixtures-v1` data release
# (which hosts the bulk test corpora, since Git LFS bandwidth is metered)
# triggered exactly that and had to be cancelled by hand.
#
# `workflow_dispatch` is deliberately NOT gated: the dry-run form takes a blank
# tag, and its `upload`/`publish-pypi` jobs already require `github.event_name ==
# 'release'` or a non-empty tag input.
#
# The condition is repeated on each of the four building jobs rather than hoisted
# into `env:` — a job-level `if:` cannot read the `env` context. Everything
# downstream (`check-metadata`, the two smoke matrices, `upload`, `publish-pypi`,
# `verify-pypi`) reaches these four through `needs:` and so skips with them.

jobs:
  # abi3 wheels: one wheel per (OS, arch) tagged `cp310-abi3`, runs on
  # every CPython >= 3.10. The `-i python<X>` flag is omitted so maturin
  # builds against pyo3's `abi3-py310` limited-API target (set in
  # `Cargo.toml`). See
  # https://pyo3.rs/main/building-and-distribution.html#py_limited_apiabi3
  # and https://www.maturin.rs/bindings#py_limited_apiabi3
  linux:
    name: Linux ${{ matrix.target }} ${{ matrix.manylinux }}
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          - runner: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --features python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.target }}
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
            # macOS deployment target floor for the wheel. Pinned
            # explicitly (rather than inherited from setup-python's
            # build target) so a runner-image refresh that bumps the
            # default min-target doesn't silently move the abi3 wheel's
            # macOS floor on us.
            macosx_deployment_target: "10.13"
          - runner: macos-14
            target: aarch64
            # Apple Silicon: Python 3.10 on arm64 requires macOS 11+.
            macosx_deployment_target: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  windows:
    name: Windows
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64-pc-windows-msvc
          args: --release --out dist --features python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows
          path: dist
          if-no-files-found: error

  sdist:
    name: sdist
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist
          if-no-files-found: error

  check-metadata:
    name: Check package metadata
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Install dev dependencies
        run: uv sync --group dev --locked --no-install-project
      - name: Run twine check
        run: uv run --no-sync twine check --strict dist/*

  smoke-test:
    # Verify the abi3 promise: each OS/arch produces a single
    # `cp310-abi3` wheel, and that wheel installs and imports under
    # every supported CPython minor version (3.10..3.14). 3.14 is
    # included so a future CPython release surfaces ABI breakage in the
    # release pipeline rather than at customer install-time.
    name: Smoke ${{ matrix.runner }} py${{ matrix.python-version }}
    needs: [linux, macos, windows]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Install built wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --only-binary :all: --find-links dist ferro-hgvs
      - name: Smoke test (import + parse + eq_int pyclass)
        shell: bash
        # Exercise the abi3 surface beyond just `parse`: pyclass `__eq__`
        # / `__hash__` / `__str__`, an `eq, eq_int` pyclass enum
        # (Consequence), and a constructor that allocates a pyclass
        # instance. The first three lines all use pyo3 macro paths that
        # would surface limited-API breakage if the wheel were ABI-
        # incompatible with the running CPython.
        run: |
          python <<'EOF'
          import ferro_hgvs
          v = ferro_hgvs.parse("NM_000088.3:c.459A>G")
          assert str(v) == "NM_000088.3:c.459A>G", f"str round-trip: {str(v)!r}"
          assert v == ferro_hgvs.parse("NM_000088.3:c.459A>G"), "__eq__"
          assert hash(v) == hash(ferro_hgvs.parse("NM_000088.3:c.459A>G")), "__hash__"
          # eq_int pyclass enum (Consequence). int() cast and equality
          # use the pyo3 limited-API codegen path that abi3 must support.
          cons = ferro_hgvs.Consequence.CodingSequenceVariant
          assert int(cons) == 18, f"eq_int: {int(cons)}"
          print(f"smoke ok: {v!r} cons={cons}")
          EOF

  smoke-test-musllinux:
    # musllinux wheels (built by the `linux` job for both x86_64 and
    # aarch64) ship to Alpine / musl-libc distros. The standard
    # `smoke-test` matrix runs on glibc runners, so it cannot validate
    # the musllinux wheel's pip-install + import flow. This job runs
    # the same import + abi3 surface checks against a
    # `python:<v>-alpine` image on each supported Python version.
    #
    # The runner stays on glibc Ubuntu (no `container:` key on the
    # job) and the Alpine execution happens via `docker run` from a
    # later step. This avoids the well-known footgun where
    # GitHub-injected Node-based actions (`actions/download-artifact`
    # etc.) cannot exec their glibc-linked Node binary inside an
    # Alpine container. #397 item 4.
    name: Smoke musllinux ${{ matrix.runner }} py${{ matrix.python-version }}
    needs: [linux]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Smoke test (import + parse + eq_int pyclass) inside Alpine
        # Same surface as the glibc smoke-test (parse + __eq__ +
        # __hash__ + eq_int pyclass) so a musllinux ABI regression
        # surfaces under the same checks. Runs under `docker run`
        # from the glibc host so Node-based actions don't have to
        # execute inside Alpine.
        shell: bash
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" \
            python:${{ matrix.python-version }}-alpine \
            sh -c '
              set -eu
              python -m pip install --upgrade pip
              python -m pip install --no-index --only-binary :all: --find-links /dist ferro-hgvs
              python <<EOF
          import ferro_hgvs
          v = ferro_hgvs.parse("NM_000088.3:c.459A>G")
          assert str(v) == "NM_000088.3:c.459A>G", f"str round-trip: {str(v)!r}"
          assert v == ferro_hgvs.parse("NM_000088.3:c.459A>G"), "__eq__"
          assert hash(v) == hash(ferro_hgvs.parse("NM_000088.3:c.459A>G")), "__hash__"
          cons = ferro_hgvs.Consequence.CodingSequenceVariant
          assert int(cons) == 18, f"eq_int: {int(cons)}"
          print(f"musllinux smoke ok: {v!r} cons={cons}")
          EOF
            '

  upload:
    name: Upload to GitHub Release
    needs: [check-metadata, smoke-test, smoke-test-musllinux, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG_NAME" dist/* --repo "$REPO" --clobber

  publish-pypi:
    name: Publish to PyPI
    # Publish straight to PyPI on release. The per-platform smoke tests (real
    # import + parse on every OS/Python) and `twine check` are the validation
    # gate; the former TestPyPI dry-run only added a second trusted-publisher
    # config to maintain and a hard `needs` failure that blocked real releases
    # on every tag (v0.4.0 through v0.7.0 all failed here).
    needs: [check-metadata, smoke-test, smoke-test-musllinux, sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/ferro-hgvs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
          print-hash: true
          verbose: true

  verify-pypi:
    # Positively confirm the just-published release is actually
    # installable from PyPI. Every release through v0.7.0 went "green"
    # while the wheels never reached PyPI (the real publish job sat
    # behind an always-failing TestPyPI gate, removed in #1008 / fixed
    # in 0.7.1). Nothing asserted the package landed, so the regression
    # passed silently. This job polls the public index for the exact
    # released version, then installs it from PyPI (never the local
    # checkout) into a clean venv and runs a smoke import + parse,
    # failing if the version never becomes installable or the smoke
    # test breaks. #1012 item 4.
    name: Verify PyPI install
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Wait for the released version to appear on PyPI
        shell: bash
        env:
          # Strip a leading `v` from the tag, matching the other jobs.
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          echo "Waiting for ferro-hgvs==${version} on PyPI"
          # Poll the public index in a scratch venv so the check uses the
          # real PyPI resolver, not the workflow's Python environment.
          python -m venv /tmp/pypi-poll
          /tmp/pypi-poll/bin/python -m pip install --upgrade pip >/dev/null
          # PyPI's index can lag a bit after upload; retry for up to ~10
          # minutes (30 attempts x 20s) before giving up.
          attempts=30
          sleep_seconds=20
          for i in $(seq 1 "$attempts"); do
            if /tmp/pypi-poll/bin/pip download \
              --no-deps --no-cache-dir --dest /tmp/pypi-poll-dl \
              "ferro-hgvs==${version}" >/dev/null 2>&1; then
              echo "ferro-hgvs==${version} is installable from PyPI (attempt ${i})"
              exit 0
            fi
            echo "Attempt ${i}/${attempts}: ferro-hgvs==${version} not yet on PyPI; sleeping ${sleep_seconds}s"
            sleep "$sleep_seconds"
          done
          echo "::error::ferro-hgvs==${version} never became installable from PyPI within the timeout"
          exit 1
      - name: Install from PyPI and smoke test
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          # Fresh venv; force the install to come from PyPI (never the
          # local checkout) so we exercise the published artifact.
          python -m venv /tmp/pypi-verify
          /tmp/pypi-verify/bin/python -m pip install --upgrade pip >/dev/null
          # Retry the install too: a version can pass the download poll and
          # still briefly 404 on install while PyPI's index propagates across
          # CDN edges. Retry a few times so propagation lag doesn't red an
          # otherwise-successful release. Keeps the force-from-PyPI semantics.
          install_attempts=5
          install_sleep=15
          for i in $(seq 1 "$install_attempts"); do
            if /tmp/pypi-verify/bin/python -m pip install --no-cache-dir "ferro-hgvs==${version}"; then
              break
            fi
            if [ "$i" -eq "$install_attempts" ]; then
              echo "::error::failed to install ferro-hgvs==${version} from PyPI after ${install_attempts} attempts"
              exit 1
            fi
            echo "Install attempt ${i}/${install_attempts} failed; sleeping ${install_sleep}s"
            sleep "$install_sleep"
          done
          /tmp/pypi-verify/bin/python - "$version" <<'EOF'
          import sys
          import ferro_hgvs

          expected = sys.argv[1]
          ferro_hgvs.parse("NM_000088.3:c.459A>G")
          actual = ferro_hgvs.__version__
          print(f"installed ferro_hgvs.__version__={actual!r} (expected {expected!r})")
          assert actual == expected, f"version mismatch: {actual!r} != {expected!r}"
          print("PyPI verify ok")
          EOF
