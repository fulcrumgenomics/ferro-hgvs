name: Lint Workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  # No `branches:` filter — see the note in `ci.yml`. It matches the pull
  # request's base, so a stacked PR editing a workflow skipped actionlint
  # entirely.
  #
  # And no `paths:` filter, deliberately, even though this job only ever has
  # something to say about `.github/`. A `paths:` filter that does not match
  # means the workflow never runs, and a workflow that never runs reports no
  # check at all — which is indistinguishable, to a required-status-check rule,
  # from a check that simply has not finished. So while the filter was here,
  # making `zizmor + actionlint` a required context on `main` left every PR that
  # touched no workflow stuck on "Expected — waiting for status to be reported"
  # and permanently unmergeable. Linting the workflows on a PR that changed none
  # of them costs well under a minute and buys a context that always reports,
  # which is the price of being able to require it.
  pull_request:
  # `zizmor + actionlint` is the tenth required context on `main`, and the only one
  # this file produces. A merge queue gates each entry on the required contexts being
  # reported against the merge group, so without this trigger every queued pull request
  # would hang on "Expected — waiting for status to be reported".
  #
  # That is the same defect the `paths:` filter caused above, arriving through a
  # different door — and the note above already states the rule this line follows from:
  # a check that never reports is indistinguishable, to a required-status-check rule,
  # from a check that has not finished. A `paths:` filter made this workflow not run for
  # PRs touching no workflow; no `merge_group:` makes it not run for any queue entry at
  # all. The fix is the same in both cases, and so is the price: linting the workflows
  # on a merge group costs about eight seconds.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # See `ci.yml` — a cancelled required check reads to the queue as a failure and evicts
  # the pull request, so merge-group runs are never cancelled.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  lint:
    name: zizmor + actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: .github/workflows/lint-workflows.yml
      - name: Install zizmor
        run: pip install 'zizmor==1.24.1'
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /usr/local/bin actionlint
      - name: Run zizmor
        run: zizmor .github/workflows/
      - name: Run actionlint
        run: actionlint
