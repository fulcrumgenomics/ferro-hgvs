name: Manage Release PRs and Publish Crates

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # `timeout-minutes` so this cannot inherit GitHub's 360-minute default. This is
  # the half #1994 scoped out (see #2004). 60 = far more than 5x the slowest
  # SUCCESSFUL run observed (208s, measured 2026-08-16 over the last 15 runs).
  # release-plz walks the release cycle's history running `cargo package` at each
  # commit, so it compiles Rust and a large cycle can run well past the typical
  # ~3.5m — hence the generous bound rather than a tight one.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # No submodules: release-plz only reads Cargo.toml/changelog/git
          # history. `/assets/` is excluded from the package (Cargo.toml
          # `exclude`), and checking it out couples this job to upstream
          # submodule cleanliness — cargo's vcs check rejected the working
          # tree after the hgvs-nomenclature bump shipped tracked files
          # matching its own `docs/versions/.gitignore` (`*.md`).
          # release-plz pushes tags/commits via the persisted token; do not disable.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }} # zizmor: ignore[artipacked]
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9  # v0.5.131
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # release-plz determines the next version by walking history one
          # commit at a time with `git checkout <sha>`, running `cargo package`
          # at each. Every commit before #1750 still tracks the four bulk
          # fixtures through Git LFS, and the account's LFS budget is
          # exhausted, so stepping across that boundary makes git run the
          # smudge filter, fail the download, and ABORT THE CHECKOUT PART-WAY
          # — leaving 34 files from the older commit in the tree. release-plz
          # reads that error as "there are no other commits", stops walking,
          # and its final `git checkout main` then dies on the dirty tree.
          #
          # The failure surfaces as a git error naming an unrelated file
          # (`.github/workflows/ci.yml`, the only one of the 34 that has since
          # changed on main), which is why it looks nothing like an LFS
          # problem. It was silent before that: the truncated walk analysed 4-8
          # commits instead of ~90, so the version bump was computed from a
          # fraction of the cycle while the job still reported success.
          #
          # Skipping the smudge leaves those paths as pointer files, which is
          # harmless here: they are `exclude`d from the package in Cargo.toml,
          # so they never enter the comparison release-plz is making.
          GIT_LFS_SKIP_SMUDGE: "1"
