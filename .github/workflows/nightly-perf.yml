name: Nightly perf budget

# Real-data startup-regression gate for `ferro normalize`.
#
# Why this exists: PR #585 fixed a silent perf regression where the cdot cache
# fell back to re-parsing a 512 MB JSON on every run, inflating startup ~1s ->
# ~4.8s for months with nothing failing. No CI job exercised real-data startup.
# This workflow does, nightly, so that class of regression fails loudly.
#
# Two gates, both hard-failing (unlike nightly-mutalyzer.yml, which is
# continue-on-error and only reports drift):
#   1. Cache-path co-gate: `ferro check --build-cache` must report
#      `cdot cache: archive`. A `json-fallback` after building the cache means
#      the fast archive is genuinely unusable (the #585 class) — independent of
#      runner speed.
#   2. Startup budget: min-of-7 `ferro normalize` startup must stay under a
#      fixed ceiling. Catches a gross real-data regression the structural unit
#      tests can't see.
#
# Reference data: reuses the prepared-manifest cache populated by
# nightly-mutalyzer.yml. The `Cache prepared reference manifest` step below
# shares its cache key BYTE-FOR-BYTE (GitHub Actions cache is repo-scoped), so
# no second multi-GB `ferro prepare` is needed on a warm cache.

on:
  schedule:
    # 05:00 UTC — one hour after nightly-mutalyzer (04:00) so the shared
    # manifest cache is warm. Clear of the Sunday 00:00 external-validation run.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-perf-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # NOTE: `MANIFEST_CACHE_VERSION` is gone along with the RefSeq-only manifest
  # cache it keyed — see the block above this workflow's `ferro prepare` step
  # (#1218). The reason the two nightlies kept SEPARATE caches still stands and
  # must be honoured if either comes back: this workflow's startup-budget gate
  # measures the RefSeq `ferro normalize` startup it was tuned for (#585), and
  # provisioning Ensembl would make a RefSeq startup eagerly merge ~198k Ensembl
  # transcripts into the primary build and inflate the baseline (#933).
  # Budget knobs (seconds). Today's startup floor is ~1.0s; the #585 bug was
  # ~4.8s. 2.5s sits ~2.5x above healthy and ~2x below the bug — outside runner
  # noise in both directions.
  STARTUP_BUDGET_MAX: '2.5'   # hard-fail if min-of-N exceeds this
  STARTUP_WARN_MEDIAN: '1.5'  # warn-only (summary) if median exceeds this
  STARTUP_RUNS: '7'

jobs:
  startup-budget:
    name: ferro normalize startup budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No `lfs: true`: nothing in this repository is LFS-tracked any more,
          # and this job reads none of the bulk corpora — it builds `ferro`,
          # runs `ferro prepare` and times startup.
          submodules: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable

      # Cargo caching via `rust-cache`; rationale recorded above the equivalent
      # step in `ci.yml` (#1218).
      #
      # This job gates on a startup-time budget, so what it restores matters more
      # here than elsewhere. That argues *for* the change rather than against it:
      # the hand-rolled key it replaces ended in a bare
      # `${{ runner.os }}-cargo-` restore-key, which is a prefix of every cargo
      # cache in the repository and could hand this job a `target/` built under a
      # different profile — exactly the kind of variance a timing gate must not
      # inherit. `rust-cache` keys per job and stores dependency artifacts only.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          # Save a new cache generation ONLY from `main` (#1218 redux). `rust-cache`
          # keys per job and appends a lockfile/env hash, so every PR run that
          # differed in either minted a fresh ~0.2-0.7 GiB entry. Measured on
          # 2026-08-08: 42 entries totalling 13.79 GiB against a 10 GiB cap — 3 to 5
          # generations of every logical key, `coverage` alone holding 4 x ~0.69 GiB.
          # Over cap means GitHub evicts by LRU continuously, which is the #1218
          # failure (two generations reached 13.61 GiB and took the nightly's 3.25 GiB
          # `ferro-manifest-v3` with them). Restoring on every run and saving only on
          # `main` collapses it to one generation per key, ~4.2 GiB.
          #
          # The trade is nil for this workflow: it triggers on `schedule` and
          # `workflow_dispatch` only, so every run that could ever have saved an
          # entry is a scheduled one, which GitHub fires against the default
          # branch and which therefore satisfies the condition. The one run that
          # now declines to save is a `workflow_dispatch` from a non-`main`
          # branch, which restores
          # `main`'s generation through the `restore-keys` prefix instead. `ci.yml`
          # and `coverage.yml` are where the PR-side trade actually lands; it is
          # stated on their first `rust-cache` block.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: nightly-perf

      # The prepared reference is NOT cached, for the reason recorded in
      # nightly-mutalyzer.yml and measured in #1218: a 3+ GiB entry cannot
      # survive LRU eviction inside a 10 GiB repository budget that PR CI already
      # fills, so it was re-saved nightly and never once restored. Run
      # 30686892059 logged `Cache not found for input keys:
      # Linux-ferro-manifest-refseq-…` like every other. Removing it does not
      # slow this workflow — the `ferro prepare` below was already running every
      # time — it stops the workflow taking budget from workflows that can use it.
      #
      # If it is ever restored, it must stay a SEPARATE RefSeq-only entry: the
      # startup-budget gate below measures RefSeq startup (#585), and an
      # Ensembl-inclusive reference inflates that baseline (#933).
      - name: Build ferro (release)
        run: cargo build --release --bin ferro

      - name: Run `ferro prepare`
        run: |
          ./target/release/ferro prepare \
            --output-dir benchmark-output \
            --genome grch38 \
            --derive-ng-placements tests/fixtures/mutalyzer-normalize/ng_accessions.txt

      - name: Confirm manifest present
        run: |
          test -f benchmark-output/manifest.json || \
            (echo "::error::manifest.json missing after prepare step"; exit 1)

      - name: Warm cache + cache-path co-gate
        shell: bash
        run: |
          set -euo pipefail
          # `--build-cache` builds/refreshes the on-disk rkyv cache, then prints
          # the load source. After a successful build the source MUST be the
          # archive; a `json-fallback` here means the freshly built archive is
          # unusable (layout drift / unwritable) — the #585 failure mode.
          # Tolerate a non-zero exit so we can emit a clear diagnostic below; an
          # absent/`json-fallback` cache line then fails the gate explicitly.
          out="$(./target/release/ferro check --reference benchmark-output --build-cache 2>&1 || true)"
          echo "$out"
          line="$(printf '%s\n' "$out" | grep 'cdot cache:' || true)"
          if [[ "$line" != *"archive"* ]]; then
            echo "::error::cdot cache did not load from archive after --build-cache (silent fallback / #585 class). Got: ${line:-<none>}"
            exit 1
          fi
          echo "cache-path co-gate OK: ${line}"

      - name: Startup wall-time budget
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'NM_000088.3:c.589G>T' \
            'NM_000088.3:c.10A>G' \
            'NC_000001.11:g.12345A>G' > /tmp/perf_in.txt

          bin=./target/release/ferro
          ref=benchmark-output
          run() { "$bin" normalize --reference "$ref" --error-mode lenient -i /tmp/perf_in.txt >/dev/null 2>&1 || true; }

          # Warmup (untimed) — prime OS page cache so we measure code, not disk.
          run

          : > /tmp/perf_times.txt
          for _ in $(seq 1 "${STARTUP_RUNS}"); do
            start=$(date +%s.%N)
            run
            end=$(date +%s.%N)
            awk -v s="$start" -v e="$end" 'BEGIN { printf "%.3f\n", e - s }' >> /tmp/perf_times.txt
          done

          min=$(sort -n /tmp/perf_times.txt | head -1)
          median=$(sort -n /tmp/perf_times.txt | awk '{a[NR]=$1} END {print a[int((NR+1)/2)]}')

          {
            echo "### ferro normalize startup"
            echo ""
            echo "| metric | seconds |"
            echo "|--------|---------|"
            echo "| min (gate) | ${min} |"
            echo "| median | ${median} |"
            echo "| budget max | ${STARTUP_BUDGET_MAX} |"
            echo ""
            echo "runs: $(paste -sd' ' /tmp/perf_times.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

          if awk -v m="$min" -v b="${STARTUP_BUDGET_MAX}" 'BEGIN { exit !(m > b) }'; then
            echo "::error::startup min ${min}s exceeds budget ${STARTUP_BUDGET_MAX}s (#585-class regression)"
            exit 1
          fi
          if awk -v m="$median" -v w="${STARTUP_WARN_MEDIAN}" 'BEGIN { exit !(m > w) }'; then
            echo "::warning::startup median ${median}s exceeds warn threshold ${STARTUP_WARN_MEDIAN}s"
          fi
          echo "startup OK: min=${min}s median=${median}s"

  report-failure:
    needs: startup-budget
    if: failure()
    uses: ./.github/workflows/report-failure.yml
    permissions:
      contents: read
      issues: write
    with:
      title: "nightly perf: startup budget exceeded"
      summary: >-
        The nightly startup perf budget was exceeded.
      hint: |
          Perf regressions compound quietly, so bisect promptly. Reference loading dominates startup; see #1178 / #1186 for what that path costs.
