name: External API Validation

on:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      skip_api_fetch:
        description: 'Skip API fetching (use existing fixtures)'
        required: false
        default: 'false'
      limit_variants:
        description: 'Limit variants per API (for faster testing)'
        required: false
        default: '0'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fetch-api-data:
    name: Fetch External API Data
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_api_fetch != 'true' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install requests civicpy

      - name: Fetch Mutalyzer API data
        run: |
          python scripts/fetch_mutalyzer_normalized.py \
            --output tests/fixtures/normalization/mutalyzer_api.json \
            ${LIMIT:+--limit $LIMIT}
        env:
          LIMIT: ${{ github.event.inputs.limit_variants }}
        continue-on-error: true

      - name: Fetch VariantValidator API data
        run: |
          python scripts/fetch_variantvalidator.py \
            --output tests/fixtures/validation/variantvalidator_api.json \
            ${LIMIT:+--limit $LIMIT}
        env:
          LIMIT: ${{ github.event.inputs.limit_variants }}
        continue-on-error: true

      - name: Fetch NCBI Variation Services data
        run: |
          python scripts/fetch_ncbi_variation.py \
            --output tests/fixtures/validation/ncbi_variation.json \
            ${LIMIT:+--limit $LIMIT}
        env:
          LIMIT: ${{ github.event.inputs.limit_variants }}
        continue-on-error: true

      - name: Extract Mutalyzer GitHub patterns
        run: |
          if [ -d "external-repos/mutalyzer-hgvs-parser" ]; then
            python scripts/extract_mutalyzer_github.py \
              --output tests/fixtures/grammar/mutalyzer_github.json
          else
            echo "Mutalyzer repo not cloned, skipping"
          fi
        continue-on-error: true

      - name: Upload API fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: api-fixtures
          path: |
            tests/fixtures/normalization/mutalyzer_api.json
            tests/fixtures/validation/variantvalidator_api.json
            tests/fixtures/validation/ncbi_variation.json
            tests/fixtures/grammar/mutalyzer_github.json
          retention-days: 30

  run-comparison-tests:
    name: Run API Comparison Tests
    runs-on: ubuntu-latest
    needs: [fetch-api-data]
    if: always()

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download API fixtures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: api-fixtures
          path: tests/fixtures/
        continue-on-error: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable

      # Cargo caching via `rust-cache`; rationale recorded above the equivalent
      # step in `ci.yml` (#1218).
      #
      # Note what the key it replaces did NOT have: a job suffix. Both jobs in
      # this workflow used the identical `${{ runner.os }}-cargo-<lock-hash>`,
      # so they shared one entry despite installing different toolchain
      # components and building different targets — whichever ran first decided
      # what the other restored, and `actions/cache` then skipped the save on the
      # key hit so neither could correct it. `rust-cache` keys per job by
      # default; the `key` below only adds a legible name so
      # `gh api .../actions/caches` stays diagnosable.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: external-validation-api

      # These three steps are the point of the workflow, so they gate it.
      #
      # They previously could not fail it, in two independent ways (#1404):
      # `continue-on-error` kept the step's failure out of the job conclusion,
      # and `cargo test … | tee` reports *tee's* status without `pipefail`, so
      # the exit code was ~always 0 regardless. Both are gone; the report and
      # its upload carry `if: always()` instead, so a red run still publishes
      # what it found rather than being masked to keep the artifact.
      #
      # `run_validation` also fails when the filter selects **no** tests, which
      # neither of the above would catch. Two silent-zero cases had already
      # happened here: #725 collapsed the per-file test binaries into the single
      # `it` target, so `--test api_comparison_tests` became
      # `error: no test target named …` — masked, and seven consecutive weekly
      # runs reported success while running nothing — and `spdi_tests` kept a
      # `--ignored` flag after its last `#[ignore]` was removed, which selects
      # an empty set and exits 0.
      - name: Run API comparison tests
        shell: bash
        run: |
          source .github/scripts/run_validation.sh
          # All three api_comparison_tests are #[ignore]d: they are the
          # network-fixture suite, run here and not in the standard job.
          run_validation api_comparison_tests api_comparison_results.txt --ignored

      # `!cancelled()` on the second and third suites, because dropping
      # `continue-on-error` alone would trade one silent failure for another:
      # by default a failed step skips every later step, so a red API-comparison
      # run would leave SPDI and dbSNP unexecuted while the report said only
      # "No results" for them. That is the same shape this PR exists to fix — a
      # suite that validated nothing, reported as though it had. Each suite now
      # runs and fails independently, and the job is red if any of them is.
      #
      # `!cancelled()` rather than `always()`: a cancelled run should stop, not
      # push on through two more cargo builds.
      - name: Run SPDI tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          source .github/scripts/run_validation.sh
          # No `--ignored`: spdi_tests carries no #[ignore] any more.
          run_validation spdi_tests spdi_results.txt

      - name: Run dbSNP tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          source .github/scripts/run_validation.sh
          run_validation dbsnp_tests dbsnp_results.txt

      - name: Generate validation report
        if: always()
        run: |
          {
            echo "# External Validation Report"
            echo ""
            echo "Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo ""

            echo "## API Comparison Results"
            echo '```'
            tail -50 api_comparison_results.txt || echo "No results"
            echo '```'
            echo ""

            echo "## SPDI Test Results"
            echo '```'
            tail -50 spdi_results.txt || echo "No results"
            echo '```'
            echo ""

            echo "## dbSNP Test Results"
            echo '```'
            tail -50 dbsnp_results.txt || echo "No results"
            echo '```'
          } > validation_report.md

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: validation-report
          path: |
            validation_report.md
            api_comparison_results.txt
            spdi_results.txt
            dbsnp_results.txt
          retention-days: 90

  run-standard-tests:
    name: Run Standard Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The spec-normalization fixture is generated (not committed) from the
          # HGVS spec submodule, so the standard test suite needs it checked out.
          submodules: true
          lfs: true
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          components: clippy

      # The second half of the shared-key problem described in the job above:
      # this job installs `clippy` and builds the spec generators, and used the
      # same key. Distinct name, so the two no longer overwrite each other (#1218).
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: external-validation-spec

      # The spec-normalization fixture is a generated artifact (gitignored);
      # regenerate it before the suite so the reader tests find it.
      - name: Generate HGVS v21.0 spec fixture
        run: cargo run --features dev --bin generate_spec_fixture

      - name: Generate HGVS spec test enumeration
        run: cargo run --features dev --bin generate_spec_enumeration

      # `dev` bundles every testable feature; `slow-tests` is
      # intentionally opt-in because it requires a ~1 GB ClinVar
      # fixture that is not committed to the repo.
      - name: Run standard tests
        run: cargo test --features dev

      - name: Run clippy
        run: cargo clippy --features dev --all-targets -- -D warnings

  fetch-external-databases:
    name: Fetch External Database Data
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_api_fetch != 'true' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Fetch LOVD data
        run: |
          python scripts/fetch_lovd_hgvs.py \
            --format json \
            --output tests/fixtures/external/lovd_variants.json \
            --limit 100
        continue-on-error: true
        timeout-minutes: 30

      - name: Fetch MaveDB data
        run: |
          python scripts/fetch_mavedb_hgvs.py \
            --format json \
            --output tests/fixtures/external/mavedb_variants.json \
            --limit 20 \
            --variants-per-set 50
        continue-on-error: true
        timeout-minutes: 30

      # Note: CIViC requires civicpy which may need special setup
      - name: Fetch CIViC data (optional)
        run: |
          pip install civicpy || true
          python scripts/fetch_civic_hgvs.py \
            --format json \
            --output tests/fixtures/external/civic_variants.json || true
        continue-on-error: true
        timeout-minutes: 30

      - name: Upload external database fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: external-db-fixtures
          path: tests/fixtures/external/
          retention-days: 30

  summary:
    name: Generate Summary
    runs-on: ubuntu-latest
    needs: [run-comparison-tests, run-standard-tests]
    if: always()

    steps:
      - name: Download validation report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: validation-report
        continue-on-error: true

      - name: Post summary
        run: |
          echo "## External Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f validation_report.md ]; then
            cat validation_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Validation report not available" >> "$GITHUB_STEP_SUMMARY"
          fi

  report-failure:
    needs: [run-comparison-tests, run-standard-tests]
    if: failure()
    uses: ./.github/workflows/report-failure.yml
    permissions:
      contents: read
      issues: write
    with:
      title: "external API validation failed"
      summary: >-
        The scheduled external-API validation run failed.
      hint: |
          This talks to third-party services (mutalyzer, VariantValidator), so a failure may be an upstream outage rather than a ferro defect. Check the run log before assuming a regression.
