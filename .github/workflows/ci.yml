name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter here on purpose. That filter matches the pull
  # request's BASE, so `branches: [main]` silently skipped CI for every
  # stacked PR (one whose base is another feature branch). Because the
  # `pull_request` event never fired, such a PR had no CI runs at all, yet
  # GitHub still rendered "All checks have passed" — a green badge that
  # carried no information. Run on every pull request whatever it targets.
  pull_request:
    # `edited` is load-bearing for `representation-change` below: the declaration
    # lives in the PR description, and the default activity set
    # (opened/synchronize/reopened) does not fire when a description is edited. Without
    # it, adding the trailer a red check just asked for re-runs nothing and the check
    # stays red until an unrelated push.
    types: [opened, synchronize, reopened, edited]
  # Required for a merge queue, and it is a hard prerequisite rather than an
  # optimisation: a queue entry is gated on the branch's required status checks
  # being reported against the MERGE GROUP, and a workflow that does not trigger
  # on `merge_group` reports nothing there at all. Nine of `main`'s ten required
  # contexts come from this file (`zizmor + actionlint` is the tenth, in
  # `lint-workflows.yml`), so without this line every queued pull request would
  # sit on "Expected — waiting for status to be reported" forever. That is the
  # same failure mode the `paths:` filter caused in `lint-workflows.yml`, one
  # event further out: a check that never reports is indistinguishable from a
  # check that has not finished.
  #
  # This is inert until a merge queue is actually enabled on `main` — no
  # `merge_group` event can be delivered before then — so it is safe to land
  # ahead of the settings change, and it has to, or the first queued PR hangs.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a merge-group run. `github.ref` is unique per merge group
  # (`refs/heads/gh-readonly-queue/main/pr-<n>-<base-sha>`), so a collision needs
  # the same PR re-queued against an unmoved base — rare, and the cost of losing
  # that race is not a wasted run but a cancelled required check, which the queue
  # reads as a failure and which evicts the pull request from the queue. Cheap
  # insurance; `pull_request` and `push` are unaffected.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The three exhaustive-sweep modules, owned by the `sweeps` job and excluded
  # from the `test` / `test-oracle` partitions. Defined once here because the
  # filter has to appear identically in three places and GitHub Actions has no
  # YAML anchors — a copy that drifts would either double-run a sweep or, far
  # worse, drop one from CI entirely.
  #
  # The invariant to preserve is that the two selections PARTITION the suite —
  # the absolute counts drift as tests are added, the sum must not. Verified
  # against this base: `not test(proptest)` selects 8908, adding
  # `and not (SWEEP_FILTER)` selects 8878, and the filter itself selects the
  # remaining 30. 8878 + 30 == 8908, so nothing falls between the two jobs and
  # nothing is run twice.
  #
  # `sweeps`, the one job that selects ON this filter rather than against it,
  # passes `--no-tests=fail`. So a rename that made the filter match nothing
  # reddens CI there instead of quietly emptying that job — while `test` and
  # `test-oracle`, which negate it, would just widen by 30 tests.
  #
  # NOTE: that partition is over `test` + `sweeps`. `test-oracle` additionally
  # negates `ORACLE_EXCLUDE` below, so it runs a strict SUBSET of `test` rather
  # than the same selection. Every test still runs somewhere unarmed.
  #
  # NOTE also: `sweeps` selects on this filter PLUS one module it deliberately
  # re-runs — `issue_1615_denoted_sequence_oracle`, the only test that reads the
  # denoted-sequence oracle's counters, which are meaningless unless
  # `FERRO_ASSERT_SEQUENCE` is set and `sweeps` is the only job IN THIS FILE that
  # sets it (`nightly-mutalyzer.yml` sets it too, non-gating). So
  # "nothing is run twice" holds of this filter and is one module short of
  # holding of that job's `-E`; the reason it is appended there rather than added
  # here is on the job itself.
  SWEEP_FILTER: >-
    test(cis_junction_crossing_shift) + test(repeat_span_sibling_overlap)
    + test(issue_1254_sibling_crossing_shift)
  # The slow census modules, owned by the `censuses` job and excluded from the
  # `test` / `test-oracle` partitions. Same shape as `SWEEP_FILTER` above and
  # for the same reason; the difference is what the job does with them.
  #
  # WHY THEY MOVED. `--partition hash:K/N` assigns a test by a hash of its NAME,
  # so it balances shard *counts* and is blind to cost — the property already
  # recorded on `sweeps`, where all three exhaustive sweeps hashed into one
  # shard. The three below hashed into the two slowest jobs and made the
  # workflow's critical path a single test. Measured on run 31845625298
  # (`044f085a`):
  #
  #                                             Test (K/6)   Test oracle (K/4)
  #   issue_1542_direction_symmetry               155.7s (3)         240.3s (1)
  #   spec_conformance_axis (5 tests)             338.0s              excluded
  #   normalize_axis_preserving (4 tests)         119.3s (1,3,5)      313.0s (1,3)
  #
  # `Test oracle (1/4)` ran 328s against 132-160s for its siblings and finished
  # 83s after every other job in the workflow, so the run's wall clock was one
  # unlucky hash draw. A shard's wall can never fall below its slowest single
  # test, so re-sharding cannot fix it — which is why `test-oracle`'s own
  # comment below, having chosen N=4 to separate the two bulk corpora, names
  # exactly this carve-out as the robust alternative. This is that alternative.
  #
  # The fourth member joined later and its figures are from a DIFFERENT run,
  # 31909112992 — not comparable row-for-row with the three above, and subject
  # to the same cross-run spread recorded on `ORACLE_ONLY_FILTER` below:
  #
  #   clinvar_hgvs_tests (2 tests)                 37.2s (2,6)         62.3s (2,4)
  #
  # Its two tests hash into FOUR different shards between the two matrices, so
  # ~99s of work leaves them — but only the 54.9s copy in `Test oracle (2/4)`
  # was on the critical path, which is why the wall-clock saving is much smaller
  # than the work removed. It is also the only member that is a PARSER
  # benchmark rather than a normalization census: it never reaches
  # `canonicalize_from_sequence`, so the optimized archive's gains land on its
  # gzip decode, JSON deserialization and `parse_hgvs` instead.
  #
  # AND WHY THE JOB, NOT THE JOB BOUNDARY, IS THE WIN. `censuses` consumes the
  # OPTIMIZED archive `test-build-soak` produces, which is where `sweeps`
  # measured 7.6-8.7x on work of exactly this shape (compute-bound cross
  # products over `MockProvider`). A carve-out onto the standard debug archive
  # would move the same 240s to a different runner and buy ~50s.
  #
  # THE PARTITION INVARIANT is `SWEEP_FILTER`'s, verbatim: the counts drift as
  # tests are added, the sum must not. `censuses` selects ON this filter and
  # passes `--no-tests=fail`, so a rename that made it match nothing reddens
  # there rather than quietly emptying the job, while `test` and `test-oracle`
  # negate it and would just widen. `tests/it/census_filter_invariant.rs` closes
  # the half neither of those catches — a module named here that NEITHER of the
  # job's two steps selects would be negated everywhere and run nowhere.
  #
  # NOTE the overlap with `ORACLE_EXCLUDE` below: `spec_conformance_axis` is in
  # both, and deliberately. `ORACLE_EXCLUDE` is a statement about which
  # instrument may be armed, and `oracle_exclude_invariant.rs` demands that
  # every spec-corpus module appear there; this filter is a statement about
  # where a module runs. Removing it from either would be wrong for a reason the
  # other does not cover.
  CENSUS_FILTER: >-
    test(issue_1542_direction_symmetry) + test(normalize_axis_preserving)
    + test(spec_conformance_axis) + test(clinvar_hgvs_tests)

  # Negated from `test` ONLY. These run in `test-oracle` with the three seam
  # oracles armed, and an armed run strictly subsumes an un-armed one — the
  # oracles add assertions at `normalize_core_checked`'s exit and change no
  # behaviour. That is the same argument `censuses` makes for dropping the
  # plain-`test` copy of the modules it took, and `sweeps` before it; the only
  # difference here is that the destination is an existing job rather than a
  # new one.
  #
  # WHY NOT `CENSUS_FILTER`: that filter is negated from BOTH shards and the
  # `censuses` job selects it off the SOAK archive, which is built
  # `-p ferro-hgvs-soak-tests` and therefore contains no `src/` unit tests at
  # all. `merge::tests::direction_symmetry` is a `#[cfg(test)]` module inside
  # `src/normalize/merge.rs`, so naming it in `CENSUS_FILTER` would negate it
  # from both shards and then select nothing — deleting the census outright.
  # `--no-tests=fail` would not catch that, because the step's other terms
  # still match. This variable exists precisely because that trap is silent.
  #
  # It is the unit half of #1840's pair. #1955 moved the integration half
  # (`issue_1542_direction_symmetry`) to `censuses` and left this one running in
  # BOTH shards.
  #
  # NO PER-TEST COST IS PINNED HERE, deliberately. That test measured 93.8s
  # (`Test (3/6)`, un-armed) and 85.2s (`Test oracle (3/4)`, armed) on run
  # 31909112992, and 46.8s in the same armed shard on run 31911822856 an hour
  # later — a 2x spread on one test, so any single figure in a committed comment
  # is one the next reader cannot reproduce, and pinning one invites a carve-out
  # decision to be made from noise. What is stable is the SHAPE: `Test (3/6)`
  # was a shard wearing one test, its whole nextest summary within ~1s of that
  # single test's time. That, not a number, is why the carve-out exists.
  ORACLE_ONLY_FILTER: >-
    test(merge::tests::direction_symmetry)
  # The spec-corpus modules, excluded from `test-oracle` ONLY. They run in full
  # in the plain `test` job; this is not a coverage exemption, it is a statement
  # about which instrument may be armed while another is measuring.
  #
  # WHY, REASON 1: the corpus COUNTS non-idempotent outputs (4 at 3', 4 at 5' as
  # pinned in `spec_conformance_axis.rs`) as a burn-down figure.
  # `FERRO_ASSERT_IDEMPOTENT` PANICS
  # on exactly that condition. The two agree perfectly about ferro — the oracle
  # fires on precisely the rows the corpus classifies — but a panic returns no
  # value, so the harness's `catch_unwind` files the row under `declined` and its
  # output never reaches the family's output set.
  #
  # That does not merely re-bucket a counter, it DESTROYS EVIDENCE, and in the
  # flattering direction: the non-idempotent output is the one that disagreed
  # with its siblings, so removing it makes the family look unanimous.
  #
  # RE-MEASURED on `main` @ 1dd8148d, armed against the committed pins, both
  # directions. The previous figures here were taken at `main` @ 35de96c8 and
  # were stale in three places — #1599 re-blessed 3' `non_idempotent_outputs`
  # 7 -> 4 and #1536 re-blessed `converged`/`split_two`, both recorded in
  # `spec_conformance_axis.rs`'s own doc, so "still the pinned figures" had
  # stopped being true:
  #
  #   3': declined 0 -> 4, non_idempotent_outputs 4 -> 0,
  #       converged 9141 -> 9145, split_two 2440 -> 2436
  #   5': declined 0 -> 4, non_idempotent_outputs 4 -> 0,
  #       converged 8944 -> 8948, split_two 2706 -> 2702
  #
  # So CI would report FOUR more converged families than converge, in each
  # direction — not the seven this comment used to claim, which was the figure
  # before #1599 lowered the count it is derived from.
  #
  # WHY, REASON 2 — simpler, and not covered by the paragraphs above. Five tests
  # in these modules do not merely count the defect, they ASSERT it: the four in
  # `defect_non_idempotent_outputs` and
  # `spec_corpus_regressions::an_insertion_at_the_cds_end_is_not_a_fixed_point`
  # pin `c.*1delinsCTT` -> `c.72_*1insCT` -> `c.72delinsCCT` as a known
  # non-fixed point. A test that pins a defect and an oracle that aborts on it
  # cannot both run, whatever the census does. Together the two reasons account
  # for all 7 tests a bare armed run fails, and `FERRO_ASSERT_IDEMPOTENT` alone
  # accounts for all 7 — `FERRO_ASSERT_REPARSE` and `FERRO_ASSERT_IN_BOUNDS`
  # each contribute 0, and a prepared reference changes nothing (these modules
  # are `MockProvider`-backed).
  #
  # Locally, `scripts/run_oracle_suite.sh` applies this same exclusion, reading
  # it from here rather than copying it.
  #
  # The corpus loses nothing by running un-armed: it measures idempotency itself,
  # and more precisely than the oracle does (a count and a classification, versus
  # a panic). `tests/it/oracle_exclude_invariant.rs` keeps this list honest in
  # both directions.
  #
  # `corpus_prohibited_inputs` is here for a related but NOT identical reason,
  # and the difference is worth stating rather than letting the comment above be
  # read as covering it. That module measures REFUSAL over the corpus's
  # prohibited and conflicting strata, and it does not wrap normalization in
  # `catch_unwind` — so an armed oracle firing on one of its rows reddens the
  # module rather than flattering it. What it would redden is a claim about
  # whether ferro refuses a shape, decided by an assertion about idempotency at
  # a seam the module is not measuring. Excluded so the two instruments stay
  # separate, in the same spirit; it still runs in full in the plain `test` job.
  #
  # `issue_1715_rna_alignment_symbol_reach` is here for a THIRD reason, weaker
  # than either of the two above, and it is listed rather than argued away
  # because `oracle_exclude_invariant` scans imports and cannot tell the
  # difference. That module touches the corpus exactly once — to assert that the
  # generator builds no `r.` row at all, so its zero for this axis is STRUCTURAL
  # — and it never normalizes a corpus row, so it cannot flatter or redden a
  # confluence figure. It is excluded to keep the invariant's rule simple ("a
  # module that reads the corpus is not run with the oracles armed") rather than
  # to protect a measurement; it runs in full in the plain `test` job, where its
  # own refusal assertions are the coverage that matters.
  ORACLE_EXCLUDE: >-
    test(spec_conformance_axis) + test(spec_corpus_regressions)
    + test(corpus_alphabet_and_intronic_validity) + test(corpus_prohibited_inputs)
    + test(lenient_overlap_and_projection_split)
    + test(defect_non_idempotent_outputs)
    + test(issue_1715_rna_alignment_symbol_reach)

jobs:
  abi3-floor-consistency:
    name: abi3 floor ↔ requires-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install packaging
        # `packaging.specifiers.SpecifierSet` parses compound specs
        # (`">=3.10,<4"`, `">=3.10rc1"`, etc.) per PEP 440/621 — more
        # robust than regex matching the literal string form.
        run: python -m pip install --no-cache-dir 'packaging>=24'
      - name: Assert Cargo.toml abi3-pyXY matches pyproject.toml requires-python
        # Cargo.toml's `abi3-pyXY` pyo3 feature sets the minimum Python
        # version the abi3 wheel can run on; pyproject.toml's
        # `requires-python` declares the minimum Python pip will accept
        # at install time. If they drift (e.g. a future bump on one
        # side only), users hit either a runtime ABI mismatch
        # (`abi3-py311` wheel on `requires-python = ">=3.10"` installs
        # but fails to load on 3.10) or a silently-stale floor
        # (`abi3-py310` wheel still permitted on a project that meant
        # to drop 3.10 support). #397 item 5.
        run: |
          python <<'PY'
          import re
          import sys
          from pathlib import Path
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version

          cargo = Path("Cargo.toml").read_text()
          m = re.search(r'"abi3-py(\d+)"', cargo)
          if not m:
              sys.exit("Could not find abi3-pyXY feature in Cargo.toml")
          abi3_digits = m.group(1)
          if not abi3_digits.startswith("3"):
              sys.exit(f"Unexpected abi3 minor in 'abi3-py{abi3_digits}'")
          # abi3-py310 → minor='10', abi3-py37 → minor='7'.
          abi3_floor = Version(f"3.{abi3_digits[1:]}")

          pyproject = Path("pyproject.toml").read_text()
          m = re.search(r'requires-python\s*=\s*"([^"]+)"', pyproject)
          if not m:
              sys.exit("Could not find requires-python in pyproject.toml")
          spec_str = m.group(1)
          spec = SpecifierSet(spec_str)

          # The abi3 floor is correct iff the wheel's minimum CPython
          # version is the lowest version the spec accepts. We test
          # this by asserting (a) abi3_floor itself satisfies the spec
          # and (b) the immediately-lower minor (3.{N-1}) does not.
          minor = abi3_floor.minor
          if not spec.contains(abi3_floor, prereleases=True):
              sys.exit(
                  f"abi3 floor / requires-python drift: Cargo.toml "
                  f"`abi3-py{abi3_digits}` ({abi3_floor}) does not satisfy "
                  f"pyproject.toml `requires-python = {spec_str!r}`."
              )
          one_below = Version(f"3.{minor - 1}") if minor > 0 else None
          if one_below is not None and spec.contains(one_below, prereleases=True):
              sys.exit(
                  f"abi3 floor / requires-python drift: pyproject.toml "
                  f"`requires-python = {spec_str!r}` would accept Python "
                  f"{one_below}, but the abi3 wheel from "
                  f"`abi3-py{abi3_digits}` requires Python >= {abi3_floor}."
              )
          print(f"OK: abi3-py{abi3_digits} ({abi3_floor}) ↔ requires-python = {spec_str!r}")
          PY

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    env:
      # `uv sync --no-install-project` below deliberately skips building the
      # project, but a bare `uv run` re-installs it — and for this maturin
      # package that means a full Rust extension build. Measured: 158s of this
      # job's 169s was `Building ferro-hgvs`, to run ~9s of ruff and mypy over
      # pure Python; with this set the job takes 10s. Nothing here needs the
      # compiled module: ruff is a static linter and mypy reads the checked-in
      # `python/ferro_hgvs/__init__.pyi` stubs. The wheel is built and
      # exercised for real in `python-wheel-test`.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --group dev --locked --no-install-project
      - name: Run ruff check
        run: uv run poe check-lint
      - name: Run ruff format
        run: uv run poe check-format
      - name: Run mypy
        run: uv run poe check-typing

  # A change under `src/normalize/`, `src/hgvs/`, `src/spdi/`, `src/project/`,
  # `src/reference/` or `src/error_handling/` can move the normalized string a downstream
  # consumer stores read counts against, so it must say whether it does.
  # `release-plz.toml` renders the changelog's **Representation changes** section from a
  # `Representation-Change:` trailer on the squash commit (#1433) — the machinery works,
  # but across the v0.13.0 cycle 87 commits landed carrying zero trailers while 46 touched
  # the four directories watched at the time, and the section rendered empty. An empty
  # section looks identical whether nothing moved or nobody declared, so it went unnoticed
  # for ~90 commits and the disclosure had to be reconstructed by hand before release
  # (#1522). The last two directories were added by #1853, on the finding that every
  # newly-normalizing row in that reconstruction attributes to one PR touching only
  # `src/reference/` and one touching only `src/error_handling/`. The authoritative list
  # is `WATCHED_PREFIXES` in the script this job runs; this comment restates it for the
  # reader, and `test_the_prose_restatements_name_every_watched_directory` fails when a
  # watched directory is missing from it — the obligation is enforced, not promised.
  #
  # `Representation-Change: none` passes. The point is to force the judgement, not to force
  # a disclosure; what this rejects is silence.
  representation-change:
    name: Representation change declared
    runs-on: ubuntu-latest
    # `pull_request` only. The check reads the PR description, which is what becomes the
    # squash commit body and therefore what git-cliff's footer rule matches. A push to
    # `main` has no equivalent to read, and by then the declaration is already merged.
    #
    # UNDER `merge_group` THIS JOB IS SKIPPED, AND THAT IS DELIBERATE — but the reason is
    # not "it would be awkward to run", it is that there is nothing there to read.
    # `github.event.pull_request` does not exist on a `merge_group` event (nor do
    # `github.head_ref`/`github.base_ref`), so every one of the steps below would resolve
    # its inputs to the empty string and the checker would fail on a change that had
    # already declared correctly.
    #
    # A skipped job reports a conclusion of SUCCESS, which satisfies a required status
    # check — that is GitHub's documented behaviour for a job skipped by a job-level
    # conditional, and it is what keeps `Representation change declared` from stalling
    # every queue entry. (The failure mode it must not be confused with is a *workflow*
    # that never triggers: that reports nothing, stays "Expected — waiting for status to
    # be reported", and blocks forever. Which is why `merge_group` is in this file's `on:`
    # block.)
    #
    # So in the queue this context is reported and vacuous. Nothing is lost by that,
    # because the declaration is a property of the PR description and the queue cannot
    # invalidate it: a merge group changes the BASE, and no base change can turn a present
    # trailer into an absent one. That is exactly unlike the value-pinned tests the queue
    # does exist to protect — those are properties of the merged tree. The real
    # enforcement point is the pull request, where required checks gate entry to the queue.
    #
    # Do NOT "fix" this by widening the condition to run here. Reading the declaration
    # under `merge_group` would mean parsing it back out of the merge commit message,
    # which is a different and much weaker source than the description GitHub actually
    # squashes.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Collect the changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # `--no-renames` so a rename reports BOTH paths. With git's rename detection
          # on (the default), moving `src/normalize/foo.rs` out of a watched directory
          # reports only the destination, so the change that removed it from
          # `src/normalize/` would need no declaration -- exactly backwards.
          git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > changed-files.txt
          echo "changed files:"
          cat changed-files.txt
      - name: Capture the PR description
        # Through `env`, never interpolated into the script body: a PR description is
        # attacker-controlled text and `${{ }}` inside `run` would splice it into the shell.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > pr-body.txt
      - name: Require a Representation-Change declaration
        run: |
          python scripts/check_representation_change.py \
            --changed-files changed-files.txt \
            --declaration-file pr-body.txt

  # The queue's own commit has to be a commit `main` will accept, and `main`'s ruleset
  # carries `required_signatures`. Nothing in CI looks at that, and when it is violated the
  # queue reports it NOWHERE: every required context goes green, the merge-group run
  # concludes `success`, and ~25 seconds later the entry is removed without merging. The
  # pull request stays open, still reads fully green, and can be re-queued forever. That is
  # #1978 — one PR ejected three times before the cause could be named, because the
  # ejection leaves no failure anywhere to read.
  #
  # This is the same family as the `paths:`/`merge_group:` notes in `lint-workflows.yml`
  # and above, one step further along: those are about a check that never REPORTS, this is
  # about a merge that never HAPPENS. In all three the symptom is silence, and silence is
  # what a required-status-check rule cannot distinguish from anything else.
  #
  # What produced it, measured rather than reasoned: GitHub composes the squash body from
  # the pull request description, hard-wraps it, and writes its own `gpgsig` header into
  # the commit object after the LAST line matching `^committer `. #1965's description
  # contained "...only the committer differs.", and the wrap put `committer` at the start
  # of a line — so the signature header landed inside the message instead of in the header
  # block and the commit came back `verified: false`, `reason: "invalid"`. Over the 40
  # merge-group commits built in the surrounding fourteen hours: 3 invalid, all three that
  # one pull request's, 37 valid.
  #
  # DELIBERATELY NOT A REQUIRED CONTEXT, and not because that would be tidier to add.
  # Requiring it would buy nothing: in every case this fires the entry is already
  # unmergeable, so the queue drops it either way. The whole value here is putting a named
  # red row where there was silence. (Making it required is also a ruleset change, which is
  # a separate decision from a workflow edit.)
  #
  # There is deliberately no pull-request-side twin, and the reason is NOT that the wrap
  # cannot be predicted. It largely can: a 72-column wrap that does not split long tokens
  # reproduces #1965's affected paragraph line-for-line, and the 84/100/96-column maxima
  # measured on three other merged squashes are that same wrap meeting an unbreakable URL
  # or code span. What stops it being a guard is the false-positive side. The hazard is a
  # header keyword landing at the START of a wrapped line, and `tree`, `author` and
  # `parent` are ordinary words in this repository's PR prose ("working tree", "the author
  # of"), so any line break that happens to fall before one produces a red on a
  # description that is in fact fine — on undocumented wrap behaviour that GitHub can
  # change under us. A check that is wrong sometimes becomes a check nobody reads, which
  # this file argues against by name a few jobs down. So the question is asked in the one
  # place it can be answered exactly rather than predicted: against the commit the queue
  # actually built.
  merge-commit-signature:
    name: Merge commit signature
    runs-on: ubuntu-latest
    # `merge_group` only. This is a question about the commit the QUEUE built: a pull
    # request head is a different object that never reaches `main`, and by `push: main` the
    # commit has already been accepted, so the answer there is always yes.
    if: github.event_name == 'merge_group'
    steps:
      - name: The merge group's commit must satisfy required_signatures
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Retried, because a transient API failure would otherwise post a red row that
          # says nothing about signatures at all. A genuinely invalid signature is stored
          # on the object when it is created and does not become valid on a second read,
          # so the retry cannot mask the condition this job exists to catch.
          verification=""
          for _ in 1 2 3; do
            if verification=$(gh api "repos/${REPO}/commits/${MERGE_SHA}" \
                 --jq '.commit.verification | "\(.verified)|\(.reason)"'); then
              break
            fi
            verification=""
            sleep 10
          done
          if [ -z "$verification" ]; then
            echo "::error::could not read signature verification for ${MERGE_SHA}"
            exit 1
          fi
          verified=${verification%%|*}
          reason=${verification#*|}
          echo "merge group commit ${MERGE_SHA}: verified=${verified} reason=${reason}"
          if [ "$verified" = "true" ]; then
            exit 0
          fi
          # Name the known cause, not only the symptom. A line of the MESSAGE beginning
          # with a git header keyword is what misplaces the signature header, and the
          # message is the wrapped pull request description.
          # The diagnostic is best-effort and MUST NOT be able to suppress the
          # explanation below it.  Under `set -e` an unguarded `gh api` aborts
          # the step on any transient failure, printing the bare HTTP error and
          # none of the `::error::` text — i.e. exactly the job's whole purpose
          # is lost to a 404.  `|| true` on the fetch, and `|| :` on the grep so
          # a real grep error (exit 2) is not laundered into the same "(none)"
          # as a legitimate no-match (exit 1).
          if gh api "repos/${REPO}/git/commits/${MERGE_SHA}" --jq '.message' \
               > merge-message.txt 2> merge-message.err; then
            echo "message lines that read as git commit headers:"
            status=0
            grep -nE '^(tree|parent|author|committer|gpgsig|encoding|mergetag) ' \
              merge-message.txt || status=$?
            if [ "$status" = 1 ]; then
              echo "  (none)"
            elif [ "$status" != 0 ]; then
              echo "  (could not scan the message: grep exited ${status})"
            fi
          else
            echo "  (could not read the commit message: $(head -1 merge-message.err))"
          fi
          echo "::error::merge group commit ${MERGE_SHA} is not verified (${reason}). The"
          echo "::error::ruleset on main requires signatures, so this entry will be dropped"
          echo "::error::from the queue once every check passes, reporting no other failure."
          echo "::error::If a line is listed above, reword the pull request description so"
          echo "::error::that no line of the wrapped squash body starts with that word."
          exit 1

  # Audit what the changelog's **Representation changes** section actually contains, by
  # rendering it with the real `release-plz.toml` and checking the result against the
  # trailers on the commits.
  #
  # The job above asks each PR to declare; this one asks whether the declarations end up
  # where they claim. Both halves of that have shipped broken -- #1526 listed one decline
  # as a change, #1555 listed eight -- and neither was caught, because the test written to
  # catch exactly this compares the two halves against *each other* and they were wrong
  # together. So this audit derives its own answer and shares no code with the checker.
  #
  # Runs on every PR rather than only at release time: the section is rebuilt from the
  # whole range since the last tag, so a mis-filed trailer is visible the day it lands
  # rather than in the release PR, when the fix is a rebase of somebody else's merged work.
  changelog-grouping:
    name: Changelog grouping audit
    runs-on: ubuntu-latest
    # Not on `merge_group`. This job judges what a SQUASH will render, and it gets there
    # by synthesizing that squash commit from the PR title and description (the step
    # below). A merge group carries the branch's intermediate commits, un-squashed, and
    # no PR description to synthesize from — so here it would audit commits that will
    # never exist after the merge and report on a changelog nobody will ship. This
    # context is not required, so a spurious red would not block the queue; it would do
    # something slightly worse, which is make a permanently-red check normal to look past.
    #
    # The question it asks is answered on the pull request and again on `push: main`
    # after the squash lands, which are the two places the commit it audits is real.
    if: github.event_name != 'merge_group'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history and tags: the audited range is `<latest tag>..HEAD`.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@a8fb21b85430c7a58551cf7ea87b03f355b826d9  # git-cliff
      - name: Require each Representation changes entry to carry its disclosure
        # The audit below asks whether the right commits are in the section. This asks
        # whether each entry in the *committed* changelog says what it moved (#1556): the
        # bullet is the commit subject and nothing else, so the rejected-vs-accepted fact
        # the release checklist asks for had to be read out of every linked PR.
        #
        # A no-op on an ordinary PR, because `CHANGELOG.md` holds only released sections
        # and release-plz has not written a pending one. It becomes the gate on the
        # release PR, where the fix is the one command it names.
        #
        # It runs BEFORE the synthesis step on purpose, and moving it after would be a
        # latent red. `squash_commits()` resolves each linked PR by walking `git log`, and
        # synthesis ends in `git reset --soft "$PR_BASE_SHA"` — which rewinds HEAD's
        # ancestry to the base tip as of the last PR event while leaving the worktree on
        # the merge ref. On a PR whose base has since moved, a changelog entry can then
        # cite a PR whose commit is no longer reachable, the lookup fails, and the script
        # exits 2 for a cause no author can fix. Same hazard the synthesis step already
        # documents for `git describe`.
        run: python scripts/inject_representation_disclosure.py --check
      - name: Synthesize the squash commit this PR will become
        # Without this the audit cannot see the commit it exists to judge. GitHub builds
        # the squash subject from the PR title and the body from the PR description, and
        # the `Representation-Change:` trailer lives in the description — so on a PR
        # branch no commit in `<latest tag>..HEAD` carries it, and a PR whose merged form
        # files a decline under **Representation changes** passes here and is caught only
        # after it lands. The sibling `representation-change` job already reads the
        # description for the same reason; this is the same fact, one step further on.
        #
        # `reset --soft` to the PR's base first, so the *history* is the preview and not
        # just the message. On a `pull_request` event `actions/checkout` gives the MERGE
        # ref, so `<latest tag>..HEAD` otherwise contains the branch's intermediate
        # commits and the merge commit itself — none of which survive a squash. Measured
        # on a simulated merge ref: 5 audited commits that way against 2 this way, where
        # 2 is exactly post-merge `main`. Soft-resetting keeps the index and worktree, so
        # the commit carries the PR's real tree and the audit still reads the PR's own
        # `release-plz.toml` — this is the squash commit, not an approximation of it.
        #
        # `--allow-empty` is still needed: a PR that changes no files (a description-only
        # edit re-running CI) would otherwise have nothing to commit.
        if: github.event_name == 'pull_request'
        # Through `env`, never interpolated into the script body: a PR title and
        # description are attacker-controlled text and `${{ }}` inside `run` would splice
        # them into the shell.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s (#%s)\n\n%s\n' "$PR_TITLE" "$PR_NUMBER" "$PR_BODY" > squash-message.txt
          # Resolve the tag BEFORE the reset, and hand it to the audit explicitly.
          #
          # `base.sha` is the base tip as of the last PR event, while the merge ref GitHub
          # builds uses the *current* base — so after a release lands, an un-resynchronized
          # PR resets to a commit from which the new tag is unreachable. `describe` would
          # then answer with the PREVIOUS tag and silently widen the range back over an
          # entire already-released cycle, re-judging merged work the PR author cannot
          # touch. Measured: pre-reset `describe` gives v0.14.0, post-reset gives v0.13.1.
          # Guarded because `describe` exits 128 on a tagless history and must not be what
          # fails the job under `set -e`.
          if AUDIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            echo "AUDIT_RANGE=$AUDIT_TAG..HEAD" >> "$GITHUB_ENV"
          else
            echo "no tag reachable from the merge ref; the audit will resolve its own range"
          fi
          git reset --soft "$PR_BASE_SHA"
          git -c user.name='github-actions' -c user.email='github-actions@github.com' \
            commit --allow-empty --no-verify --quiet --file squash-message.txt
          echo "auditing this squash-equivalent commit:"
          git --no-pager log -1 --format='%H%n%s'
          if [ -n "${AUDIT_TAG:-}" ]; then
            echo "audited range ($AUDIT_TAG..HEAD) now contains:"
            git --no-pager log --format='  %h %s' "$AUDIT_TAG..HEAD"
          fi
      - name: Audit the Representation changes section
        # `AUDIT_RANGE` is set by the step above from the tag resolved on the merge ref,
        # before the soft reset moved HEAD's ancestry. Empty on a push to `main` (no
        # synthesis step runs) and on a tagless history, where the script resolves its own
        # range — so this is an override, not a requirement.
        run: |
          if [ -n "${AUDIT_RANGE:-}" ]; then
            echo "auditing $AUDIT_RANGE"
            python scripts/check_changelog_grouping.py --range "$AUDIT_RANGE"
          else
            python scripts/check_changelog_grouping.py
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          components: clippy
      # Cargo caching is delegated to `Swatinem/rust-cache` rather than
      # hand-rolled `actions/cache` keys (#1218). Two reasons, both measured.
      #
      # **Size.** Every hand-rolled entry cached the same five paths including a
      # full `target/`, and they had grown to ~3 GiB each: on 2026-08-04 the
      # `-wheel`, `-clippy-all-features` and `-coverage` entries were 3.04 GB,
      # 3.00 GB and 2.87 GB, i.e. three entries from a single PR filling 9 GB of a
      # 10 GiB repository budget (measured usage: 11.76 GiB, already evicting).
      # `rust-cache` saves dependency artifacts only — it deletes the workspace
      # crate's own outputs, `incremental/`, `.d` files and stale entries before
      # saving. #1218 records that a hand-rolled trim was tried and "did not move
      # the needle", because it kept the bulk under `target/*/deps`.
      #
      # **Staleness.** `actions/cache` SKIPS the save when the primary key already
      # exists ("Cache hit occurred on the primary key …, not saving cache"), so a
      # lockfile-only key froze `target/` at whatever the first run for that
      # lockfile happened to write, forever. Rotating the key was the obvious fix
      # and #1218 records why it could not be afforded. `rust-cache` largely
      # dissolves the problem instead of paying for it: the only thing it stores is
      # dependency artifacts, and its key already hashes the dependency set,
      # rustc version and job — so a frozen entry cannot disagree with what the
      # job needs the way a frozen whole-`target/` could.
      #
      # Deliberately NOT set:
      # - `cache-on-failure` — it would save a tree per failed run, and budget is
      #   the constraint this change exists to relieve.
      # - `shared-key` — each job would then share one entry, which is the
      #   cross-profile mismatch that had `generated-docs` (dev profile) and
      #   `test-build` (`CARGO_PROFILE_TEST_DEBUG=0`) serving each other useless
      #   trees. `rust-cache` keys per job by default; `key` below only adds a
      #   legible name, so `gh api .../actions/caches` stays diagnosable — which
      #   is how #1218 was diagnosed in the first place.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Save a new cache generation ONLY from `main` (#1218 redux). `rust-cache`
          # keys per job and appends a lockfile/env hash, so every PR run that
          # differed in either minted a fresh ~0.2-0.7 GiB entry. Measured on
          # 2026-08-08: 42 entries totalling 13.79 GiB against a 10 GiB cap — 3 to 5
          # generations of every logical key, `coverage` alone holding 4 x ~0.69 GiB.
          # Over cap means GitHub evicts by LRU continuously, which is the #1218
          # failure (two generations reached 13.61 GiB and took the nightly's 3.25 GiB
          # `ferro-manifest-v3` with them). Restoring on every run and saving only on
          # `main` collapses it to one generation per key, ~4.2 GiB.
          #
          # The trade, stated: a PR that changes `Cargo.lock` no longer warms its own
          # cache, so it restores `main`'s generation through the `restore-keys`
          # prefix and recompiles what the lockfile moved. That is one slower job on
          # dependency-bumping PRs, against every cache in the repo currently racing
          # eviction.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: clippy
      # `--workspace` because `default-members` is the root package alone (see
      # `Cargo.toml`), so without it the `ferro-hgvs-soak-tests` driver — the one
      # `test-build-soak` compiles — is linted by nothing. It is the only member,
      # and it compiles a dozen modules that `--features dev` does not reach here
      # anyway, so the added cost is one small test target.
      - run: cargo clippy --workspace --features dev --all-targets -- -D warnings

  clippy-all-features:
    # Lints the feature-gated code that `--features dev` never compiles —
    # notably `python` (pyo3) and `hgvs-rs`, whose `#[cfg(test)]` modules are
    # otherwise unbuilt in CI and silently rot when the production API they
    # construct changes. Complements (does not replace) the `clippy` job
    # above: that one lints the `#[cfg(not(feature = ...))]` slice and the
    # default-features-off code most consumers compile, which `--all-features`
    # cannot see.
    name: Clippy (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Save only from `main` — see the note on the first
          # `rust-cache` block in this file.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: clippy-all-features
      - run: cargo clippy --all-features --all-targets -- -D warnings

  # The two generated spec artifacts, split out of `test-build`.
  #
  # These ran as the first two steps of `test-build`, which serialized ~52s of
  # generation ahead of the ~105s archive compile inside one job. They share
  # nothing with the archive but the library crate: the generators are `[[bin]]`
  # targets that read the spec submodule at RUNTIME, and what they emit is a
  # pair of JSON files the shards download. Running them concurrently with the
  # archive build takes that serialization off the critical path.
  #
  # Generation is itself the gate on the curated overrides — plain generation,
  # not `--check` — so this job failing means the overrides no longer resolve
  # against the spec checkout. That signal is now its own job rather than
  # buried in a build.
  spec-fixtures:
    name: Spec fixtures and generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No `lfs: true`, and nothing to fetch: this repository no longer
          # tracks anything with LFS. The 156 MB of bulk corpora are release
          # assets now (`tests/fixtures/CHECKSUMS.sha256`), fetched by the
          # `fixtures` job for the jobs that read them at test RUNTIME. Nothing
          # here reads them: no `include_str!`/`include_bytes!` names a path
          # under `tests/fixtures/bulk/` or `tests/fixtures/validation/`, and
          # this job only compiles.
          # Required here, and ONLY here: the generators harvest HGVS strings
          # from the vendored spec checkout at runtime.
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Save only from `main` — see the note on the first
          # `rust-cache` block in this file.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: spec-fixtures
      # The cheapest of the three per-commit caches by a wide margin: this job
      # spends ~120s producing roughly 0.5 MB of JSON, against 25.8 MB for the soak
      # archive and 106.6 MB for the test archive. It is also the one that gates the
      # `test` and `test-oracle` paths — `max(test-build, spec-fixtures) + slowest
      # shard` — so on a re-run of an unchanged tree it is the difference between
      # those paths costing ~120s before a single test starts and costing ~15s.
      #
      # The `--check` steps below are gates rather than artifact producers, and they
      # are skipped on a hit too. That is sound only because the save is explicit
      # and carries an implicit `success()`: an entry exists for this commit only if
      # every check passed on it, and the tree is byte-identical, so re-running them
      # can only reach the same verdict. With the combined `actions/cache` action
      # this would be a false-green generator — its post-step saves even when the
      # job failed, so a failing `--check` would publish an entry that every re-run
      # then skipped past.
      - name: Restore fixtures generated from this exact commit
        id: generated-fixtures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            tests/fixtures/grammar/hgvs_spec_normalization.json
            tests/fixtures/grammar/hgvs_spec_enumeration.json
            tests/fixtures/cis/cis_confluence_corpus.json
            tests/fixtures/cis/cis_confluence_nr_corpus.json
          key: generated-fixtures-${{ runner.os }}-${{ github.sha }}
      - name: Generate HGVS v21.0 spec fixture
        if: steps.generated-fixtures.outputs.cache-hit != 'true'
        run: cargo run --features dev --bin generate_spec_fixture
      - name: Generate HGVS spec test enumeration
        if: steps.generated-fixtures.outputs.cache-hit != 'true'
        run: cargo run --features dev --bin generate_spec_enumeration
      # The two cis confluence corpora, generated here for the same reason and at
      # far greater saving. `tests/it/cis_confluence_axis.rs` and
      # `tests/it/cis_confluence_nr_axis.rs` regenerate theirs on demand through
      # `common::fixture_gen`, which shells out to a nested `cargo run --features
      # dev --example generate_cis_confluence_corpus`. The `test` / `test-oracle`
      # shards run from a nextest **archive** and so have no warm `target/`: that
      # nested call compiles the crate from scratch *inside the test*, and the
      # cost lands on whichever of the nine tests the shard happens to hold.
      #
      # Measured on run 31268888323: `the_corpus_is_a_dense_set_of_real_confluence_classes`
      # took 117.6s in `Test (2/6)` and 127.3s in `Test oracle (2/3)` — a test that
      # reads an 8 MB JSON and makes a handful of cheap assertions, and that takes
      # 0.071s once the file exists.
      #
      # **The `--axes n,r` corpus is the second step for the same reason, and it
      # was missing until now.** `cis_confluence_nr_axis` landed with no wiring
      # here, so every one of its SIX tests paid the nested build in every shard
      # that held one — the cost is per test *process*, and nextest gives each
      # test its own. Measured on run 31670057963 (`Test oracle (1/3)`):
      # `the_rna_axis_is_spelled_in_the_rna_alphabet` took **129.2s** against
      # 0.15s locally once the file exists — it normalizes nothing, it only
      # compares strings — and `rna_five_prime_confluence_census` took **205.9s**,
      # of which the census itself is the ~77s remainder. Its `g,c` sibling
      # `three_prime_confluence_census` took 88.0s over *twice* the spellings,
      # because its corpus was downloaded. That asymmetry is the whole tell.
      #
      # It lives in THIS job rather than one of its own, and that was measured both
      # ways. Generation is ~3s but compiling the example is ~50s, so on run
      # 31275077075 this job went 64s -> 117s. A job of its own looks tempting —
      # `spec-fixtures` gates `test` and `test-oracle` — but a new job has no
      # `rust-cache` entry and would compile the whole dependency tree cold, which
      # is slower than the 53s it set out to save, while still gating both through
      # `needs`. Giving it a cache instead means a new key, and the repository is
      # only just under the 10 GiB cap (see the first `rust-cache` block above).
      # Here it reuses this job's already-warm dev-profile tree, and it is not on
      # the critical path: that runs through `test-build-soak` + `sweeps`.
      - name: Generate the cis confluence corpus
        if: steps.generated-fixtures.outputs.cache-hit != 'true'
        run: cargo run --features dev --example generate_cis_confluence_corpus
      # The transcript-typed half. `--axes` defaults to `g,c` and `--output` to
      # the corpus above, so BOTH flags are required and the path must match the
      # one `cis_confluence_nr_axis::CORPUS_RELATIVE_PATH` reads. The example is
      # already built by the step above, so this costs the ~3s of generation
      # rather than another ~50s of compiling.
      - name: Generate the cis confluence n./r. corpus
        if: steps.generated-fixtures.outputs.cache-hit != 'true'
        run: |
          cargo run --features dev --example generate_cis_confluence_corpus -- \
            --axes n,r --output tests/fixtures/cis/cis_confluence_nr_corpus.json
      # Merged in from the former `generated-docs` job. Those three generators are
      # `cargo run --features dev --example …` — the SAME profile and feature set as
      # the four steps above — so they were compiling an identical dependency tree
      # in a second job behind a second `rust-cache` key. Sharing this job's warm
      # tree costs a few seconds here against the ~54s that job took, and retires a
      # cache key (~0.36 GiB) from a repository that was over its cache cap.
      #
      # Gating is unchanged. `generated-docs` was a `needs:` of `test-required`;
      # now a failure here fails `spec-fixtures`, which SKIPS `test` and
      # `test-oracle`, and `test-required` demands `result == "success"` from both —
      # a skip is not a success, so the required `Test` context still goes red.
      #
      # `generated-docs` also set `CARGO_PROFILE_TEST_DEBUG: "0"`, deliberately not
      # carried over: it configures the *test* profile and every step here is a
      # `cargo run` in the dev profile, so it never applied to these generators.
      - name: Verify conformance summary docs are up to date
        if: steps.generated-fixtures.outputs.cache-hit != 'true'
        run: cargo run --features dev --example generate_conformance_summary -- --check
      - name: Tool-support tables up to date
        if: steps.generated-fixtures.outputs.cache-hit != 'true'
        run: cargo run --features dev --example generate_tool_support_tables -- --check
      - name: Perf tables up to date
        if: steps.generated-fixtures.outputs.cache-hit != 'true'
        run: cargo run --features dev --example generate_perf_tables -- --check
      # The exhaustive spec-derived conformance corpus is enumerated at TEST time
      # (`tests/it/spec_conformance_axis.rs` calls the library directly), so it
      # needs no artifact and runs in the sharded `test` job with no wiring. What
      # runs here is the other half of the job: re-deriving the committed rule
      # inventory's citations and per-file clause-unit counts from the spec
      # checkout, which is the ONLY place in CI the submodule is present. It
      # refuses on a moved quote, a moved clause-unit count, a `generatable`
      # clause no corpus row exercises, and a rule tag no clause claims — so a
      # submodule bump that invalidates a coverage claim fails the build instead
      # of leaving the claim standing.
      #
      # Deliberately a step in THIS job rather than a new one: a new job would
      # need its own `actions/cache` entry, and the repository's Actions cache
      # sits near its 10 GiB cap (#1218 records an earlier rotation reaching
      # 13.61 GiB, evicting by LRU and destroying the nightly's 3.25 GiB
      # `ferro-manifest-v3` as collateral). Adding a step reuses the existing
      # `spec-fixtures` rust-cache key and adds no entry at all.
      #
      # Gated on the same cache key as the steps above: the restored entry exists
      # only for a commit on which every check already passed, and the tree is
      # byte-identical, so re-deriving the inventory can only reach the same
      # verdict.
      - name: Check the spec conformance corpus rule inventory
        if: steps.generated-fixtures.outputs.cache-hit != 'true'
        run: cargo run --features dev --example generate_spec_conformance_corpus
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.generated-fixtures.outputs.cache-hit != 'true'
        with:
          path: |
            tests/fixtures/grammar/hgvs_spec_normalization.json
            tests/fixtures/grammar/hgvs_spec_enumeration.json
            tests/fixtures/cis/cis_confluence_corpus.json
            tests/fixtures/cis/cis_confluence_nr_corpus.json
          key: generated-fixtures-${{ runner.os }}-${{ github.sha }}
      # Only the fixtures are published from here. The two generator binaries
      # `spec_generator_preconditions` executes need no staging: they are
      # `[[bin]]` targets, so `test-build`'s archive already carries them and
      # the shards extract them into place — see the note on that job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: spec-fixtures
          path: |
            tests/fixtures/grammar/hgvs_spec_normalization.json
            tests/fixtures/grammar/hgvs_spec_enumeration.json
          # As on `bulk-fixtures` below, and with the same limit: this catches an
          # EMPTY artifact, not a short one. A consumer that downloads an artifact
          # missing a fixture falls back to `fixture_gen`'s nested `cargo run` and
          # rebuilds the crate inside the test — silently, since the suite still
          # passes. `warn` is the wrong default for an artifact anything reads.
          if-no-files-found: error
          retention-days: 1
      # A second artifact rather than a second path on the one above, because the
      # consumers download `spec-fixtures` with `path: tests/fixtures/grammar/` — a
      # single artifact spanning two fixture directories cannot be unpacked that way.
      #
      # Both corpora DO share a directory, so they can ride one artifact: the
      # upload roots it at their common ancestor (`tests/fixtures/cis`) and the
      # consumers' `path: tests/fixtures/cis/` unpacks both onto the paths their
      # tests read. Keep them on separate lines rather than a glob, so adding a
      # third file to that directory cannot be swept in by accident.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cis-corpus
          path: |
            tests/fixtures/cis/cis_confluence_corpus.json
            tests/fixtures/cis/cis_confluence_nr_corpus.json
          # See the note on `spec-fixtures` above.
          if-no-files-found: error
          retention-days: 1

  # Build the test binaries ONCE, then fan out: `test` and `test-oracle` consume
  # this job's `nextest archive`, so the crate compiles a single time no matter
  # how many shards run. (The two generated spec artifacts moved to
  # `spec-fixtures` above; the soak and sweeps run from the optimized archive
  # `test-build-soak` produces, not this one.)
  #
  # `--extract-to . --extract-overwrite` in the consumers is load-bearing, not
  # tidiness. 26 call sites across 10 test files resolve the CLI binary with
  # `env!("CARGO_BIN_EXE_ferro")`, which bakes an ABSOLUTE path to
  # `<workspace>/target/debug/ferro` at compile time. Extracting to nextest's
  # default temporary directory leaves that path empty and every CLI test fails
  # -- observed directly, 4-23 failures per shard, while the proptest-only soak
  # shards passed on the same archive. Every job in a workflow gets the same
  # runner workspace path, so extracting INTO the workspace puts the binaries
  # exactly where those baked paths point. Verified locally by hiding
  # `target/debug/ferro` to reproduce the shard's condition: default extraction
  # gave 6 failures, `--extract-to .` gave 6 passes.
  #
  # The same mechanism is why the shards need nothing staged for
  # `spec_generator_preconditions`, which resolves the two spec generators with
  # `env!("CARGO_BIN_EXE_generate_spec_{fixture,enumeration}")`. A nextest
  # archive packs every non-test binary the build produced, not just the test
  # binaries, and both generators are `[[bin]]` targets that `--features dev`
  # builds. Verified with the archive command below: it packs
  # `target/debug/generate_spec_fixture` and
  # `target/debug/generate_spec_enumeration` alongside `target/debug/ferro`,
  # all mode 755. Verified end to end too, by deleting both binaries and
  # running that module from the archive — extraction restored them executable
  # and all six tests passed. They were staged as a separate
  # `generator-binaries` artifact until this was measured; `--extract-overwrite`
  # replaced the downloaded copies before the tests ever read them.
  test-build:
    name: Build test archive
    runs-on: ubuntu-latest
    env:
      # The Test jobs build and LINK the integration-test binary. With full
      # debuginfo (dev/test profile default `debug = true`) the linked
      # `target/` exhausts the stock runner's ~14 GB free disk and the linker
      # dies with `ld terminated with signal 7 (Bus error)` — a write past a
      # full disk. Stripping test-binary debuginfo in CI removes the bulk of
      # that. CI-only (not in Cargo.toml), so local dev keeps full debuginfo
      # for backtraces.
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No `lfs: true`, and nothing to fetch: this repository no longer
          # tracks anything with LFS. The 156 MB of bulk corpora are release
          # assets now (`tests/fixtures/CHECKSUMS.sha256`), fetched by the
          # `fixtures` job for the jobs that read them at test RUNTIME. Nothing
          # here reads them: no `include_str!`/`include_bytes!` names a path
          # under `tests/fixtures/bulk/` or `tests/fixtures/validation/`, and
          # this job only compiles.
          # No `submodules: true`. The spec checkout is read at generator
          # RUNTIME, in the `spec-fixtures` job — nothing here reads it at
          # compile time (verified: no `include_str!`/`include_bytes!` under
          # `src/` or `tests/` names a path below `assets/`).
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      # `CARGO_PROFILE_TEST_DEBUG=0` re-fingerprints every dependency, so this
      # job's tree is not interchangeable with any other's — see the note on
      # `shared-key` above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Save only from `main` — see the note on the first
          # `rust-cache` block in this file.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: test-archive
          # `rust-cache` caches `${CARGO_HOME}/bin` unless told not to, so a
          # restore could extract a previously-saved `cargo-nextest` over the one
          # `install-action` puts there and pin this job to whichever version
          # first populated the key. This job writes an archive that other jobs
          # read, and producer and consumer must agree on the nextest version.
          #
          # This used to be handled by ORDERING — the install step below sat
          # after the cache step, with a comment saying that was deliberate. Not
          # caching the binaries removes the hazard at the source instead (#1396),
          # which matters because reordering two `uses:` steps looks harmless and
          # would silently reintroduce it. `nightly-soak.yml` and `fuzz.yml`
          # already do it this way.
          #
          # The cost is nil: `install-action` downloads a prebuilt binary rather
          # than compiling one. Measured on this PR's own runs rather than
          # assumed — see the PR body.
          cache-bin: "false"
      - uses: taiki-e/install-action@8e83571c9a797c9e42a58141f098806bfec453a0  # nextest
      # Same per-commit archive cache as `test-build-soak`. This one is 106.6 MB
      # against that one's 25.8 MB and was left uncached at first for exactly that
      # reason — it is not on the critical path while `test-build-soak` takes 170s.
      # It becomes the gate the moment the other two caches hit, though: the
      # `test-oracle` path is `max(test-build, spec-fixtures) + slowest oracle
      # shard`, so with `spec-fixtures` cached this 87s job is what remains.
      # `prune-ci-caches.yml` is what keeps the three families from re-creating the
      # over-cap problem this branch fixed.
      - name: Restore a test archive built from this exact commit
        id: test-archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: nextest.tar.zst
          key: nextest-archive-${{ runner.os }}-${{ github.sha }}
      - name: Build test archive
        if: steps.test-archive.outputs.cache-hit != 'true'
        # Compiles every test binary and packs them with their run metadata.
        run: cargo nextest archive --features dev --archive-file nextest.tar.zst
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.test-archive.outputs.cache-hit != 'true'
        with:
          path: nextest.tar.zst
          key: nextest-archive-${{ runner.os }}-${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nextest-archive
          path: nextest.tar.zst
          retention-days: 1

  # A SECOND archive, built at `opt-level = 3`, for the soak shards only.
  #
  # The soak is compute-bound in a way the other jobs are not: eight shards each
  # run 125,000 proptest cases, so a constant factor on the code under test is
  # multiplied a million times over. Measured locally at 5,000 cases, one
  # confluence property costs 1.90s of user CPU in the test profile against
  # 0.355s under this one — 5.4x. The other jobs run each test once and would
  # only pay the longer compile.
  #
  # ONE PACKAGE IS BUILT, AND IT IS NOT `ferro-hgvs`'s `it` TARGET. This job used
  # to build `--test it`, which compiles the whole 139k-line `it` crate — 6,217
  # tests — at `opt-level = 3` so that about 45 of them can run. Measured on an
  # M2 Max, `user` CPU with the workspace artifacts scrubbed the way `rust-cache`
  # scrubs them here, deps warm: 394.8s for the `it` archive, of which the
  # library is a minority. The rest was the driver, and the runtime
  # `opt-level = 3` buys comes from optimizing the LIBRARY.
  #
  # Cargo profile overrides are keyed on the PACKAGE, never on the target, so
  # `[profile.soak.package.ferro-hgvs]` reaches the lib, the bins and the `it`
  # test target alike — there is no way to spell "library optimized, driver
  # cheap" while both are one package. `ferro-hgvs-soak-tests` is that second
  # package: `tests-soak/tests/soak/main.rs` `#[path]`-includes the modules the
  # three consuming jobs select — plus, separately marked, any module one of
  # those reaches into — while the modules themselves stay under `tests/it/` and
  # stay declared in `tests/it/main.rs`.
  #
  # NOTE the package is NOT dropped to a lower `opt-level`, which is the half of
  # #1964 the measurement refused; the table and the reasoning are on
  # `[profile.soak]` in `Cargo.toml`. The saving is from compiling ~9k lines
  # instead of 139k, not from optimizing them less.
  #
  # `tests/it/soak_package_membership.rs` polices both directions: a module CI
  # selects from this archive that is not compiled into it would be negated by
  # `test`/`test-oracle` and run nowhere while CI got faster, and a module
  # compiled into it that nothing selects and nothing references is dead compile
  # cost on the critical path.
  #
  # `debug-assertions` and `overflow-checks` stay ON in the profile (see
  # Cargo.toml) so this buys speed without quietly weakening what the soak
  # checks — the `#[cfg(debug_assertions)]` oracles and every `debug_assert!`
  # in the normalizer behave exactly as they do under the test profile.
  test-build-soak:
    name: Build soak archive (optimized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No `lfs: true`, and nothing to fetch: this repository no longer
          # tracks anything with LFS. The 156 MB of bulk corpora are release
          # assets now (`tests/fixtures/CHECKSUMS.sha256`), fetched by the
          # `fixtures` job for the jobs that read them at test RUNTIME. Nothing
          # here reads them: no `include_str!`/`include_bytes!` names a path
          # under `tests/fixtures/bulk/` or `tests/fixtures/validation/`, and
          # this job only compiles.
          # No `submodules: true` either, for the same reason as `test-build`:
          # the spec checkout is read at generator RUNTIME, in `spec-fixtures`.
          # `cargo nextest archive --test it` compiles and packs targets, and
          # nothing under `src/` or `tests/` names a path below `assets/` at
          # compile time.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Save only from `main` — see the note on the first
          # `rust-cache` block in this file.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: test-archive-soak
          # Same reason as `test-build` above, and it applies at least as
          # strongly here: this job writes the archive that `soak` and `sweeps`
          # read, so a stale cached `cargo-nextest` would desynchronise three
          # jobs rather than one (#1396).
          cache-bin: "false"
      - uses: taiki-e/install-action@8e83571c9a797c9e42a58141f098806bfec453a0  # nextest
      # Skip the rebuild entirely when this exact commit already produced an
      # archive. `rust-cache` above caches DEPENDENCIES only — it deliberately
      # deletes workspace artifacts — so `ferro_hgvs` and the `it` test crate are
      # recompiled at `opt-level = 3` on every run even when not one byte of Rust
      # changed. Measured on run 31275848682: 142s of this job's 170s is that
      # rebuild, and this job plus `sweeps` IS the critical path.
      #
      # Keyed on the commit SHA, deliberately, rather than on `hashFiles` over the
      # inputs. A content-hash key is easier to hit and one forgotten input serves a
      # STALE archive — CI green against binaries built from other code, which is
      # the worst failure this repository could buy itself. The SHA changes whenever
      # anything does, so a hit means the tree is byte-identical and staleness is
      # impossible by construction. (On `pull_request` this is the merge SHA, so it
      # also busts correctly when `main` moves under the PR.)
      #
      # What it actually buys: re-runs of an unchanged tree. That is not a rare case
      # here — `on: pull_request` includes `edited` (the representation-change check
      # reads the PR description), so every description edit re-runs the whole
      # workflow, today from scratch.
      #
      # Only the soak archive is cached, not `test-build`'s. This one is on the
      # critical path and is 25.8 MB; the other is not on it and is 106.6 MB, so
      # caching it would cost 4x the space against a cap this PR just brought the
      # repository back under, to save runner-seconds rather than wall-clock.
      # `restore` + an explicit `save`, never the combined `actions/cache`. The
      # combined action saves in a post-step that runs even when the job FAILED, so
      # a broken or partial archive could be published under this commit's key and
      # every re-run would then skip the build and test whatever it contained. An
      # explicit save carries an implicit `success()`, so only a completed build is
      # ever cached. Same pattern on the two caches below.
      - name: Restore a soak archive built from this exact commit
        id: soak-archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: nextest-soak.tar.zst
          key: nextest-soak-archive-${{ runner.os }}-${{ github.sha }}
      - name: Build soak archive
        if: steps.soak-archive.outputs.cache-hit != 'true'
        # No `--features dev`. That feature pulls in `web-service` (axum, tokio,
        # tower, tracing) and `benchmark` (reqwest, rusqlite, tokio-postgres,
        # futures) — an entire dependency tree compiled at `opt-level = 3` to
        # produce one test binary that never touches any of it. None of the ten
        # modules this package compiles is gated on the feature and none of the
        # three consuming jobs selects a gated one, so the selections are
        # unchanged: verified by listing under each feature set,
        # `test(proptest)` resolves to 20 tests either way and the sweep filter
        # to 44.
        #
        # Both numbers have been stale before, in opposite directions and for
        # different reasons, which is why the re-measure commands are published
        # rather than the totals trusted. The proptest count moves whenever a
        # `*proptest*` module is added — it was 15 until `from_sequences_proptest.rs`
        # added five properties the `test(proptest)` filter picks up by name. The
        # sweep-filter count was recorded as 29 long after it had reached 44.
        #
        # The claim this comment exists to make is the *feature-independence* —
        # "either way" — which held through both drifts and still holds; the
        # totals are incidental to it. Re-measure rather than trust them:
        #
        #   cargo nextest list -p ferro-hgvs-soak-tests -E 'test(proptest)' | wc -l
        #   cargo nextest list -p ferro-hgvs-soak-tests -E "$SWEEP_FILTER" | wc -l
        run: |
          cargo nextest archive --cargo-profile soak -p ferro-hgvs-soak-tests \
            --archive-file nextest-soak.tar.zst
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.soak-archive.outputs.cache-hit != 'true'
        with:
          path: nextest-soak.tar.zst
          key: nextest-soak-archive-${{ runner.os }}-${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nextest-archive-soak
          path: nextest-soak.tar.zst
          retention-days: 1

  # The four large HGVS corpora the bulk-fixture and exhaustive suites read at
  # RUNTIME (156 MB), fetched ONCE per run and handed to the ten jobs that need
  # them as a workflow artifact.
  #
  # They used to be Git LFS objects fetched by `lfs: true` in each of those jobs.
  # LFS bandwidth is metered even on a public repository, so ten jobs x 156 MB
  # was ~1.56 GB of LFS egress per CI run; at 192 runs in a day that is ~146 GB,
  # and it exhausted the account's LFS budget outright — at which point EVERY
  # `lfs: true` job died at checkout with "This repository exceeded its LFS
  # budget". Release-asset downloads are NOT metered, so the corpora live on the
  # `test-fixtures-v1` release and this job fetches them over plain HTTPS.
  #
  # Egress after this change is 156 MB per run against ~1.56 GB, and none of it
  # is LFS.
  #
  # NOT `actions/cache`. The repository's Actions cache sits at ~9.9 GiB of a
  # 10 GiB cap across ~137 entries, so a 156 MB entry would evict Rust build
  # caches by LRU — which is #1218, where eviction took the nightly's 3.25 GiB
  # entry as collateral. A workflow artifact is a different quota, and one day of
  # retention is all a single run needs.
  #
  # Slots into the existing `needs: [test-build, spec-fixtures]` chain, so it
  # adds no serialization point: it runs in parallel with the two build jobs and
  # finishes long before either.
  fixtures:
    name: Fetch bulk test fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Neither `lfs: true` (nothing in this repository is LFS-tracked any
          # more) nor `submodules: true` — this job only needs the checksum
          # manifest and the fetch script.
          persist-credentials: false
      # Plain HTTPS against the public release assets, so no token is involved
      # and this works unchanged on a forked-PR runner.
      #
      # A FAILED FETCH MUST FAIL THE JOB. The three consuming suites skip green
      # when their fixtures are absent, so a fetch that failed quietly would
      # delete the ClinVar, CMRG and Paraphase coverage while making CI look
      # faster. The script verifies every download against
      # `tests/fixtures/CHECKSUMS.sha256` and exits non-zero on a bad download, a
      # digest mismatch or a missing asset; `test` and `test-oracle` then set
      # `FERRO_REQUIRE_BULK_FIXTURES`, which turns a fixture that still failed to
      # arrive into a test failure rather than a silent skip.
      - name: Fetch and verify the bulk fixtures
        run: scripts/fetch-test-fixtures.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bulk-fixtures
          # Named explicitly, not globbed. `if-no-files-found: error` catches
          # an EMPTY artifact, not a short one, and the four paths are exactly
          # what `CHECKSUMS.sha256` lists and the step above verified.
          path: |
            tests/fixtures/bulk/clinvar_hgvs_500k.json.gz
            tests/fixtures/bulk/clinvar_hgvs_unique.json.gz
            tests/fixtures/validation/cmrg_genes_exhaustive.json.gz
            tests/fixtures/validation/paraphase_genes_exhaustive.json.gz
          if-no-files-found: error
          # Ephemeral run data: nothing outside this run reads it, and artifact
          # storage counts against a quota of its own.
          retention-days: 1
          # Already gzip, so re-compressing costs CPU for ~nothing.
          compression-level: 0

  # The suite, split across shards. `--partition hash:K/N` assigns each test to
  # a shard by a hash of its name, so the split is deterministic and stays
  # stable as tests are added. Verified even on this suite: 8646 tests split
  # 2148 / 2181 / 2162 / 2155 across four shards.
  test:
    name: Test (${{ matrix.shard }}/6)
    needs: [test-build, spec-fixtures, fixtures]
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No `lfs: true`: nothing in this repository is LFS-tracked any more.
          # The 156 MB of bulk corpora this job reads at RUNTIME arrive as the
          # `bulk-fixtures` artifact below, fetched once per run by the
          # `fixtures` job from the `test-fixtures-v1` release.
          #
          # The spec worked-examples gate resolves each row's `file:line`
          # citation against the vendored checkout at RUN time and asserts the
          # quote verbatim, so this job needs the submodule (4.4 MB). Without
          # it that test fails rather than skips, which is deliberate: a
          # citation check that quietly no-ops is the failure mode it exists to
          # prevent.
          submodules: true
          persist-credentials: false
      - uses: taiki-e/install-action@8e83571c9a797c9e42a58141f098806bfec453a0  # nextest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: nextest-archive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: spec-fixtures
          path: tests/fixtures/grammar/
      # Carries BOTH confluence corpora — `cis_confluence_axis`'s `g,c` one and
      # `cis_confluence_nr_axis`'s `n,r` one. Without it those nine tests
      # regenerate theirs themselves, via a nested `cargo run --example` that has
      # to compile the crate from scratch inside the test — 117.6s on run
      # 31268888323 for the `g,c` test that only reads it, and 129.2s on run
      # 31670057963 for the `n,r` one. See the generating steps in
      # `spec-fixtures`.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cis-corpus
          path: tests/fixtures/cis/
      # The four bulk corpora, fetched and digest-verified once by `fixtures`.
      # `tests/fixtures/` preserves the artifact's two subdirectories, so the
      # files land back on the paths the suites read.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bulk-fixtures
          path: tests/fixtures/
      - name: "Note: reference-aware tests are skipped without a manifest"
        # `tests/mutalyzer_normalize_tests.rs` and the biocommons reference-aware
        # suite both silently no-op when `FERRO_MANIFEST` is unset (PR CI does
        # not provision the multi-GB reference manifest). Surface a GitHub
        # annotation so reviewers see the skip explicitly. #397 item 6.
        #
        # `FERRO_REQUIRE_MANIFEST` is deliberately NOT set anywhere in this
        # workflow. It is the sibling of `FERRO_REQUIRE_BULK_FIXTURES` below —
        # it promotes a manifest-absence skip to a failure — and the two differ
        # in exactly one respect: PR CI *does* provision the bulk fixtures and
        # *does not* provision a manifest, so requiring one here would fail
        # every PR. It is set in `nightly-mutalyzer.yml`, the only job that runs
        # `ferro prepare`. See `src/conformance/manifest_gate.rs`.
        if: matrix.shard == 1
        run: |
          echo "::notice title=Reference-aware tests skipped on PR CI::PR CI does not provision FERRO_MANIFEST; the mutalyzer / biocommons reference-aware test suites silently skip. The nightly nightly-mutalyzer.yml workflow runs the full suite against a real manifest."
      - name: Run Rust tests (shard ${{ matrix.shard }} of 6)
        env:
          # Absence of a bulk fixture must FAIL here, never skip. The bulk and
          # exhaustive suites `return` early on a missing file, so without this
          # a `fixtures` artifact that failed to arrive would delete the ClinVar,
          # CMRG and Paraphase coverage and report a faster green run — the one
          # outcome worse than a red one. See `tests/it/common/bulk_fixtures.rs`.
          FERRO_REQUIRE_BULK_FIXTURES: "1"
        # Consumes the standard archive `test-build` produces — see the note
        # there for why `--extract-to .` is load-bearing. Only the optimized
        # archive from `test-build-soak` is reserved for `soak` and `sweeps`.
        #
        # Proptests are excluded here and owned entirely by the `soak` job,
        # which runs them at 125k cases per shard instead of 12k. Leaving them
        # in would run the same properties twice at strictly lower depth AND
        # wreck shard balance: measured locally, the shard holding them took
        # 66.6s against 8.8-13.5s for its siblings.
        run: |
          cargo nextest run --archive-file nextest.tar.zst --workspace-remap . \
            --extract-to . --extract-overwrite \
            --partition hash:${{ matrix.shard }}/6 \
            -E "not test(proptest) and not ($SWEEP_FILTER) and not ($CENSUS_FILTER) and not ($ORACLE_ONLY_FILTER)"

  # The idempotency oracle re-run. Deliberately EXCLUDES the proptest modules:
  # their own property already *is* `norm(norm(x)) == norm(x)`, which is exactly
  # what the oracle asserts, so re-rolling thousands of random cases here checks
  # nothing the plain run did not already check — it just cost ~80s of every CI
  # run. The deep random coverage lives in the `soak` job below instead.
  # FOUR shards. The number was once load-bearing and no longer is — worth
  # recording, because the reasoning it rested on is the reasoning that produced
  # `CENSUS_FILTER`.
  #
  # `--partition hash:K/N` assigns each test by a hash of its NAME, so it
  # balances test *counts* and is blind to duration. At N=3 the two bulk
  # axis-preservation corpora — then the two slowest tests in the repository
  # under the oracles — both hashed into shard 1, every run, deterministically:
  #
  #     Test oracle (1/3)  242s     <- axis_is_preserved_over_the_{cmrg,clinvar_unique}_corpus
  #     Test oracle (2/3)   94s
  #     Test oracle (3/3)   77s
  #
  # 413s of work split 242/94/77 instead of ~138 each, so the job's critical path
  # was one unlucky draw. N=4 separated them (cmrg -> 1, clinvar_unique -> 3).
  #
  # **That fix did not hold, and could not have.** The shard count is chosen
  # against one snapshot of the test-NAME set, and every added or renamed test
  # re-rolls the whole assignment. #1840 added `issue_1542_direction_symmetry`,
  # it hashed onto shard 1 next to the cmrg corpus, and the job went back to
  # 328s against 132-160s for its siblings — the same failure the shard count
  # had been picked to avoid, two months later and by a different draw.
  #
  # So the robust alternative this comment used to name and decline — "giving
  # `normalize_axis_preserving` a job of its own and negating it here" — was
  # taken instead. It is `CENSUS_FILTER` and the `censuses` job, and it also
  # carries `issue_1542_direction_symmetry` and `spec_conformance_axis`. Its
  # cost was the three-file change this comment warned about (`ci.yml`,
  # `scripts/run_oracle_suite.sh`, `tests/it/oracle_exclude_invariant.rs`), and
  # that was the right price: a negation is stable under a re-roll and a shard
  # count is not.
  #
  # N stays at 4. Nothing now depends on which shard a particular test lands in,
  # so the number is once again merely conventional; it is left alone because
  # changing it re-rolls every assignment for no measured gain.
  test-oracle:
    name: Test oracle (${{ matrix.shard }}/4)
    needs: [test-build, spec-fixtures, fixtures]
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No `lfs: true`: nothing in this repository is LFS-tracked any more.
          # The 156 MB of bulk corpora this job reads at RUNTIME arrive as the
          # `bulk-fixtures` artifact below, fetched once per run by the
          # `fixtures` job from the `test-fixtures-v1` release.
          #
          # The spec worked-examples gate resolves each row's `file:line`
          # citation against the vendored checkout at RUN time and asserts the
          # quote verbatim, so this job needs the submodule (4.4 MB). Without
          # it that test fails rather than skips, which is deliberate: a
          # citation check that quietly no-ops is the failure mode it exists to
          # prevent.
          submodules: true
          persist-credentials: false
      - uses: taiki-e/install-action@8e83571c9a797c9e42a58141f098806bfec453a0  # nextest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: nextest-archive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: spec-fixtures
          path: tests/fixtures/grammar/
      # Carries BOTH confluence corpora — `cis_confluence_axis`'s `g,c` one and
      # `cis_confluence_nr_axis`'s `n,r` one. Without it those nine tests
      # regenerate theirs themselves, via a nested `cargo run --example` that has
      # to compile the crate from scratch inside the test — 117.6s on run
      # 31268888323 for the `g,c` test that only reads it, and 129.2s on run
      # 31670057963 for the `n,r` one. See the generating steps in
      # `spec-fixtures`.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cis-corpus
          path: tests/fixtures/cis/
      # The four bulk corpora, fetched and digest-verified once by `fixtures`.
      # `tests/fixtures/` preserves the artifact's two subdirectories, so the
      # files land back on the paths the suites read.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bulk-fixtures
          path: tests/fixtures/
      - name: Run Rust tests with the normalization self-checks
        # `FERRO_ASSERT_IDEMPOTENT` turns every reference-backed test into an
        # assertion that `norm(norm(x)) == norm(x)`. The gate is
        # `#[cfg(debug_assertions)]`, on in the test profile even with
        # `CARGO_PROFILE_TEST_DEBUG=0` (that strips debuginfo, not assertions).
        # See src/normalize/mod.rs::normalize.
        #
        # `FERRO_ASSERT_REPARSE` asserts the other half: that the normalized
        # description is one `parse_hgvs` accepts, when normalization is what
        # broke it. It exempts the `0`/`?` whole-allele outputs the entry point
        # rejects standalone, and any input that does not itself re-parse (a
        # parse/display round-trip asymmetry, not a normalization defect).
        # Separate from the above because neither subsumes the other, and the
        # idempotency oracle has a blind spot this one covers — it verifies by
        # re-normalizing its own output, which it cannot do for an output that
        # will not parse.
        #
        # `FERRO_ASSERT_IN_BOUNDS` is the third: no coordinate an output names may
        # be past the end of its own sequence (#1353). Neither of the other two
        # asks that question — `parse_hgvs` holds no provider, so an out-of-range
        # position is well-formed to it, and while a bad coordinate sometimes
        # perturbs idempotency it need not. The class had been found by hand three
        # times (#1274, #1343, #1307) before it was asserted here.
        #
        # `FERRO_ASSERT_SEQUENCE` — the fourth oracle at this same seam (#1615) —
        # is deliberately **not** set here, and this job is the one place the set
        # is incomplete. It used to fire on two rows of this job's own selection,
        # and both were real disagreements rather than noise to be suppressed:
        #
        #   * #1618 — `NC_TEST.1:g.262TG[6]` -> `g.259_262GT[6]`
        #     (`repeat_tract_maximization`). `hgvs_to_spdi` read the anchored
        #     spelling as 6 copies replacing a 1-copy tract and the normalizer's
        #     output as 6 copies replacing a 2-copy tract — 14 bases against 12.
        #     CLOSED before 6116f84a.
        #   * #1619 — `NM_033517.1:c.4818dupC` -> `c.4818dup`
        #     (`normalize_tests`). `hgvs_to_spdi` resolved the c. position by
        #     WALKING the exon list while the normalizer indexes the FLAT
        #     transcript, so the two disagreed across any transcript-coordinate
        #     gap: the input applied `C` and the output `T` at transcript
        #     position 4877. CLOSED — `CoordinateMapper::cds_to_tx` /
        #     `tx_to_cds` are flat sequence-axis conversions and no longer read
        #     the exon table; genome<->transcript mapping is unchanged and stays
        #     exon- and CIGAR-aware.
        #
        #   Both rows are green. THE SELECTION-WIDE RUN THIS COMMENT USED TO ASK
        #   FOR HAS NOW BEEN DONE, and it is RED — so the two closures were
        #   necessary and not sufficient, and the flag stays unset. Measured on
        #   `origin/main` @ 674e9c8b, this job's four flags plus
        #   `FERRO_ASSERT_SEQUENCE=1`, over the `-E` below with its two `env:`
        #   filters expanded and no `--partition`:
        #
        #     Summary [87.5s] 10383 tests run: 10378 passed, 5 failed, 289 skipped
        #
        #   FIVE failures, in two classes, NEITHER of them #1618 or #1619 and
        #   neither reachable by the two-row check this comment used to rest on:
        #
        #   * 3x `issue_1487_canonical_window_overflow` — NOT an oracle fire.
        #     `attempt to add with overflow` at `src/convert/mapper.rs:114`.
        #     Arming the flag routes the output through `hgvs_to_spdi`, which
        #     reaches `cds_to_tx`'s unchecked `cds_start as i64 + pos.base - 1`
        #     on an `i64::MAX`-adjacent `c.` coordinate. That module already
        #     records the measurement and names the site; the open issue is
        #     **#1690**. The three are
        #     `a_lone_member_at_an_extreme_coordinate_…`,
        #     `an_extreme_coordinate_…` and
        #     `two_adjacent_members_at_the_top_of_the_range_…`.
        #   * 2x `stranded_identity_member` — a genuine fire, of #1281's
        #     "denotes no sequence" shape, on that module's own sweep:
        #       input  TEMPLATE:g.[10_11insAT;11_12inv;12_13insA]
        #       output TEMPLATE:g.[11_12insTA;11_12=;12_13insA]
        #     The output pairs an insertion at interbase 11|12 with an identity
        #     claiming 11..12, so it denotes nothing. That module exists to PIN
        #     a defect (#1655's stranded derived identity, 132 of 132
        #     non-confluent), which puts it in exactly the class `ORACLE_EXCLUDE`
        #     documents above — a test that pins a defect and an oracle that
        #     aborts on it cannot both run.
        #
        #   Two further notes from the same measurement, so it is not re-run to
        #   rediscover them. With `FERRO_MANIFEST` also set — which this job does
        #   NOT set, so CI does not see these — six `mutalyzer_normalize_tests`
        #   axis tests fail too, on real `NG_` geometry, e.g.
        #   `NG_012337.1(NM_012459.2):c.4_5insGTA` -> `c.5_6insTAG`, where the
        #   input applies `GTAA` and the output `ATAG` over `[34, 35)`: an
        #   insertion shifted 3' past a base its first payload base does not
        #   match. Those axes early-return without the manifest, which is why
        #   they read as 11 failures with it and 5 without. And the proof the
        #   flag is not a no-op over this selection is
        #   `issue_1615_denoted_sequence_oracle::the_seam_compares_when_the_flag_is_set`,
        #   which is IN this selection and asserts the oracle's `compared`
        #   counter is non-zero; it skips by design when the flag is unset.
        #
        #   So arming this is blocked on #1690 and on a home for
        #   `stranded_identity_member` — NOT on another measurement.
        #
        #     This row replaced an earlier one on the same issue
        #     (`NM_000492.4:c.1520_1522del` -> `c.1521_1523del`), and the swap is
        #     the point rather than a detail. That one rode on a FIXTURE DEFECT —
        #     `normalization_transcripts.json` held cdot's exon table with every
        #     `end` decremented by one, giving a 1-base hole at every junction, a
        #     shape that occurs nowhere in 474,818 real builds. Repairing the
        #     fixture removed it. This row rides on cdot's own annotation:
        #     `NM_033517.1` genuinely has a 39-base hole between exon 10 and exon
        #     11, one of the 58 gapped builds in cdot-0.2.32.refseq.GRCh38. So
        #     #1619 is now demonstrated on real geometry rather than on an
        #     artifact, which makes it a STRONGER reason to keep the flag out of
        #     this job, not a weaker one — and it is the reproducer the issue had
        #     otherwise lost. See `CDOT_GAP_JUNCTIONS` in
        #     `tests/it/normalization_transcripts_exon_contract.rs`.
        #
        # Suppressing a row would hollow out the oracle, which is why neither was
        # ever exempted. It runs in `sweeps` below — the cis-allele space every
        # one of the eight defects it was built for came from, and where it is
        # measured green — and non-gating in the nightly. Both rows closing
        # unblocked the two obstacles this comment knew about; the selection-wide
        # run above then found two more, so the flag stays out until those are
        # settled. Do not read "both rows are green" as "it can be armed".
        env:
          FERRO_ASSERT_IDEMPOTENT: "1"
          FERRO_ASSERT_REPARSE: "1"
          FERRO_ASSERT_IN_BOUNDS: "1"
          # As in `test` above: an absent bulk fixture fails rather than skips.
          FERRO_REQUIRE_BULK_FIXTURES: "1"
        run: |
          cargo nextest run --archive-file nextest.tar.zst --workspace-remap . \
            --extract-to . --extract-overwrite \
            --partition hash:${{ matrix.shard }}/4 \
            -E "not test(proptest) and not ($SWEEP_FILTER) and not ($ORACLE_EXCLUDE) and not ($CENSUS_FILTER)"

  # 1,000,000-case idempotency soak on every PR, split 8 ways.
  #
  # Why this job exists: PR CI's ordinary 12k-case run has never caught one of
  # this campaign's idempotency defects. #1210 first reproduced at ~150,000
  # cases — two orders of magnitude past what a normal run explores. The 12k
  # setting is a smoke test; depth is what actually finds these.
  #
  # Why it is safe to gate merges on: each shard pins `PROPTEST_RNG_SEED`, and
  # proptest's default RNG is ChaCha, so a shard explores the SAME cases every
  # run. Verified directly: one seed reproduced a byte-identical minimal failing
  # case across repeated runs, while a different seed explored a different
  # stream. Without pinned seeds this would be flaky by construction — a latent
  # bug anywhere in the normalizer would randomly redden unrelated PRs, and
  # "re-run the job" would become the route to green.
  #
  # Why sharding the SEED and not the test list: `--partition` splits at test
  # granularity, and the cost here sits inside a handful of property functions
  # that each run their cases serially. Partitioning bottoms out at the slowest
  # single property. Eight shards of 125k cases under eight distinct seeds cover
  # the same 1M cases in a fraction of the wall time, and decorrelated streams
  # are if anything better coverage than one stream of 1M.
  #
  # The nightly counterpart (nightly-soak.yml) runs the same depth UNSEEDED, so
  # new territory still gets explored — it just reports instead of blocking.
  soak:
    name: Idempotency soak (${{ matrix.shard }}/8)
    # Only the optimized archive, NOT `test-build`. Every test the selection
    # below reaches lives in `tests/it/{cis_allele_confluence,
    # from_sequences, minimal_alignment_enumeration,
    # normalize_idempotency}_proptest.rs` — all four of which
    # `tests-soak/tests/soak/main.rs` compiles, which is what puts them in this
    # archive at all now that it holds one package rather than the whole `it`
    # binary — and none reads the generated spec fixture or shells out to the
    # staged generators — so the shards need neither of those artifacts, and
    # waiting on the job that produces them would put the dev-profile compile
    # back on the soak's critical path.
    #
    # `from_sequences_proptest.rs` joined this selection by being named
    # `*proptest*`, which is worth stating because the filter is by name: a new
    # module lands in a 1M-case job without anyone choosing that. Its five
    # properties are pure functions of a generated triple — no provider, no
    # fixture — so the two claims above still hold, and it earns its place here
    # (`the_direction_does_not_decide_describability` held for 256 cases and
    # failed at 20,000). Re-check both claims when adding another.
    #
    # `minimal_alignment_enumeration_proptest.rs` joined the same way, and was
    # re-checked rather than assumed: its eight properties are pure functions of
    # a generated `(reference, alternate)` byte pair, reading no provider and no
    # fixture. Its cost was measured too, because the enumerator it exercises is
    # exponential in block length — `PROPTEST_CASES=125000` over the module
    # costs 56.7 s wall in the *test* profile, i.e. before this job's ~5.4x
    # optimization. That is bounded by its own `MAX_BLOCK_LEN` of 6; raising it
    # is a soak-cost decision, not only a coverage one.
    needs: test-build-soak
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Distinct arbitrary seeds; the values matter only in that they differ
        # and are fixed. Changing one changes which cases that shard explores.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        include:
          - { shard: 1, seed: 1000001 }
          - { shard: 2, seed: 2000003 }
          - { shard: 3, seed: 3000017 }
          - { shard: 4, seed: 4000037 }
          - { shard: 5, seed: 5000011 }
          - { shard: 6, seed: 6000023 }
          - { shard: 7, seed: 7000003 }
          - { shard: 8, seed: 8000009 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No `lfs: true`, and no `bulk-fixtures` artifact. Nothing in this
          # repository is LFS-tracked any more, and the 156 MB of bulk corpora
          # (now release assets) are read only by the bulk-fixture and
          # exhaustive suites, which this job never selects — verified against
          # every module it runs.
          persist-credentials: false
      - uses: taiki-e/install-action@8e83571c9a797c9e42a58141f098806bfec453a0  # nextest
      # Safe to run from the archive: this job runs ONLY the proptest modules,
      # which never shell out to the `ferro` binary, so the compile-time
      # `CARGO_BIN_EXE_ferro` paths that break the other shards are never read.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: nextest-archive-soak
      - name: Soak 125k cases (seed ${{ matrix.seed }})
        env:
          # 8 shards x 125k = 1,000,000 cases per property.
          PROPTEST_CASES: "125000"
          PROPTEST_RNG_SEED: ${{ matrix.seed }}
          # `core_strategy`'s body-length filter rejects a steady ~6.7% of
          # draws, so proptest's absolute 65_536 local-reject cap aborts a long
          # run with "Too many local rejects" — a harness quota, not a failure.
          PROPTEST_MAX_LOCAL_REJECTS: "1000000"
        # `--no-tests=fail` pins what nextest's default `auto` already does
        # (verified: a filter matching nothing exits 4, "error: no tests to
        # run"). Stated explicitly because this job's entire value is the
        # `test(proptest)` selection: `auto` is documented as "automatically
        # determine behavior", and a job that runs a million cases must not be
        # one default-change or one profile setting away from a green no-op.
        run: |
          cargo nextest run --archive-file nextest-soak.tar.zst --workspace-remap . \
            --extract-to . --extract-overwrite --no-tests=fail -E 'test(proptest)'

  # The three exhaustive-sweep modules, moved off the `test` / `test-oracle`
  # partitions and onto the optimized archive.
  #
  # These were the whole workflow's critical path. `--partition hash:K/N` splits
  # by a hash of the test NAME, which balances shards by count and is blind to
  # cost — and all three sweeps happened to hash into the same shard. Measured
  # on run 30681684032, with everything else in those jobs under 4s:
  #
  #                                            Test (3/6)   Test oracle (1/2)
  #   cis_junction_crossing_shift                    118s                183s
  #   repeat_span_sibling_overlap                     66s                121s
  #   issue_1254_sibling_crossing_shift               30s                 78s
  #
  # They are exhaustive cross-products — the first is a six-deep nest of roughly
  # 276,000 cases — so they are compute-bound in exactly the way the soak is,
  # and they benefit from the optimized archive even more (user CPU, oracles on,
  # 3 reps, spread under 2%):
  #
  #   cis_junction_crossing_shift        71.06s -> 8.55s   8.3x
  #   repeat_span_sibling_overlap        40.44s -> 5.29s   7.6x
  #   issue_1254_sibling_crossing_shift  20.14s -> 2.32s   8.7x
  #
  # All three live in `tests/it/` and are `#[path]`-included by
  # `tests-soak/tests/soak/main.rs`, so they are inside the archive
  # `test-build-soak` produces alongside the soak's own modules — one archive for
  # the three jobs, not one per job. Adding a fourth sweep means naming it there
  # as well as in `SWEEP_FILTER`; `tests/it/soak_package_membership.rs` fails if
  # only one of the two is done.
  #
  # Running them ONLY here, with both oracles on, loses no coverage. The oracles
  # add assertions at `normalize_core_checked`'s exit and change no behaviour, so
  # an oracle-on run strictly subsumes the oracle-off one the `test` shards were
  # doing. Verified archive-safe the same way the soak is: none of the three
  # modules, nor `common::cis_apply_oracle`, reads `CARGO_BIN_EXE_ferro`.
  sweeps:
    name: Exhaustive sweeps
    needs: test-build-soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No `lfs: true`, and no `bulk-fixtures` artifact. Nothing in this
          # repository is LFS-tracked any more, and the 156 MB of bulk corpora
          # (now release assets) are read only by the bulk-fixture and
          # exhaustive suites, which this job never selects — verified against
          # every module it runs.
          persist-credentials: false
      - uses: taiki-e/install-action@8e83571c9a797c9e42a58141f098806bfec453a0  # nextest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: nextest-archive-soak
      - name: Run the exhaustive sweeps with the normalization self-checks
        env:
          # The full corpus, not the prefix a local run takes (#1295). The
          # sweeps were 92% of a local `cargo nextest run` — 79.6s of an 86.6s
          # suite for `cis_junction_crossing_shift` alone — so `sweep_seeds`
          # defaults to a 4-seed prefix and this job is what asks for all of it.
          #
          # This job is the ONLY place that sets it, which is why the exhaustive
          # coverage still runs on every PR: `test` and `test-oracle` negate
          # `SWEEP_FILTER` and so never reach these modules at all. If a sweep is
          # ever moved out of `SWEEP_FILTER`, it silently drops to the prefix
          # here — check both when editing that filter.
          FERRO_SWEEP_SEEDS: full
          FERRO_ASSERT_IDEMPOTENT: "1"
          FERRO_ASSERT_REPARSE: "1"
          # The sweeps are where this one earns its keep: they enumerate members
          # onto terminal positions in bulk, which is where every instance of the
          # class so far has come from. See the note on the pair in the `test`
          # job above.
          FERRO_ASSERT_IN_BOUNDS: "1"
          # The denoted-sequence oracle (#1615): does the normalized description
          # denote the same bases the input does? This job is its gating home
          # rather than `test-oracle` — see the note there for the two rows that
          # keep it out of the wider selection for now. The sweeps are also where
          # it has the most to say: every one of the eight defects it was built
          # for is a cis member crossing a sibling, which is exactly the space
          # these three modules enumerate. They already assert sequence
          # preservation case by case through `common::cis_apply_oracle`; this
          # extends the same question to every intermediate normalization the
          # sweeps perform rather than only the ones a test asserts on. Measured
          # green over the full corpus before it was set here.
          FERRO_ASSERT_SEQUENCE: "1"
        # `--no-tests=fail` for the reason spelled out on `soak`, and it matters
        # more here: `SWEEP_FILTER` names three modules explicitly, so renaming
        # one is exactly the edit that would drop a sweep from CI silently.
        #
        # `issue_1615_denoted_sequence_oracle` is appended to the selection
        # because this job is the only one IN THIS FILE that sets
        # `FERRO_ASSERT_SEQUENCE` (`nightly-mutalyzer.yml` sets it too, but it is
        # non-gating and selects only the reference-aware modules), and
        # that module holds the one test which reads the oracle's counters —
        # `the_seam_compares_when_the_flag_is_set`, the guard that a green run
        # actually compared something rather than the seam call having been
        # deleted. Without it here that guard would run only in jobs where the
        # flag is unset, where it skips by design, so the wiring would be
        # unverified everywhere.
        #
        # Appended here rather than added to `SWEEP_FILTER` for two reasons.
        # `tests/it/sweep_filter_invariant.rs`'s
        # `every_module_named_in_the_sweep_filter_consumes_the_seed_knob` fails
        # on a module in that filter which does not draw through `sweep_seeds(`,
        # and this one does not — the filter is a claim about the seed knob, not
        # a list of what this job runs. And `SWEEP_FILTER` is negated by `test`
        # and `test-oracle`, so naming it there would REMOVE the module from both
        # — trading the armed run for the unarmed one instead of adding it. The
        # module is therefore run twice on purpose: unarmed in `test`, armed
        # here. It is ~10 cheap unit tests, no sweep and no provider corpus.
        run: |
          cargo nextest run --archive-file nextest-soak.tar.zst --workspace-remap . \
            --extract-to . --extract-overwrite --no-tests=fail \
            -E "$SWEEP_FILTER + test(issue_1615_denoted_sequence_oracle)"

  # `CENSUS_FILTER`'s modules, moved off the `test` / `test-oracle` partitions
  # and onto the optimized archive. See that filter's own comment for why they
  # moved; this one is about how the job preserves what they were doing.
  #
  # TWO STEPS, because the modules do not agree about the oracles and the
  # difference is not a detail:
  #
  #   * ARMED runs what `test-oracle` ran, with the same three flags and no
  #     fourth. An armed run strictly subsumes the un-armed one — the oracles
  #     add assertions at `normalize_core_checked`'s exit and change no
  #     behaviour — which is the same argument `sweeps` makes, so dropping the
  #     plain-`test` copy of these two modules loses nothing.
  #   * UN-ARMED runs `spec_conformance_axis`, which is in `ORACLE_EXCLUDE` and
  #     must stay that way: it COUNTS the non-idempotent outputs
  #     `FERRO_ASSERT_IDEMPOTENT` panics on, and a panicking row is filed
  #     `declined` and never reaches the family's output set — which does not
  #     redden the census, it FLATTERS it. That module ran only in the plain
  #     `test` job before, so this step reproduces it exactly.
  #
  # `FERRO_ASSERT_SEQUENCE` is set by NEITHER step, which is what makes this a
  # move rather than a change of instrument. `sweeps` does set it, so these
  # modules could not simply be appended there.
  #
  # No `submodules: true`: none of the three modules names a path under
  # `assets/` (the spec worked-examples citation gate, which does, stays in
  # `test`). `spec-fixtures` IS needed —
  # `normalize_axis_preserving::axis_is_preserved_over_the_spec_fixture` calls
  # `ensure_spec_fixture`, which regenerates via a nested `cargo run` when the
  # file is absent, and this job has no crate to build from. `bulk-fixtures` is
  # needed for the three corpus tests in that same module.
  #
  # Verified archive-safe the way `soak` and `sweeps` are: all three modules live
  # in `tests/it/` and are `#[path]`-included by `tests-soak/tests/soak/main.rs`,
  # so they are inside the archive `test-build-soak` produces, none is gated on
  # the `dev` feature, and none reads `CARGO_BIN_EXE_ferro`. A module named in
  # `CENSUS_FILTER` but missing from that driver would be negated here and absent
  # from the archive, i.e. run nowhere;
  # `tests/it/soak_package_membership.rs` is what makes that loud.
  censuses:
    name: Slow censuses (optimized)
    needs: [test-build-soak, spec-fixtures, fixtures]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8e83571c9a797c9e42a58141f098806bfec453a0  # nextest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: nextest-archive-soak
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: spec-fixtures
          path: tests/fixtures/grammar/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bulk-fixtures
          path: tests/fixtures/
      - name: Run the censuses that need the oracles armed
        env:
          # The three `test-oracle` sets, and only those three. See that job for
          # what each asserts and why `FERRO_ASSERT_SEQUENCE` is not among them.
          FERRO_ASSERT_IDEMPOTENT: "1"
          FERRO_ASSERT_REPARSE: "1"
          FERRO_ASSERT_IN_BOUNDS: "1"
          # Absence of a bulk fixture must FAIL here, never skip — the same
          # reason as in `test`. `normalize_axis_preserving`'s three corpus
          # tests `return` early on a missing file, so without this a
          # `bulk-fixtures` artifact that failed to arrive would delete the
          # ClinVar, CMRG and Paraphase axis coverage and report a *faster*
          # green run.
          FERRO_REQUIRE_BULK_FIXTURES: "1"
        # `--no-tests=fail` for the reason spelled out on `soak` and `sweeps`:
        # this step names its modules explicitly, so a rename is exactly the
        # edit that would drop a census from CI silently.
        run: |
          cargo nextest run --archive-file nextest-soak.tar.zst --workspace-remap . \
            --extract-to . --extract-overwrite --no-tests=fail \
            -E "test(issue_1542_direction_symmetry) + test(normalize_axis_preserving) + test(clinvar_hgvs_tests)"
      - name: Run the census that may not be measured with an oracle armed
        # No `FERRO_ASSERT_*` here, deliberately, and no bulk fixtures: this
        # module builds its corpus in code (`conformance::spec_corpus`) and
        # reads nothing from disk.
        run: |
          cargo nextest run --archive-file nextest-soak.tar.zst --workspace-remap . \
            --extract-to . --extract-overwrite --no-tests=fail \
            -E "test(spec_conformance_axis)"

  # The generated-doc `--check` gates. Split out of the old monolithic Test job
  # so they no longer sit behind the whole suite on the critical path.
  # Aggregator that reports the `Test` status context.
  #
  # `main` has an ACTIVE RULESET (not legacy branch protection — it does not
  # appear under /branches/main/protection, which 404s) requiring these exact
  # contexts: Build, Test, Clippy, Clippy (all features), Format, Python Lint,
  # Python Wheel Test, abi3 floor ↔ requires-python.
  #
  # Sharding renamed the old single `Test` job to `Test (K/6)`, so the required
  # `Test` context stopped being reported and every PR hung on "Expected —
  # Waiting for status to be reported" with no run to link to. This job restores
  # the contract from inside the workflow, so no repository-settings change is
  # needed and future re-shardings cannot break it again.
  test-required:
    name: Test
    runs-on: ubuntu-latest
    needs: [test, test-oracle, soak, sweeps, censuses]
    # `always()` so a failed or cancelled dependency still reports a conclusion
    # rather than leaving the required context pending forever.
    if: always()
    steps:
      - name: Verify every test job succeeded
        run: |
          echo "test            = ${{ needs.test.result }}"
          echo "test-oracle     = ${{ needs.test-oracle.result }}"
          echo "soak            = ${{ needs.soak.result }}"
          echo "sweeps          = ${{ needs.sweeps.result }}"
          echo "censuses        = ${{ needs.censuses.result }}"
          if [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.test-oracle.result }}" != "success" ] \
            || [ "${{ needs.soak.result }}" != "success" ] \
            || [ "${{ needs.sweeps.result }}" != "success" ] \
            || [ "${{ needs.censuses.result }}" != "success" ]; then
            echo "::error::one or more test jobs did not succeed"
            exit 1
          fi

  # Builds the release wheel with maturin and exercises it from a clean venv,
  # outside the source tree. This catches packaging issues (missing data files,
  # stale stubs, sys.path leakage) that the editable-mode install in the `test`
  # job above can hide.
  python-wheel-test:
    name: Python Wheel Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Save only from `main` — see the note on the first
          # `rust-cache` block in this file.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: python-wheel
      - name: Build release wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.0,<2.0'
          maturin build --release --features python --out dist
      - name: Install wheel into clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --upgrade pip
          /tmp/wheel-venv/bin/pip install --no-index --find-links dist ferro-hgvs
          /tmp/wheel-venv/bin/pip install pytest
      - name: Verify import resolves to installed wheel
        run: |
          /tmp/wheel-venv/bin/python - <<'PY'
          import ferro_hgvs
          assert "/tmp/wheel-venv" in ferro_hgvs.__file__, ferro_hgvs.__file__
          print("OK: imported from", ferro_hgvs.__file__)
          PY
      - name: Run Python tests against installed wheel
        working-directory: /tmp
        run: >
          /tmp/wheel-venv/bin/pytest
          --import-mode=importlib
          --rootdir=/tmp
          "$GITHUB_WORKSPACE/tests/python/" -v

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          # For the release-profile lint below. The two `clippy` jobs request the
          # component the same way; without it `cargo clippy` is not installed.
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Save only from `main` — see the note on the first
          # `rust-cache` block in this file.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: build-release
      # The release-profile lint (#1383). It lives in THIS job on purpose: the two
      # `clippy` jobs both lint the debug profile, so nothing checked the release
      # profile, and the normalization oracles are required by convention to
      # compile out of release entirely (`#[cfg(debug_assertions)]` on
      # `assert_in_bounds`, `assert_reparseable`, `assert_idempotent` and their
      # `*_self_check_enabled` flags). An oracle helper left ungated becomes dead
      # code in release, and `dead_code` is warn-by-default, so nothing went red:
      # #1366's pre-review head failed this command with three such errors while
      # all three CI clippy jobs were green on the same commit.
      #
      # Here rather than in a job of its own because the repository sits near the
      # 10 GiB Actions cache cap and #1218 records two cache generations reaching
      # 13.61 GiB, evicting by LRU and destroying the nightly's 3.25 GiB
      # `ferro-manifest-v3` as collateral damage. This job already builds the
      # release profile and already owns a `rust-cache` entry (`build-release`),
      # so the lint adds no new cache KEY — only clippy's own fingerprints to an
      # entry that already exists. (The +30 MB / +1.6% this was measured at
      # originally was against the hand-rolled whole-`target/` entries that #1370
      # retired; `rust-cache` stores dependency artifacts only, so the marginal
      # cost is smaller still.) `Build` is also already a required check, so a
      # failure blocks a merge rather than only turning a non-required job red.
      #
      # Deliberately NOT `--all-targets`: the dead code lands in the `lib` target,
      # which the plain invocation covers. Measured by removing the four
      # `#[cfg(any(debug_assertions, test))]` gates from
      # `src/normalize/merge.rs` — this command then fails with all four items
      # reported against `(lib)`, and passes with them restored. `--all-targets`
      # would additionally compile every test and bench binary with optimisation
      # for no gain here.
      - run: cargo clippy --release -- -D warnings
      # The featureless guard (#1505). Every other Rust job in this workflow
      # either passes `--features dev` / `--all-features`, or is scoped to the
      # soak driver package (`test-build-soak`'s
      # `-p ferro-hgvs-soak-tests`). So the DEFAULT
      # feature set's unit tests — the `#[cfg(test)]` modules under `src/` — are
      # compiled NOWHERE in CI, and a call from one of them into feature-gated
      # code cannot turn any job red.
      #
      # Not hypothetical: #1372 put exactly such a call on `main` and it survived
      # until an external contributor ran the `cargo test` this repository's own
      # README documents (`README.md:433`). Four `E0599`s, invisible to all 34
      # checks, reported from outside the project.
      #
      # `--no-run` on purpose: the claim being defended is that the default
      # feature set BUILDS, not that these tests run a second time. `--lib
      # --bins` covers every `#[cfg(test)]` module under `src/`; the integration
      # tree is already compiled featureless by `test-build-soak`.
      #
      # In THIS job rather than one of its own, for the reason the release-profile
      # lint above gives at length: the repository sits near the 10 GiB Actions
      # cache cap and #1218 records eviction cascades caused by adding cache keys.
      # `build` already owns `build-release` and is already a required check, so
      # the guard blocks a merge instead of only reddening an optional job.
      - name: Unit tests compile with default features
        run: cargo test --no-run --lib --bins
      - run: cargo build --release
      - name: Check binary size
        run: |
          ls -lh target/release/ferro
          size=$(stat -c%s target/release/ferro 2>/dev/null || stat -f%z target/release/ferro)
          echo "Binary size: $size bytes"
          if [ "$size" -gt 10485760 ]; then
            echo "Error: Binary size exceeds 10MB limit"
            exit 1
          fi
