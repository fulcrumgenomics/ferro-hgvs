name: Fuzz Testing

on:
  # Run on schedule (weekly)
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Seconds to fuzz each target'
        required: false
        default: '300'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_parse_hgvs
          - fuzz_structured_hgvs

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # nightly
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      # Cargo caching via `rust-cache`; rationale recorded above the equivalent
      # step in `ci.yml` (#1218).
      #
      # `workspaces` is required here and is not boilerplate: `fuzz/Cargo.toml`
      # declares its own empty `[workspace]` to stay out of the root package, so
      # the tree cargo-fuzz builds into is `fuzz/target/` and `rust-cache` would
      # otherwise cache the root workspace's `target/`, which this job never
      # populates. The old key cached `fuzz/target/` explicitly; this preserves
      # that.
      #
      # `cache-bin: false` fixes a pre-existing hazard rather than introducing
      # one. `cargo install cargo-fuzz` runs in the step ABOVE this one, and the
      # old key cached `~/.cargo/bin/` — so the restore landed on top of the
      # just-installed binary and could overwrite it with whatever version first
      # populated the key. Not caching binaries removes the possibility. It also
      # means `cargo install cargo-fuzz` compiles every run, which it already did
      # (the install ran before the restore, so it never read the cache anyway);
      # making that install cheap is a separate change and is not attempted here.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: fuzz-${{ matrix.target }}
          workspaces: fuzz
          cache-bin: "false"

      - name: Download corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzzer
        env:
          FUZZ_SECONDS: ${{ github.event.inputs.fuzz_seconds || '300' }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          cd fuzz
          if ! [[ "$FUZZ_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid fuzz_seconds='$FUZZ_SECONDS' (must be a positive integer)" >&2
            exit 1
          fi
          timeout "${FUZZ_SECONDS}s" cargo +nightly fuzz run "${FUZZ_TARGET}" -- -max_len=1024 || true

      - name: Save corpus
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: always()
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

  report-failure:
    needs: fuzz
    if: failure()
    uses: ./.github/workflows/report-failure.yml
    permissions:
      contents: read
      issues: write
    with:
      title: "fuzz: a target found a crash"
      summary: >-
        A fuzz target failed. The parser is expected to reject bad input, never panic on it.
      hint: |
          The crashing input is in the run artifacts. Reproduce:
          ```
          cargo fuzz run <target> <artifact>
          ```
          Commit the artifact as a regression seed alongside the fix.
