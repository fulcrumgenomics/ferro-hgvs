name: Nightly idempotency soak

# The exploratory half of the idempotency coverage.
#
# PR CI's `soak` job runs the same 1,000,000 cases with PINNED seeds, so it is
# deterministic and safe to gate merges on — but a pinned seed explores the same
# cases forever, so after its first run it is a (very deep) regression gate
# rather than a way to discover anything new.
#
# This workflow is the other half: same depth, UNSEEDED, so every night walks
# fresh territory. It reports instead of blocking, because a random-seed failure
# is by nature unrelated to whatever happened to merge that day — making it a
# required check would randomly redden innocent PRs, which is exactly the
# failure mode the pinned seeds in CI exist to avoid.
#
# Every defect this campaign found (#1185, #1202, #1207, #1209, #1210) came from
# depth, not breadth: #1210 first reproduced at ~150,000 cases. Nothing in the
# ordinary PR suite explores that far.

on:
  schedule:
    # 05:20 UTC daily, offset from the other nightlies so they do not contend.
    - cron: "20 5 * * *"
  workflow_dispatch:

# Workflow-level default is read-only. `issues: write` is granted narrowly, on
# the `report` job alone, which is the only step that files anything.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # One optimized build, fanned out to all eight shards.
  #
  # Each shard used to run `cargo nextest run` directly, so every one of the
  # eight compiled the whole test suite from scratch AND ran both spec
  # generators first — eight full builds, and ~52s of fixture generation per
  # shard for an artifact no proptest module reads. This mirrors what PR CI's
  # `test-build-soak` does instead: build once, archive the `it` binary, and let
  # the shards download it.
  #
  # `--cargo-profile soak` matters more here than anywhere: measured at 5,000
  # cases, a confluence property costs 1.90s of user CPU in the test profile
  # against 0.355s under this one, and `debug-assertions` / `overflow-checks`
  # stay on so nothing the soak checks is weakened.
  build:
    name: Build soak archive (optimized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Neither `lfs: true` nor `submodules: true`, matching `test-build`
          # and `test-build-soak` in ci.yml. This job only compiles: the 149 MB
          # of LFS fixtures (`tests/fixtures/bulk/*.gz`,
          # `tests/fixtures/validation/*_exhaustive.json.gz`) are read at test
          # RUNTIME by suites the archive's own consumers never select, and the
          # spec checkout is read at generator RUNTIME. Nothing under `src/` or
          # `tests/` names a path below either at compile time. Both were
          # inherited from the job this replaced, which used to run the tests
          # as well as build them.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      # Cargo caching via `rust-cache`; rationale recorded above the equivalent
      # step in `ci.yml` (#1218).
      #
      # The hand-rolled key this replaces was already correct about staleness —
      # it hashed this workflow file as well as the lockfile, suffix-before-hash
      # so its restore-key was a real prefix, after the measurement that a
      # lockfile-only key had frozen dev-feature artifacts into an
      # `opt-level = 3` tree and was re-compiling reqwest/hyper/criterion every
      # run. That reasoning is preserved in `ci.yml`; what it could not fix is
      # size, and this job's `soak` profile tree is the largest in the repo.
      # `rust-cache` stores dependency artifacts only, and its key already
      # covers the dependency set, rustc version and job.
      #
      # `cache-bin: false` is the load-bearing option here, not a default worth
      # skipping past. `rust-cache` caches `~/.cargo/bin` unless told not to, so
      # a restored `cargo-nextest` would overwrite the one `install-action` puts
      # there and pin this job to whichever version first populated the key.
      # This job writes the archive the eight shards below read, and producer and
      # consumer must agree on the nextest version. The old step documented that
      # hazard and dodged it by *ordering* — install after restore. Not caching
      # the binaries removes it at the source instead, so the ordering below is
      # no longer what protects correctness (it is kept only because it costs
      # nothing).
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          # Save a new cache generation ONLY from `main` (#1218 redux). `rust-cache`
          # keys per job and appends a lockfile/env hash, so every PR run that
          # differed in either minted a fresh ~0.2-0.7 GiB entry. Measured on
          # 2026-08-08: 42 entries totalling 13.79 GiB against a 10 GiB cap — 3 to 5
          # generations of every logical key, `coverage` alone holding 4 x ~0.69 GiB.
          # Over cap means GitHub evicts by LRU continuously, which is the #1218
          # failure (two generations reached 13.61 GiB and took the nightly's 3.25 GiB
          # `ferro-manifest-v3` with them). Restoring on every run and saving only on
          # `main` collapses it to one generation per key, ~4.2 GiB.
          #
          # The trade, stated: a PR that changes `Cargo.lock` no longer warms its own
          # cache, so it restores `main`'s generation through the `restore-keys`
          # prefix and recompiles what the lockfile moved. That is one slower job on
          # dependency-bumping PRs, against every cache in the repo currently racing
          # eviction.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: nightly-soak
          cache-bin: "false"
      - uses: taiki-e/install-action@8e83571c9a797c9e42a58141f098806bfec453a0  # nextest
      - name: Build soak archive
        # No `--features dev` — see the same step in ci.yml. The feature drags
        # `web-service` and `benchmark` into an `opt-level = 3` build for a
        # binary that uses neither, and `test(proptest)` resolves to the same
        # 10 tests with or without it.
        run: |
          cargo nextest archive --cargo-profile soak --test it \
            --archive-file nextest-soak.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nextest-archive-soak
          path: nextest-soak.tar.zst
          retention-days: 1

  soak:
    name: Unseeded soak (${{ matrix.shard }}/8)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # Let every shard finish: with independent random streams, one shard
      # failing says nothing about the others, and the extra failures are
      # additional evidence rather than noise.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # Still checked out, for two reasons the archive does not cover: proptest
      # writes its shrunk case under `tests/proptest-regressions/`, and the
      # capture step below reads that tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No `lfs: true`, matching the `soak` job in ci.yml, which selects
          # the same `test(proptest)` set. The 149 MB of LFS fixtures
          # (`tests/fixtures/bulk/*.gz`,
          # `tests/fixtures/validation/*_exhaustive.json.gz`) are read only by
          # the bulk-fixture and exhaustive suites, and neither proptest module
          # touches them — so this was 149 MB fetched eight times a night for
          # files nothing here opens.
          persist-credentials: false
      - uses: taiki-e/install-action@8e83571c9a797c9e42a58141f098806bfec453a0  # nextest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: nextest-archive-soak
      - name: Soak 125k unseeded cases
        # No PROPTEST_RNG_SEED: each shard, each night, draws a fresh stream.
        env:
          PROPTEST_CASES: "125000"
          PROPTEST_MAX_LOCAL_REJECTS: "1000000"
        # `--no-tests=fail` for the reason spelled out on ci.yml's `soak` job,
        # which runs the identical selection against the identical archive. A
        # nightly is the worse place to lose it: nobody watches a green run.
        run: |
          cargo nextest run --archive-file nextest-soak.tar.zst --workspace-remap . \
            --extract-to . --extract-overwrite --no-tests=fail -E 'test(proptest)'
      - name: Capture the failing seed
        # proptest writes the shrunk case to its persistence file. Surfacing it
        # here means the reproducer is in the run log even if the artifact is
        # missed — and that file is exactly what gets committed alongside the
        # eventual fix, per the convention in tests/proptest-regressions/.
        #
        # Both modules' files are printed, because this job selects
        # `test(proptest)` and either can be the one that grew a seed.
        if: failure()
        run: |
          echo "::group::proptest regression seeds"
          find tests/proptest-regressions -name '*.txt' -print -exec cat {} \;
          echo "::endgroup::"
          # Which file proptest appended to is the reliable signal for *which*
          # property failed — the run log above prints all of them, and a
          # 14-seed file looks much like a 3-seed one at a glance.
          echo "::group::seed files this run modified"
          git status --porcelain tests/proptest-regressions/ || true
          echo "::endgroup::"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: proptest-regressions-shard-${{ matrix.shard }}
          path: tests/proptest-regressions/
          retention-days: 30

  report:
    name: Report soak failures
    runs-on: ubuntu-latest
    needs: soak
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the tracking issue
        # One rolling issue rather than one per night, so a defect that
        # reproduces for several nights does not bury the tracker.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="nightly soak: a proptest property failed"
          LEGACY_TITLE="nightly soak: idempotency property failed"

          # `in:title` alone is a *word* match, not an exact one: the search
          # tokenizes, so any issue whose title merely contains these words
          # ranks, and `.[0]` then takes whichever GitHub happened to sort
          # first. That is how a rolling tracker ends up commenting on an
          # unrelated issue. Quote the phrase to narrow the search, then filter
          # on `.title == $t` so only an exact match can be adopted.
          find_issue_by_exact_title() {
            gh issue list --state open --search "\"$1\" in:title" \
              --json number,title \
              | jq -r --arg t "$1" '[.[] | select(.title == $t)][0].number // empty'
          }

          EXISTING=$(find_issue_by_exact_title "$TITLE")
          # Also match the pre-#1235 title, so an issue already rolling under
          # the old wording keeps being updated instead of being duplicated.
          if [ -z "$EXISTING" ]; then
            EXISTING=$(find_issue_by_exact_title "$LEGACY_TITLE")
          fi
          # The job selects `test(proptest)`, which is TWO modules, so the body
          # must not name one of them. It said "idempotency" while
          # `cis_allele_confluence_proptest` was also in the selection, and that
          # module contributes four live properties to this soak
          # (`all_encodings_of_one_haplotype_converge`,
          # `the_converged_form_is_a_fixed_point`,
          # `members_are_disjoint_and_ascending` and
          # `an_indel_haplotype_is_authored_order_independent`) — so a
          # confluence failure would have been reported under the wrong name,
          # pointing at the wrong seed file and the wrong reproduce command.
          #
          # Its fifth, `an_indel_haplotype_normalizes_to_its_own_sequence`, is
          # deliberately NOT among them: it is `#[ignore]`d for #1325 and this
          # job passes no `--run-ignored`, so it never fires here. Say so
          # explicitly — the count is what makes "two modules, either can fail"
          # true rather than a guess.
          BODY=$(printf '%s\n' \
            "The unseeded 1M-case proptest soak failed." \
            "" \
            "Run: $RUN_URL" \
            "" \
            "**Which property failed** is the failing test name in the nextest summary in the run log — that is always present. The \"seed files this run modified\" group narrows it to a seed file, but only when proptest appended a *new* case: proptest replays the persisted seeds before drawing random ones, so a failure on an already-pinned seed modifies nothing and leaves that group empty. The shrunk case itself is in the \"proptest regression seeds\" group and in the \`proptest-regressions-shard-*\` artifact." \
            "" \
            "This job runs both proptest modules. To reproduce locally, add the seed line to the file it was appended to and run the matching command:" \
            "" \
            '```' \
            "# tests/proptest-regressions/normalize_idempotency_proptest.txt" \
            "cargo nextest run --features dev -E 'test(normalize_idempotency_proptest)'" \
            "" \
            "# tests/proptest-regressions/cis_allele_confluence_proptest.txt" \
            "cargo nextest run --features dev -E 'test(cis_allele_confluence_proptest)'" \
            '```' \
            "" \
            "Commit that seed line alongside the fix — it becomes the regression guard." \
            "" \
            "Note that a seed is replayed *through* its strategy, so editing how a strategy consumes randomness makes every seed recorded against it regenerate a different case. Check the strategy is untouched before concluding a pinned seed no longer reproduces.")
          if [ -n "$EXISTING" ]; then
            # Re-title on the way past. Without this, an issue matched by the
            # old-wording fallback keeps being commented on under a title that
            # names one of the two modules — the exact confusion this change
            # exists to remove. `gh issue edit` is idempotent, so it costs one
            # no-op call when the title already matches.
            gh issue edit "$EXISTING" --title "$TITLE"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
