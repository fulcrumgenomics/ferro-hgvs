[workspace]
# For a 0.x crate, release-plz's default bumps the patch version for feature
# commits and reserves the minor bump for breaking changes. This project treats
# pre-1.0 feature additions as minor bumps, so increment the minor version on
# features even while the major version is 0.
features_always_increment_minor = true

# Prepend a representation-stability block to the release PR body (#1424).
#
# Representation stability is a shipped guarantee: the downstream consumer keys
# read counts on the normalized HGVS string, so a canonical form that churns
# between releases silently re-buckets every stored design. `CLAUDE.md` asks for
# such changes to be batched into one release, which makes the release PR the
# place to see them together — and today its body carries only the
# `cargo-semver-checks` dump, from which no reader can tell that (say) #1392
# moved cis-allele output.
#
# Setting `pr_body` replaces the default body wholesale, so the `semver_check`
# and `breaking_changes` renders below are not decoration — dropping either
# would silently delete the API-compatibility report this PR body exists to
# *add* to, on a pre-1.0 crate where that report is the only automated warning
# that a release breaks callers.
#
# The block is emitted **whether or not** anything was declared. An empty section
# that is stated beats an absent one: it turns an undeclared change from silence
# into a visible false statement, which is the only version a reviewer can act
# on.
#
# `release.changelog` is release-plz's rendered changelog for the release, so the
# group configured under `[changelog]` below shows up here automatically rather
# than in a second place that has to be kept in step.
pr_body = """
## Representation stability

Any PR that moves a normalized output should carry a `Representation-Change:`
trailer (see CONTRIBUTING.md). Those are collected into the **Representation
changes** section of the changelog below, and each entry's trailer text is
attached under its bullet by `scripts/inject_representation_disclosure.py`.

Reviewer checklist:

- [ ] Either that section lists every output-moving change in this cycle, or
      there were none and it is absent.
- [ ] Nothing in it merely *declined*. A decline reads `Representation-Change:
      none`, optionally followed by a reason, and belongs under its own type —
      not here. Spot-check two entries against their PR descriptions.
- [ ] Every entry carries its trailer's own text, quoted under the bullet, and
      that text says whether the affected inputs were previously **rejected**
      (no stored string, so free) or previously **accepted** (a real migration
      for the consumer). release-plz writes the bullet from the commit subject
      alone; `python scripts/inject_representation_disclosure.py` attaches the
      rest, and CI's `Changelog grouping audit` fails until it has been run.
      Re-run it after any push that regenerates this section — it is idempotent.

A commit under `src/normalize/`, `src/hgvs/`, `src/spdi/`, `src/project/`,
`src/reference/` or `src/error_handling/` that moved output without declaring it
means the trailer is missing. Fix that before releasing, not after.

---

{% for release in releases %}
{% if release.title %}### {{ release.title }}{% endif %}
{% if release.changelog %}{{ release.changelog }}{% endif %}
{% if release.breaking_changes %}
#### API breaking changes

{{ release.breaking_changes }}
{% endif %}
{% if release.semver_check %}
#### cargo-semver-checks

{{ release.semver_check }}
{% endif %}
{% endfor %}
"""

# Group commits carrying a `Representation-Change:` trailer into their own
# changelog section, ordered above the ordinary ones (#1424).
#
# git-cliff matches on the commit's **footer**, which is where a trailer on the
# squash commit lands — the documented example for this field is
# `{ footer = "^changelog: ?ignore", skip = true }`.
#
# Footer matching depends on `git.conventional_commits` staying enabled (it is
# release-plz's default). Verified against git-cliff 2.13.1 both ways: with it
# on, a trailered `fix:` is promoted into the group below; with it off, the
# footer rule never matches and the same commit lands in `Fixed` with no error
# and no warning. So turning that setting off would disable this grouping
# silently rather than break the build.
#
# The `<!-- N -->` prefixes are how git-cliff orders groups; they are stripped
# from the rendered heading. The six below `Representation changes` reproduce
# release-plz's own defaults, because defining `commit_parsers` at all replaces
# them wholesale — omitting them would collapse Added/Fixed into one bucket.
# `Removed` is in that default set and is easy to drop by eye, since this
# project's changelog has never had an entry under it; leaving it out would
# route a `removed:` commit into `Other` instead.
#
# For the changelog file itself: release-plz regenerates the *pending* section
# of an open release PR on every run, so a hand-written entry there is lost when
# the PR next updates. Already-released sections are not rewritten — a release
# only prepends (v0.12.0's commit touched `CHANGELOG.md` as a single +63/-0
# insertion at the top) — so a released section can be amended after the fact.
# The trailer is what gets a note in automatically, at release time.
[changelog]
commit_parsers = [
  # `Representation-Change: none` declares that a change moves NO output, so it must not
  # be listed as one. git-cliff matches a footer rule on the trailer's *presence*, not its
  # value, so without this exclusion #1523 -- a CI-only change that correctly declined --
  # rendered under "Representation changes" in v0.13.1 (#1526).
  #
  # That matters as much as the opposite failure. v0.13.0 under-reported (nothing declared,
  # section empty, disclosure reconstructed by hand from a 5.7M-row corpus diff, #1522);
  # listing non-changes is the same loss of trust from the other side, and it compounds,
  # because declining is the COMMON case for changes under those directories.
  #
  # Ordering is load-bearing: git-cliff takes the FIRST matching parser, so this exclusion
  # must precede the inclusion below. `[^\S\r\n]` is horizontal-only whitespace -- `\s`
  # would span the newline into the next trailer and let `Representation-Change:` followed
  # by a line reading `none` count as a decline.
  #
  # `(?i)` because the checker accepts `NONE`/`None` as declines (its own regex is
  # case-insensitive); without the flag an uppercase decline is grouped as a real change,
  # which is this bug in miniature. Verified against git-cliff 2.13.1.
  #
  # **The verdict is the first word; a reason may follow it** (#1555). The value used to be
  # anchored -- `(none|no|n/a|na)$` -- so `none. No file under src/ is touched` was not a
  # decline and rendered as a real change. That is not a corner case: in the v0.13.1 cycle
  # 14 of 16 commits declined, 8 of them gave a reason on the same line, and all 8 landed
  # under "Representation changes". The section listed 10 entries of which 2 were real.
  #
  # Explaining a decline is the behaviour to encourage, so the punctuation that introduces
  # the explanation must not silently invert the verdict. `,` is deliberately NOT a
  # terminator: a comma most often introduces a qualification that changes the answer
  # ("none, except two rows"), where a full stop or a dash closes it.
  #
  # The decline vocabulary and this terminator set are kept in step with `NONE_VALUES` and
  # `DECLINE_TERMINATORS` in `scripts/check_representation_change.py` by
  # `test_decline_vocabulary_matches_the_changelog_config` and
  # `test_the_two_decline_rules_agree_value_by_value`.
  #
  # **`m`, because git-cliff matches this against the whole footer value, which spans
  # lines** (#1573). Without it `$` is end-of-*string*, so the rule only fires when the
  # decline is the last thing in the message -- and anything appended after a BARE `none`
  # defeats it. That is not hypothetical: CodeRabbit appends a release-notes block to the
  # PR description, GitHub makes the description the squash body, and `3ebcdddd` (#1551)
  # declined and was then filed under "Representation changes" in the v0.14.0 changelog.
  # The `[.;:—–]` terminator above does not cover it, because the character following a
  # bare decline is a newline rather than punctuation.
  #
  # With `m` the verdict is read off the trailer's own line, which is what the checker
  # already does -- its `TRAILER_RE` is `re.IGNORECASE | re.MULTILINE` and takes the value
  # from one line. The two halves now agree by construction rather than by coincidence.
  # A reason may still span lines: `[\s\S]*` after a terminator is unchanged, and `,` is
  # still excluded, so `none, except two rows` remains a real change.
  { footer = "(?im)^Representation-Change:[^\\S\\r\\n]*(none|no|n/a|na)[^\\S\\r\\n]*(?:[.;:—–][\\s\\S]*)?$", group = "<!-- 7 -->Other" },
  # A declining commit lands in `Other` whatever its type, so a `fix:` that correctly
  # declined is not listed under `Fixed` (#1557). That is a known cost of the ordering
  # above, not an oversight, and the obvious repair does not work: **git-cliff evaluates a
  # parser's fields as OR, not AND** (measured against 2.13.1). Adding `message = "^fix"`
  # to this rule matches every `fix:` commit regardless of its trailer -- including the
  # ones declaring a real move -- which empties the section below. Omitting `group` does
  # not fall through to a later parser either; the commit keeps `group = None` and
  # git-cliff falls back to the raw conventional type, rendering headings as `fix`/`test`.
  #
  # `(?i)` here too, and not only on the exclusion above: the checker accepts any casing,
  # so a lowercase `representation-change: 577 rows move` is a REAL disclosure that a
  # case-sensitive rule drops silently into `Other`. Verified against git-cliff 2.13.1.
  { footer = "(?i)^Representation-Change:", group = "<!-- 0 -->Representation changes" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^changed", group = "<!-- 2 -->Changed" },
  { message = "^deprecated", group = "<!-- 3 -->Deprecated" },
  { message = "^removed", group = "<!-- 4 -->Removed" },
  { message = "^fix", group = "<!-- 5 -->Fixed" },
  { message = "^security", group = "<!-- 6 -->Security" },
  { message = "^.*", group = "<!-- 7 -->Other" },
]

# Strip the group-ordering prefix out of the rendered headings.
#
# The `<!-- N -->` prefixes above exist only to order the groups, and the comment on them
# used to claim git-cliff strips them from the heading. It does not: release-plz's default
# body renders `### {{ group | upper_first }}`, with no `striptags`, so every released
# section since v0.13.0 carries `### <!-- 0 -->Representation changes` in the file. It is
# an HTML comment, so GitHub renders it invisibly -- which is why it survived two releases.
#
# A postprocessor is used rather than a `body` override because `body` would replace
# release-plz's default wholesale, and that default supplies the compare link, the
# `[**breaking**]` marker and the PR links. Restating all of it to change one filter is a
# large surface to get subtly wrong for a cosmetic fix; this is one line that cannot touch
# anything else. Anchored to the heading so a `<!-- ... -->` in a commit subject survives.
postprocessors = [{ pattern = "(?m)^(#+) <!-- [0-9]+ -->", replace = "${1} " }]
