[package]
name = "ferro-hgvs"
version = "0.13.1"
edition = "2021"
rust-version = "1.87"
authors = ["ferro-hgvs contributors"]
description = "HGVS variant normalizer - part of the ferro bioinformatics toolkit"
license = "MIT"
repository = "https://github.com/fulcrumgenomics/ferro-hgvs"
keywords = ["hgvs", "variant", "normalization", "bioinformatics"]
categories = ["science", "command-line-utilities"]
readme = "README.md"
homepage = "https://github.com/fulcrumgenomics/ferro-hgvs"
exclude = [
    "tests/fixtures/bulk/*.gz",
    "tests/fixtures/validation/*_exhaustive.json.gz",
    "/vendor/",
    "/fuzz/",
    "/scripts/",
    "/python/",
    "/docs/",
    "/data/",
    "/assets/",
    "/.github/",
    "/.githooks/",
    "/acgt-landing/",
]

# The two spec generators live under `examples/` but are declared as `[[bin]]`
# targets below (they need `CARGO_BIN_EXE_*`). With auto-discovery on, cargo
# would ALSO register them as example targets — verified: `cargo metadata`
# reported each file twice, once as `bin` and once as `example` — compiling
# both copies of a ~2000-line target every build. Turning discovery off makes
# every example explicit, which is why the five previously-implicit ones are
# declared below alongside the six that already were.
autoexamples = false

[lib]
name = "ferro_hgvs"
# cdylib is required for Python bindings (built via maturin)
crate-type = ["cdylib", "lib"]

[dependencies]
nom = "8.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
noodles-vcf = "0.73"
noodles-gff = "0.57"
noodles-gtf = "0.52"
smol_str = { version = "0.3", features = ["serde"] }
flate2 = "1.0"
ahash = { version = "0.8", optional = true }
pyo3 = { version = "0.28", features = ["abi3-py310", "extension-module"], optional = true }
memmap2 = "0.9"
memchr = "2.7"
ureq = { version = "2.9", optional = true }
atty = "0.2"
log = "0.4"
# Core dependencies for prepare/check/commands (now part of main binary)
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream", "gzip", "deflate", "http2", "rustls-tls", "macos-system-configuration"] }
url = "2.4"
regex = "1.10"
once_cell = "1.20"
superintervals = "0.3"
rkyv = "0.8"
rustc-hash = "2"
lru = "0.12.5"

[features]
default = []
dhat-heap = ["dep:dhat"]
# rayon is an unconditional dependency (the CLI `-j` batch drivers use it), so
# this feature enables nothing and excludes no code from any build. It once
# gated the library `parallel` module's public API; because that gate could not
# express a capability difference, only a visibility one, it read as "this
# build cannot do parallelism" and was misread that way (#1504, #1507). The API
# is now unconditional and this is a no-op alias retained so `--features
# parallel` and the `python` feature below keep resolving.
parallel = []
validation = ["dep:ahash"]
# The Python batch API parallelizes across a rayon pool, so the `parallel`
# (rayon) feature is pulled in whenever the bindings are built.
python = ["dep:pyo3", "parallel"]
# memmap2 is now an unconditional dependency (used by the cdot rkyv loader);
# this feature is retained as a no-op for compatibility with callers that
# still pass `--features mmap`.
mmap = []
protein-fetch = ["dep:ureq"]
benchmark = ["dep:num_cpus", "dep:urlencoding", "dep:rand", "dep:tempfile", "protein-fetch", "dep:tokio", "dep:tokio-postgres", "dep:bytes", "dep:futures-util", "dep:rusqlite"]
# hgvs-rs integration for native Rust HGVS normalization comparison
hgvs-rs = ["benchmark", "dep:hgvs", "dep:postgres", "dep:biocommons-bioutils", "dep:indexmap", "dep:seqrepo"]
# Web service for multi-tool HGVS variant normalization
web-service = ["dep:axum", "dep:tokio", "dep:tower", "dep:tower-http", "dep:tracing", "dep:tracing-subscriber", "dep:toml", "dep:async-trait", "dep:urlencoding", "dep:open", "benchmark"]
# Long-running tests (e.g., full ClinVar validation). Run with: cargo test --release --features slow-tests
slow-tests = []
# dev feature includes all testable features (python requires maturin for building)
dev = ["validation", "mmap", "benchmark", "parallel", "protein-fetch", "web-service", "dep:pulldown-cmark", "dep:anyhow", "dep:serde_yaml"]

[dependencies.dhat]
version = "0.3"
optional = true

[dependencies.rayon]
version = "1.10"


[dependencies.num_cpus]
version = "1.16"
optional = true

[dependencies.urlencoding]
version = "2.1"
optional = true

[dependencies.rand]
version = "0.8"
optional = true

[dependencies.tempfile]
version = "3.14"
optional = true

[dependencies.hgvs]
version = "0.22"
optional = true

[dependencies.postgres]
version = "0.19"
optional = true

[dependencies.biocommons-bioutils]
version = "0.2"
optional = true

[dependencies.indexmap]
version = "2"
optional = true

[dependencies.seqrepo]
version = "0.10"
optional = true

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "io-util", "net"]
optional = true

[dependencies.tokio-postgres]
version = "0.7"
optional = true

[dependencies.bytes]
version = "1.5"
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

[dependencies.rusqlite]
version = "0.31"
optional = true

[dependencies.axum]
version = "0.7"
optional = true

[dependencies.tower]
version = "0.4"
optional = true

[dependencies.tower-http]
version = "0.4"
features = ["cors", "trace"]
optional = true

[dependencies.tracing]
version = "0.1"
optional = true

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]
optional = true

[dependencies.toml]
version = "0.8"
optional = true

[dependencies.async-trait]
version = "0.1"
optional = true

[dependencies.open]
version = "5"
optional = true

# Markdown parsing for the HGVS spec harvest (`examples/common/spec_harvest.rs`).
#
# OPTIONAL, and pulled in only by the non-default `dev` feature, so an ordinary
# consumer never resolves or builds it. It sits here rather than in
# `[dev-dependencies]` because the two spec generators are `[[bin]]` targets and
# binaries — unlike examples — cannot use dev-dependencies. See the `[[bin]]`
# blocks below for why they must be binaries.
# `anyhow` and `serde_yaml` are ALSO needed by the two generator `[[bin]]`
# targets, for the same reason as `pulldown-cmark`: binaries cannot use
# dev-dependencies. Both are optional and reached only through the non-default
# `dev` feature, so an ordinary consumer resolves neither.
#
# They deliberately REMAIN in `[dev-dependencies]` as well. Other test and
# example targets use them, and `tests/it` still compiles without `--features
# dev`; dropping the dev-dependency would break those configurations. Cargo
# permits a crate in both sections and unifies them for test targets.
[dependencies.anyhow]
version = "1"
optional = true

[dependencies.serde_yaml]
version = "0.9"
optional = true

[dependencies.pulldown-cmark]
version = "0.13"
default-features = false
optional = true

[dev-dependencies]
proptest = "1.0"
criterion = "0.5"
flate2 = "1.0"
tempfile = "3.14"
rstest = "0.23"
serde_yaml = "0.9"
anyhow = "1"
# Used by tests/it/generator_completeness.rs to read this manifest's own
# `[[example]]`/`[[bin]]` tables. The invariant it enforces is a property OF
# Cargo.toml (`test = true` on every generator carrying `#[cfg(test)]`), so it
# has to parse the manifest rather than substring-match it — a `test = true`
# inside a comment, or under a `[[bench]]`, must not count. `toml` is already an
# optional runtime dependency (`web-service`); it is repeated here because
# `tests/it` compiles without `--features dev`, so the optional copy is not
# guaranteed to be enabled. Cargo unifies the two for test targets.
toml = "0.8"
# Used by examples/build_conformance_snapshot.rs to record a per-entry SHA-256 of
# the harvested bases (snapshot provenance). Examples have access to
# dev-dependencies, so this stays out of the runtime dependency tree.
sha2 = "0.10"

# `test = true` because the target carries `#[cfg(test)]` units pinning the
# clause-unit definition and the quote checker — the two things the rule
# inventory's honesty rests on. Cargo does not build a target's tests unless it
# opts in; pinned by
# `it::generator_completeness::examples_with_unit_tests_opt_into_running_them`.
[[example]]
name = "generate_spec_conformance_corpus"
required-features = ["dev"]
test = true

[[example]]
name = "harvest_multi_member_cis"
required-features = ["dev"]
test = true

[[example]]
name = "capture_multi_member_pairs"
required-features = ["dev"]
test = true

[[example]]
name = "generate_cis_confluence_corpus"
required-features = ["dev"]
test = true

[[example]]
name = "build_conformance_snapshot"
required-features = ["dev"]

[[example]]
name = "derive_ng_placements"
required-features = ["dev"]

[[example]]
name = "extract_mutalyzer_genomic_windows"
required-features = ["dev"]

[[example]]
name = "generate_tool_support_tables"
required-features = ["dev"]

[[example]]
name = "generate_perf_tables"
required-features = ["dev"]

# The two spec generators are BINARIES, not examples.
#
# Tests must locate and run them, and `CARGO_BIN_EXE_<name>` — which cargo
# defines for bins only — is the only way to get that path right for the cargo
# invocation actually in flight. Deriving it by hand from `current_exe()` meant
# re-deriving the invocation, and produced a silent wrong-path bug twice: on the
# profile axis (#1224) and on the target-dir axis under `cargo llvm-cov`
# (#1225, which left `main` red for 15 commits). `CARGO_BIN_EXE_*` is resolved
# by cargo, so it is correct under any profile, target dir or cross-compile, and
# cargo guarantees the binary is freshly built before integration tests run.
#
# Their sources stay under `examples/` so the `#[path = "common/..."]` includes
# they share with `extract_spec_enumeration_windows` keep resolving;
# `autoexamples = false` in `[package]` stops cargo also auto-discovering them
# as example targets.
#
# `test = true` because both carry `#[cfg(test)]` unit tests, in the target and
# in the shared `common/` modules. Cargo does not build a target's tests unless
# it opts in, so without this they silently never run.
[[bin]]
name = "generate_spec_enumeration"
path = "examples/generate_spec_enumeration.rs"
required-features = ["dev"]
test = true

[[bin]]
name = "generate_spec_fixture"
path = "examples/generate_spec_fixture.rs"
required-features = ["dev"]
test = true

[[example]]
name = "extract_spec_enumeration_windows"
required-features = ["dev"]
test = true

[[example]]
name = "measure_spec_conformance_per_arm"
required-features = ["dev"]
test = true

[[example]]
name = "extract_spec_worked_example_windows"
required-features = ["dev"]
# `#[path]`-includes `examples/common/recording.rs`, which carries `#[cfg(test)]`
# units; `test = true` is a per-target flag, so without it those units are dead
# in *this* target however many siblings enable them. Caught by
# `it::generator_completeness::examples_with_unit_tests_opt_into_running_them`
# (#1550), which is why the invariant resolves `#[path]` includes transitively.
test = true

[[example]]
name = "derive_tx_placements"
required-features = ["dev"]

[[example]]
name = "dump_normalized_corpus"
required-features = ["dev"]
test = true

[[example]]
name = "extract_biocommons_windows"
required-features = ["dev"]

# `test = true` so the unit tests guarding `serve_transcripts_whole` — the
# widening the harvested-case gate depends on for fidelity — actually run.
[[example]]
name = "extract_case_harvest_windows"
required-features = ["dev"]
test = true

# `test = true` because the target `#[path]`-includes `examples/common/recording.rs`,
# whose `#[cfg(test)]` units are dead in any target that does not opt in — `test = true`
# is a per-target flag, not a per-file one.
[[example]]
name = "extract_split_member_separation_windows"
required-features = ["dev"]
test = true

# `test = true` so the unit tests guarding `serve_transcripts_whole` — the
# widening the authored-inversion gate depends on for fidelity — actually run.
[[example]]
name = "extract_inversion_sweep_windows"
required-features = ["dev"]
test = true

[[example]]
name = "generate_conformance_summary"
required-features = ["dev"]

[[example]]
name = "projector-bench"
required-features = ["dev"]

[[example]]
name = "report_conformance_reference_gaps"
required-features = ["dev"]
# Carries `#[cfg(test)]` unit tests; without this cargo never builds them.
# Pinned by `it::generator_completeness::examples_with_unit_tests_opt_into_running_them`
# (#1550), which is what finally caught this one after it shipped a `#[test]`
# that had never executed.
test = true

[[example]]
name = "dump_partitions"
required-features = ["dev"]

# `test = true` because the target carries `#[cfg(test)]` unit tests pinning the
# separation arithmetic — the one thing here that has already published numbers
# that were wrong. Cargo does not build a target's tests unless it opts in, so
# without this they silently never run.
[[example]]
name = "dump_confluence_divergences"
required-features = ["dev"]
test = true

# `test = true` because the target carries `#[cfg(test)]` unit tests pinning the
# three verdicts and the vacuity guard — the parts that decide whether a printed
# figure means anything. Cargo does not build a target's tests unless it opts in.
[[example]]
name = "measure_spdi_key_grouping"
required-features = ["dev"]
test = true

[[bin]]
name = "ferro"
path = "src/bin/ferro.rs"

[[bin]]
name = "ferro-benchmark"
path = "src/bin/benchmark.rs"
required-features = ["benchmark"]

[[bin]]
name = "ferro-web"
path = "src/bin/ferro-web.rs"
required-features = ["web-service"]

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "projection"
harness = false

[[bench]]
name = "baseline_head"
harness = false

[[bench]]
name = "seqfirst_align"
harness = false
required-features = ["dev"]

[profile.release]
lto = true
codegen-units = 1

# Optimize the heavy dependencies that the bulk-fixture parser tests
# (clinvar_hgvs_*, cmrg_exhaustive, paraphase_exhaustive) hit hard:
# gzip decoding (miniz_oxide via flate2) and JSON deserialization
# (serde_json deserialize_seed paths). The test-crate code itself stays
# at default debug optimization so build times for ferro-hgvs and the
# test binaries are unaffected.
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3

[profile.soak]
inherits = "test"
opt-level = 3
debug = false
debug-assertions = true
overflow-checks = true
